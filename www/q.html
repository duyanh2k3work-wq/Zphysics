<html lang="vi">

<head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/auth.js?v=20261124_sec"></script>

  <!-- KaTeX CSS & JS -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
    onload="if(typeof triggerKaTeX==='function'){triggerKaTeX(document.body);}else if(typeof renderMathInElement==='function'){renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});}"></script>
  <link rel="stylesheet" href="assets/css/pinui.css?v=20261118_feat2">
  <script src="assets/js/pinui.js?v=20261118_arial"></script>
  <script>PinUI.initTheme('light');</script>

  <style>
    :root {
      --bg-deep: #f2ede4;
      --bg: #f7f4ee;
      --card: #fdfbf7;
      --card-solid: #fdfbf7;
      --raised: #efe9df;
      --border: rgba(31, 27, 22, 0.08);
      --border-strong: rgba(31, 27, 22, 0.14);
      --shadow: rgba(31, 27, 22, 0.06);
      --text: #1f1b16;
      --text-secondary: #5e554a;
      --muted: #7b7266;
      --teal: #9c27b0;
      --accent: #9c27b0;
      --accent-hover: #7b1fa2;
      --accent-subtle: rgba(156, 39, 176, 0.10);
      --correct: #16a34a;
      --correct-subtle: rgba(22, 163, 74, 0.10);
      --wrong: #dc2626;
      --wrong-subtle: rgba(220, 38, 38, 0.08);
      --warning: #d97706;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      --bg-deep: #07080d;
      --bg: #0b0d14;
      --card: #11141c;
      --card-solid: #11141c;
      --raised: #1a1e28;
      --border: rgba(238, 240, 245, 0.08);
      --border-strong: rgba(238, 240, 245, 0.14);
      --shadow: rgba(0, 0, 0, 0.45);
      --text: #eef0f5;
      --text-secondary: #a3a9b8;
      --muted: #7a8296;
      --teal: #9c27b0;
      --accent: #9c27b0;
      --accent-hover: #ab47bc;
      --accent-subtle: rgba(156, 39, 176, 0.15);
      --correct: #4cc38a;
      --correct-subtle: rgba(76, 195, 138, 0.12);
      --wrong: #e5484d;
      --wrong-subtle: rgba(229, 72, 77, 0.12);
      --warning: #f59e0b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px 80px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      padding: 24px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .back-btn,
    .music-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
    }

    .back-btn:hover,
    .music-btn:hover {
      background: var(--raised);
      color: var(--text);
      border-color: var(--accent);
    }

    .back-btn svg,
    .music-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .music-btn.playing {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent);
    }

    .music-btn.muted {
      opacity: 0.65;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
    }

    .header-info h1 span {
      color: var(--accent);
    }

    .header-info p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── STUDENT CARD ── */
    .student-card {
      margin: 20px 0 16px;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .student-card.error {
      border-color: var(--wrong);
    }

    .student-card label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .label-icon {
      color: var(--muted);
      display: inline-flex;
      align-items: center;
    }

    .student-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      outline: none;
      transition: border-color 150ms var(--ease);
    }

    .student-input::placeholder {
      color: var(--muted);
      font-weight: 400;
    }

    .student-input:focus {
      border-color: var(--accent);
    }

    .student-card.error .student-input {
      border-color: var(--wrong);
    }

    .student-error {
      font-size: 12px;
      color: var(--wrong);
      margin-top: 6px;
      display: none;
    }

    .student-card.error .student-error {
      display: block;
    }

    /* ── STICKY TOP NAVIGATION CLUSTER ── */
    .quiz-sticky-top {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      padding: 10px 4px 12px;
      margin: 6px -4px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid transparent;
      transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
    }

    .quiz-sticky-top.is-stuck {
      border-bottom-color: var(--border-strong);
      box-shadow: 0 10px 24px -12px var(--shadow);
    }

    .study-toolbar {
      margin: 0 0 8px;
    }

    .quiz-sticky-top .progress-wrap,
    .quiz-sticky-top .q-palette-card {
      margin: 0;
    }

    .sticky-pal-toggle {
      display: none;
      height: 24px;
      padding: 0 8px;
      font-size: 11px;
      flex-shrink: 0;
    }

    .quiz-sticky-top.is-stuck .sticky-pal-toggle {
      display: inline-flex;
    }

    .quiz-sticky-top .q-palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
      gap: 6px;
      max-height: 148px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .quiz-sticky-top .qp-chip {
      min-width: 0;
      width: 100%;
    }

    #questionPaletteCard.collapsed {
      display: none !important;
    }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      margin: 0;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      box-shadow: 0 4px 16px var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .progress-text {
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      border-radius: 4px;
      background: var(--raised);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width 300ms var(--ease);
      width: 0%;
    }

    .quiz-timer {
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-subtle);
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .quiz-timer.urgent {
      color: var(--wrong);
      background: var(--wrong-subtle);
    }

    /* ── SCORE BANNER ── */
    .score-banner {
      margin: 16px 0 24px;
      padding: 24px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      text-align: center;
      display: none;
    }

    .score-banner.visible {
      display: block;
    }

    .score-value {
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 40px;
      font-weight: 500;
      line-height: 1.05;
    }

    .score-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    .score-msg {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-top: 10px;
    }

    /* ── PART HEADERS ── */
    .part-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-strong);
    }

    /* ── QUESTION CARD ── */
    .question-card {
      margin-bottom: 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: border-color 180ms var(--ease);
    }

    .question-card.correct-card {
      border-color: var(--correct);
    }

    .question-card.wrong-card {
      border-color: var(--wrong);
    }

    .q-header {
      padding: 20px 24px 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .q-num {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--raised);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .q-badge {
      font-size: 13px;
      color: var(--muted);
      min-width: 0;
    }

    .q-result-icon {
      margin-left: auto;
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .q-result-icon.is-correct {
      background: var(--correct-subtle);
      color: var(--correct);
    }

    .q-result-icon.is-wrong {
      background: var(--wrong-subtle);
      color: var(--wrong);
    }

    .q-text {
      padding: 0 24px 16px;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--text);
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .q-text img,
    .answer-text img,
    .explanation img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin: 8px 0;
    }

    /* ── ANSWER OPTIONS ── */
    .answers-list {
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      user-select: none;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .answer-option:hover {
      background: var(--raised);
      border-color: var(--border-strong);
    }

    .answer-option.selected {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }

    .answer-option.locked {
      pointer-events: none;
    }

    .answer-option.is-correct {
      border-color: var(--correct) !important;
      background: var(--correct-subtle) !important;
    }

    .answer-option.is-wrong {
      border-color: var(--wrong) !important;
      background: var(--wrong-subtle) !important;
    }

    .radio-dot {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms var(--ease);
    }

    .radio-dot::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: scale(0);
      transition: transform 150ms var(--ease);
    }

    .answer-option.selected .radio-dot {
      border-color: var(--accent);
    }

    .answer-option.selected .radio-dot::after {
      transform: scale(1);
    }

    .opt-keycap {
      min-width: 24px;
      height: 24px;
      margin-top: -1px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
    }

    .answer-option.selected .opt-keycap {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    html[data-theme="dark"] .answer-option.selected .opt-keycap {
      color: #ffffff;
    }

    .answer-option.is-correct .opt-keycap {
      background: var(--correct) !important;
      border-color: var(--correct) !important;
      color: #ffffff !important;
    }

    .answer-option.is-wrong .opt-keycap {
      background: var(--wrong) !important;
      border-color: var(--wrong) !important;
      color: #ffffff !important;
    }

    .kbd-hint-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .kbd-hint-pill {
        display: none;
      }
    }

    .answer-option.is-correct .radio-dot {
      border-color: var(--correct);
    }

    .answer-option.is-correct .radio-dot::after {
      background: var(--correct);
      transform: scale(1);
    }

    .answer-option.is-wrong .radio-dot {
      border-color: var(--wrong);
    }

    .answer-option.is-wrong .radio-dot::after {
      background: var(--wrong);
      transform: scale(1);
    }

    .answer-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* ── TRUE / FALSE STATEMENTS ── */
    .tf-statement {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .tf-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
    }

    .tf-toggles {
      flex-shrink: 0;
    }

    .tf-btn {
      padding: 5px 12px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .tf-btn:hover {
      color: var(--text);
    }

    .tf-btn.selected[data-val="Đ"] {
      color: #ffffff;
    }

    .tf-btn.selected[data-val="S"] {
      color: #ffffff;
    }

    /* ── EXPLANATION ── */
    .explanation {
      margin: 0 20px 20px;
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--raised);
      border-left: 2px solid var(--accent);
      font-size: 13px;
      color: var(--text);
      line-height: 1.65;
      display: none;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .q-text .katex-html,
    .answer-text .katex-html,
    .tf-text .katex-html,
    .explanation .katex-html,
    .qf-answer-body .katex-html,
    .qf-explain-box .katex-html {
      white-space: normal;
    }

    .q-text .katex-html > .base,
    .answer-text .katex-html > .base,
    .tf-text .katex-html > .base,
    .explanation .katex-html > .base,
    .qf-answer-body .katex-html > .base,
    .qf-explain-box .katex-html > .base {
      display: inline-block;
      max-width: 100%;
      margin: 1px 0;
    }

    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
      padding: 4px 0;
      -webkit-overflow-scrolling: touch;
    }

    .explanation.visible {
      display: block;
    }

    .explanation strong {
      font-weight: 600;
      color: var(--accent);
    }

    /* ── SUBMIT & RETRY ── */
    .submit-wrap {
      text-align: center;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      padding: 0 32px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      background: var(--accent);
      transition: background-color 150ms var(--ease), transform 150ms var(--ease);
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    html[data-theme="dark"] .submit-btn,
    html[data-theme="dark"] .grade-btn,
    html[data-theme="dark"] .review-end-btn {
      color: #ffffff;
    }

    .retry-btn {
      display: none;
      height: 40px;
      padding: 0 24px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .retry-btn.visible {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .retry-btn:hover {
      background: var(--raised);
      border-color: var(--accent);
    }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 12px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── REVIEW MODE ── */
    .review-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border-strong);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 9999;
    }

    .review-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .rv-stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .rv-stat strong {
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .review-end-btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms var(--ease);
    }

    .review-end-btn:hover {
      background: var(--accent-hover);
    }

    .review-end-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .review-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 4px 20px 20px;
    }

    .skip-btn,
    .grade-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      border-radius: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .skip-btn {
      background: var(--raised);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
    }

    .skip-btn:hover {
      color: var(--text);
    }

    .grade-btn {
      background: var(--accent);
      border: none;
      color: #ffffff;
    }

    .grade-btn:hover {
      background: var(--accent-hover);
    }

    .review-done-msg {
      text-align: center;
      padding: 56px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .review-done-msg h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .review-done-msg p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .review-card-enter {
      animation: fadeEnter 240ms var(--ease) both;
    }

    .review-card-exit {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }

    @keyframes fadeEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      animation: fadeEnter 200ms var(--ease) both;
    }

    .toast.success {
      background: var(--correct);
    }

    .toast.error {
      background: var(--wrong);
    }

    .toast.hide {
      opacity: 0;
      transition: opacity 200ms var(--ease);
    }

    /* ── HOMEWORK ONE-BY-ONE 3-LIVES MODE ── */
    .hw-hud {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      box-shadow: 0 4px 14px var(--shadow);
    }

    .hw-hud.visible {
      display: flex;
    }

    .hw-hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hw-part-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hw-part-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 24px;
      padding: 0 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      background: var(--raised);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease);
    }

    .hw-part-pill.is-active {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .hw-part-pill.is-done {
      background: var(--correct-subtle);
      border-color: var(--correct);
      color: var(--correct);
    }

    .hw-lives-wrap {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--raised);
      border: 1px solid var(--border);
      transition: background-color 180ms var(--ease), border-color 180ms var(--ease);
    }

    .hw-lives-wrap.is-danger {
      background: var(--wrong-subtle);
      border-color: var(--wrong);
    }

    .hw-lives-hearts {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .hw-heart {
      width: 17px;
      height: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--wrong);
      transition: transform 240ms var(--ease), opacity 240ms var(--ease), color 240ms var(--ease);
    }

    .hw-heart svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .hw-heart.is-lost {
      color: var(--muted);
      opacity: 0.32;
      transform: scale(0.84);
    }

    .hw-heart.is-lost svg {
      fill: none;
    }

    .hw-heart.just-lost {
      animation: heartShake 420ms var(--ease);
    }

    @keyframes heartShake {
      0%, 100% { transform: scale(0.84) translateX(0); }
      20% { transform: scale(1.15) translateX(-3px); }
      45% { transform: scale(1.05) translateX(3px); }
      70% { transform: scale(0.9) translateX(-2px); }
    }

    .hw-step-track {
      display: grid;
      grid-template-columns: repeat(14, minmax(0, 1fr));
      gap: 5px;
    }

    .hw-step-dot {
      height: 7px;
      border-radius: 999px;
      background: var(--raised);
      border: 1px solid var(--border);
      transition: background-color 180ms var(--ease), border-color 180ms var(--ease), transform 180ms var(--ease);
    }

    .hw-step-dot.is-current {
      background: var(--accent);
      border-color: var(--accent);
      transform: scaleY(1.25);
    }

    .hw-step-dot.is-correct {
      background: var(--correct);
      border-color: var(--correct);
    }

    .hw-step-dot.is-wrong {
      background: var(--wrong);
      border-color: var(--wrong);
    }

    .hw-part-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--raised);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .hw-part-banner strong {
      color: var(--accent);
    }

    .hw-card-actions {
      padding: 14px 20px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hw-action-note {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
      flex: 1;
      min-width: 180px;
    }

    .hw-action-note.is-correct {
      color: var(--correct);
      font-weight: 600;
    }

    .hw-action-note.is-wrong {
      color: var(--wrong);
      font-weight: 600;
    }

    .hw-btn-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .hw-primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms var(--ease), transform 150ms var(--ease), opacity 150ms var(--ease);
    }

    .hw-primary-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .hw-primary-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .hw-primary-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .hw-primary-btn.is-danger {
      background: var(--wrong);
    }

    .hw-primary-btn.is-danger:hover:not(:disabled) {
      filter: brightness(0.92);
      background: var(--wrong);
    }

    .hw-secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .hw-secondary-btn:hover {
      background: var(--raised);
      border-color: var(--accent);
    }

    /* ── QUESTION FEEDBACK PANEL (DUOLINGO-STYLE INTEGRATED DRAWER) ── */
    .qf-panel {
      display: none;
      padding: 18px 20px 20px;
      border-top: 1px solid transparent;
      animation: qfSlideUp 220ms var(--ease) both;
    }

    .qf-panel.visible {
      display: block;
    }

    .qf-panel.is-compact {
      padding: 14px 20px 16px;
    }

    .qf-panel.is-correct {
      background: #edf9f1;
      border-top-color: rgba(22, 163, 74, 0.22);
    }

    .qf-panel.is-wrong {
      background: #fef2f2;
      border-top-color: rgba(220, 38, 38, 0.22);
    }

    html[data-theme="dark"] .qf-panel.is-correct {
      background: #13261b;
      border-top-color: rgba(76, 195, 138, 0.26);
    }

    html[data-theme="dark"] .qf-panel.is-wrong {
      background: #221519;
      border-top-color: rgba(229, 72, 77, 0.28);
    }

    @keyframes qfSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .qf-panel {
        animation: none;
      }
    }

    .qf-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .qf-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .qf-icon-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qf-panel.is-correct .qf-icon-badge {
      background: #16a34a;
      color: #ffffff;
    }

    .qf-panel.is-wrong .qf-icon-badge {
      background: #dc2626;
      color: #ffffff;
    }

    html[data-theme="dark"] .qf-panel.is-correct .qf-icon-badge {
      background: #4cc38a;
      color: #08170f;
    }

    html[data-theme="dark"] .qf-panel.is-wrong .qf-icon-badge {
      background: #e5484d;
      color: #1a0b0c;
    }

    .qf-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .qf-panel.is-correct .qf-title {
      color: #15803d;
    }

    .qf-panel.is-wrong .qf-title {
      color: #b91c1c;
    }

    html[data-theme="dark"] .qf-panel.is-correct .qf-title {
      color: #5fd69e;
    }

    html[data-theme="dark"] .qf-panel.is-wrong .qf-title {
      color: #ff6b70;
    }

    .qf-meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .qf-meta-badge svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      stroke: currentColor;
      flex-shrink: 0;
    }

    .qf-panel.is-correct .qf-meta-badge {
      background: rgba(22, 163, 74, 0.12);
      color: #15803d;
      border: 1px solid rgba(22, 163, 74, 0.24);
    }

    .qf-panel.is-wrong .qf-meta-badge {
      background: rgba(220, 38, 38, 0.10);
      color: #b91c1c;
      border: 1px solid rgba(220, 38, 38, 0.24);
    }

    html[data-theme="dark"] .qf-panel.is-correct .qf-meta-badge {
      background: rgba(76, 195, 138, 0.15);
      color: #7ee3b3;
      border-color: rgba(76, 195, 138, 0.28);
    }

    html[data-theme="dark"] .qf-panel.is-wrong .qf-meta-badge {
      background: rgba(229, 72, 77, 0.16);
      color: #ff8a8e;
      border-color: rgba(229, 72, 77, 0.30);
    }

    .qf-section {
      margin-top: 12px;
    }

    .qf-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #b91c1c;
    }

    html[data-theme="dark"] .qf-label {
      color: #ff6b70;
    }

    .qf-answer-body {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    .qf-ans-option {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .qf-ans-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      background: rgba(220, 38, 38, 0.12);
      color: #b91c1c;
      border: 1px solid rgba(220, 38, 38, 0.25);
      flex-shrink: 0;
    }

    html[data-theme="dark"] .qf-ans-key {
      background: rgba(229, 72, 77, 0.18);
      color: #ff8a8e;
      border-color: rgba(229, 72, 77, 0.32);
    }

    .qf-ans-val {
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .qf-short-ans {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.85);
      color: #b91c1c;
      border: 1px solid rgba(220, 38, 38, 0.22);
    }

    html[data-theme="dark"] .qf-short-ans {
      background: rgba(11, 13, 20, 0.55);
      color: #ff8a8e;
      border-color: rgba(229, 72, 77, 0.28);
    }

    .qf-tf-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .qf-tf-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(220, 38, 38, 0.20);
      color: var(--text);
    }

    html[data-theme="dark"] .qf-tf-chip {
      background: rgba(11, 13, 20, 0.52);
      border-color: rgba(229, 72, 77, 0.24);
    }

    .qf-tf-chip strong {
      color: var(--text-secondary);
      font-weight: 700;
    }

    .qf-tf-chip .is-true {
      color: var(--correct);
      font-weight: 700;
    }

    .qf-tf-chip .is-false {
      color: var(--wrong);
      font-weight: 700;
    }

    .qf-explain-box {
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.80);
      border: 1px solid rgba(220, 38, 38, 0.16);
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text);
      overflow-wrap: break-word;
      word-break: break-word;
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    html[data-theme="dark"] .qf-explain-box {
      background: rgba(11, 13, 20, 0.52);
      border-color: rgba(229, 72, 77, 0.22);
      color: #eef0f5;
    }

    .qf-explain-box img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin: 8px 0;
    }

    .qf-cta-wrap {
      margin-top: 16px;
    }

    .qf-cta-btn {
      width: 100%;
      height: 46px;
      padding: 0 20px;
      border-radius: 12px;
      border: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 110ms var(--ease), box-shadow 110ms var(--ease), filter 140ms var(--ease);
    }

    .qf-cta-btn.is-correct {
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 3px 0 #15803d;
    }

    .qf-cta-btn.is-wrong {
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 3px 0 #b91c1c;
    }

    html[data-theme="dark"] .qf-cta-btn.is-correct {
      background: #4cc38a;
      color: #08170f;
      box-shadow: 0 3px 0 #2d9664;
    }

    html[data-theme="dark"] .qf-cta-btn.is-wrong {
      background: #e5484d;
      color: #ffffff;
      box-shadow: 0 3px 0 #b3262b;
    }

    .qf-cta-btn:hover {
      filter: brightness(1.04);
    }

    .qf-cta-btn:active {
      transform: translateY(2px);
    }

    .qf-cta-btn.is-correct:active {
      box-shadow: 0 1px 0 #15803d;
    }

    .qf-cta-btn.is-wrong:active {
      box-shadow: 0 1px 0 #b91c1c;
    }

    html[data-theme="dark"] .qf-cta-btn.is-correct:active {
      box-shadow: 0 1px 0 #2d9664;
    }

    html[data-theme="dark"] .qf-cta-btn.is-wrong:active {
      box-shadow: 0 1px 0 #b3262b;
    }

    .score-banner.is-failed {
      border-color: var(--wrong);
      background: var(--card);
    }

    .score-banner.is-passed {
      border-color: var(--correct);
      background: var(--card);
    }

    .hw-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hw-status-badge.is-failed {
      background: var(--wrong-subtle);
      color: var(--wrong);
      border: 1px solid rgba(220, 38, 38, 0.25);
    }

    .hw-status-badge.is-passed {
      background: var(--correct-subtle);
      color: var(--correct);
      border: 1px solid rgba(22, 163, 74, 0.25);
    }

    .hw-banner-stats {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hw-stat-chip {
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--raised);
      border: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .hw-stat-chip strong {
      color: var(--text);
    }

    .hw-banner-actions {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hw-review-heading {
      margin: 22px 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    @media (max-width: 600px) {
      .app {
        padding: 0 10px 72px;
      }

      .header {
        padding: 14px 0 12px;
        gap: 8px;
      }

      .header-info h1 {
        font-size: 16px;
      }

      .header-info p {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        line-height: 1.35;
      }

      .student-card {
        margin: 12px 0;
        padding: 12px 14px;
      }

      .quiz-sticky-top {
        padding: 4px 4px 6px;
        margin: 4px -4px 10px;
        gap: 4px;
      }

      .progress-wrap {
        padding: 6px 10px;
        min-height: 38px;
        gap: 8px;
        border-radius: 8px;
      }

      .study-toolbar {
        margin: 0 0 8px;
        padding: 8px 10px;
        gap: 8px;
        border-radius: 8px;
      }

      .study-mode-seg .seg-btn {
        height: 26px;
        padding: 0 10px;
        font-size: 11.5px;
      }

      .study-toolbar-right {
        gap: 6px;
      }

      .autosave-pill,
      .toolbar-mini-btn {
        height: 26px;
        padding: 0 8px;
        font-size: 11.5px;
      }

      .sticky-pal-toggle {
        height: 24px;
        padding: 0 7px;
        font-size: 11px;
      }

      .q-palette-card {
        padding: 6px 8px;
        border-radius: 9px;
      }

      .q-palette-head {
        gap: 6px;
      }

      .q-palette-title {
        font-size: 11.5px;

<body>

  <script>
    const SVG_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const SVG_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    const SVG_CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    const SVG_FLAG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';
    const SVG_VOL_ON = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
    const SVG_VOL_OFF = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
    const SVG_HEART = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';

    if (window.location.protocol.startsWith('http') && !window.Capacitor) {
      const path = window.location.pathname;
      if (path.endsWith('.html')) {
        let cleanPath = path.substring(0, path.length - 5);
        if (cleanPath.endsWith('/index')) {
          cleanPath = cleanPath.substring(0, cleanPath.length - 5) || '/';
        }
        history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
      }
    }

    var SUPABASE_URL = window.SUPABASE_URL || 'https://uztfmglzpfrwvamuggwx.supabase.co';
    var SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_XdBJ6z0Yj_nQyvn7FSemew_B8ewlDOM';
    var SESSION_KEY = window.SESSION_KEY || 'zphysics_session';

    function getSession() {
      try {
        const s = localStorage.getItem(SESSION_KEY);
        if (!s) return null;
        const session = JSON.parse(s);
        if (session.premium && session.premium_until) {
          const expDate = new Date(session.premium_until);
          if (expDate < new Date()) {
            session.premium = false;
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          }
        }
        return session;
      } catch {
        return null;
      }
    }

    let currentSession = null;

    function applySessionTheme(session) {
      if (session && session.premium) {
        document.body.classList.add('premium-theme');
        const explicitTheme = localStorage.getItem('zphysics_theme');
        const resolved = (explicitTheme === 'light' || explicitTheme === 'dark')
          ? explicitTheme
          : (localStorage.getItem('zphysics_premium_mode') === 'light' ? 'light' : 'dark');
        PinUI.applyTheme(resolved);
      } else {
        document.body.classList.remove('premium-theme');
        const explicitTheme = localStorage.getItem('zphysics_theme');
        PinUI.applyTheme(explicitTheme === 'dark' ? 'dark' : 'light');
      }
    }

    function setupQuizNavigationGuards() {
      const backBtn = document.querySelector('.back-btn');
      if (backBtn) {
        backBtn.addEventListener('click', (e) => {
          if (!submitted) {
            const confirmExit = confirm('Bạn có chắc chắn muốn thoát? Kết quả làm bài sẽ không được lưu.');
            if (!confirmExit) e.preventDefault();
          }
        });
      }

      window.addEventListener('beforeunload', (e) => {
        if (!submitted) {
          e.preventDefault();
          e.returnValue = 'Bạn có chắc chắn muốn thoát? Kết quả làm bài sẽ không được lưu.';
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupQuizNavigationGuards);
    } else {
      setupQuizNavigationGuards();
    }

    const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbzxnkAXTX9lMgdq854Nm8CAWiaULzHD7MAo4Er7XBVnmfxhubWP4KWSF5_yNfVaCKXMdQ/exec';

    let quizData = [];
    let rawQuizPool = [];
    let submitted = false;
    let lessonInfo = null;

    let timerInterval = null;
    let timeRemaining = 30 * 60;

    let rvIndex = 0;
    let rvCorrect = 0;
    let rvWrong = 0;
    let rvSkipped = 0;
    let rvResults = [];
    let rvAnsweredCurrent = false;

    const HW_MAX_LIVES = 3;
    let hwIndex = 0;
    let hwWrongCount = 0;
    let hwCorrectCount = 0;
    let hwResults = [];
    let hwFailed = false;
    let hwAnsweredCurrent = false;
    let hwShowingReviewList = false;

    let studyMode = 'exam';
    let flaggedQuestionIds = new Set();
    let checkedQuestionIds = new Set();
    let autosaveIntervalId = null;
    try { localStorage.removeItem('zp_mistakes_v1'); } catch (e) {}

    function getCurrentAccountEmail() {
      const s = getSession();
      return (s && s.gmail) ? String(s.gmail).trim().toLowerCase() : '';
    }

    function getCurrentAccountGrade() {
      const s = getSession();
      const m = (s && s.lop) ? String(s.lop).match(/\d+/) : null;
      return m ? m[0] : '';
    }

    function getMistakeStorageKey() {
      const email = getCurrentAccountEmail();
      return email ? `zp_mistakes_v2_${email}` : 'zp_mistakes_v2_guest';
    }

    function parseQuizCode(code) {
      if (!code) return null;
      const parts = code.split('_');
      if (parts.length >= 4) {
        const typeMap = { 'cauhoi': 'Trắc nghiệm', 'đs': 'Đúng/Sai', 'tln': 'Trả lời ngắn' };
        return {
          grade: `Vật lí ${parts[1]}`,
          chapter: `Chương ${parts[2].toUpperCase().replace('C', '')}`,
          lesson: `Bài ${parseInt(parts[3].toUpperCase().replace('B', ''), 10)}`,
          type: typeMap[parts[0]] || parts[0]
        };
      }
      return null;
    }

    function escapeTelegramHtml(text) {
      if (text === undefined || text === null) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function cleanQuestionTextForTelegram(text) {
      if (text === undefined || text === null) return '';
      const cleaned = String(text)
        .replace(/\r\n/g, '\n')
        .replace(/\[img\](.*?)\[\/img\]/gi, ' [Hình: $1] ')
        .replace(/[ \t]{2,}/g, ' ')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      return escapeTelegramHtml(cleaned);
    }

    function formatWrongQuestionReport(q, questionNumber, detail) {
      const qText = cleanQuestionTextForTelegram(q && q.question) || '(Không có nội dung câu hỏi)';
      const validAnswers = (q && Array.isArray(q.answers))
        ? q.answers.filter(a => a.text && a.text.trim() !== '')
        : [];

      if (detail.mode === 'đs') {
        const wrongStatements = detail.wrongStatements || [];
        if (wrongStatements.length === 0) {
          return `<b>Câu ${questionNumber} (Đúng/Sai):</b> ${qText}\n• Đúng: ${cleanQuestionTextForTelegram((q && q.correct) || '')}`;
        }
        const stmtLines = wrongStatements.map(s =>
          `• Ý ${escapeTelegramHtml(s.key)}: ${cleanQuestionTextForTelegram(s.text)}\n  ↳ Chọn: ${escapeTelegramHtml(s.studentVal)} | Đúng: ${escapeTelegramHtml(s.exactCorrectVal)}`
        ).join('\n');
        return `<b>Câu ${questionNumber} (Đúng/Sai - Sai ${wrongStatements.length} ý):</b> ${qText}\n${stmtLines}`;
      }

      if (detail.mode === 'cauhoi') {
        const selectedKey = detail.selectedKey;
        const chosenOpt = selectedKey ? validAnswers.find(a => a.key === selectedKey) : null;
        const correctKeyNorm = String((q && q.correct) || '').trim().toUpperCase();
        const correctOpt = validAnswers.find(a => a.key === q.correct)
          || validAnswers.find(a => String(a.key).trim().toUpperCase() === correctKeyNorm);

        const chosenText = chosenOpt
          ? `${escapeTelegramHtml(chosenOpt.key)}. ${cleanQuestionTextForTelegram(chosenOpt.text)}`
          : escapeTelegramHtml(detail.studentAnsText || 'Không chọn');
        const correctText = correctOpt
          ? `${escapeTelegramHtml(correctOpt.key)}. ${cleanQuestionTextForTelegram(correctOpt.text)}`
          : cleanQuestionTextForTelegram((q && q.correct) || '');

        return `<b>Câu ${questionNumber}:</b> ${qText}\n• Chọn: ${chosenText}\n• Đúng: ${correctText}`;
      }

      const studentInput = detail.studentAnsText || 'Bỏ trống';
      return `<b>Câu ${questionNumber} (Trả lời ngắn):</b> ${qText}\n• Điền: "${cleanQuestionTextForTelegram(studentInput)}" | Đúng: ${cleanQuestionTextForTelegram((q && q.correct) || '')}`;
    }

    function buildTelegramReportChunks(header, continuationHeader, wrongAnswersList, maxLen = 3500) {
      if (!wrongAnswersList || wrongAnswersList.length === 0) {
        return [header + '\n\n🎉 Tuyệt vời! Không sai câu nào.'];
      }

      const firstPrefix = `${header}\n\n❌ <b>Các câu làm sai:</b>\n`;
      const nextPrefix = `${continuationHeader}\n\n❌ <b>Các câu làm sai (tiếp):</b>\n`;
      const maxSingleItemLen = Math.max(500, maxLen - Math.max(firstPrefix.length, nextPrefix.length) - 40);

      const normalizedItems = [];
      wrongAnswersList.forEach(item => {
        if (item.length <= maxSingleItemLen) {
          normalizedItems.push(item);
          return;
        }
        const lines = item.split('\n');
        let part = '';
        lines.forEach(line => {
          if (line.length > maxSingleItemLen) {
            if (part) {
              normalizedItems.push(part);
              part = '';
            }
            let pos = 0;
            while (pos < line.length) {
              let end = Math.min(pos + maxSingleItemLen, line.length);
              if (end < line.length) {
                const ampIdx = line.lastIndexOf('&', end - 1);
                if (ampIdx > pos && line.indexOf(';', ampIdx) >= end) end = ampIdx;
                const ltIdx = line.lastIndexOf('<', end - 1);
                if (ltIdx > pos && line.indexOf('>', ltIdx) >= end) end = ltIdx;
              }
              if (end <= pos) end = Math.min(pos + maxSingleItemLen, line.length);
              normalizedItems.push(line.slice(pos, end));
              pos = end;
            }
          } else if (!part) {
            part = line;
          } else if (part.length + 1 + line.length <= maxSingleItemLen) {
            part += '\n' + line;
          } else {
            normalizedItems.push(part);
            part = line;
          }
        });
        if (part) normalizedItems.push(part);
      });

      const chunks = [];
      let current = firstPrefix;
      let hasItemsInCurrent = false;

      normalizedItems.forEach(item => {
        const sep = hasItemsInCurrent ? '\n\n' : '';
        if (hasItemsInCurrent && (current.length + sep.length + item.length > maxLen)) {
          chunks.push(current);
          current = nextPrefix + item;
          hasItemsInCurrent = true;
        } else {
          current += sep + item;
          hasItemsInCurrent = true;
        }
      });
      if (hasItemsInCurrent) chunks.push(current);

      if (chunks.length > 1) {
        return chunks.map((chunk, idx) => `${chunk}\n\n<i>(Phần ${idx + 1}/${chunks.length})</i>`);
      }
      return chunks;
    }

          quizDetails = `\n- Mã đề: ${escapeTelegramHtml(quizFile)}`;
        }
      }

      const safeStudentName = escapeTelegramHtml(studentName);
      const header = `📚 <b>Báo cáo kết quả:</b>${quizDetails}\n- Học sinh: <b>${safeStudentName}</b>\n- Điểm số: <b>${score}/${total}</b>`;
      const continuationHeader = `📚 <b>Báo cáo kết quả:</b>\n- Học sinh: <b>${safeStudentName}</b> (${score}/${total})`;
      const messages = buildTelegramReportChunks(header, continuationHeader, wrongAnswersList);

      (async () => {

          try {
            const res = await fetch(SHEETS_API_URL, {
              method: 'POST',

              body: JSON.stringify({

                accessToken: (currentSession && currentSession.access_token) ? currentSession.access_token : ''
              })

    function getMistakesList() {
      try {
        const raw = localStorage.getItem(getMistakeStorageKey());
        const parsed = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(parsed)) return [];
        const email = getCurrentAccountEmail();
        const userGrade = getCurrentAccountGrade();
        return parsed.filter((item) => {
          if (!item || typeof item !== 'object') return false;
          if (item.ownerEmail && email && String(item.ownerEmail).trim().toLowerCase() !== email) return false;
          if (userGrade && item.grade && String(item.grade) !== String(userGrade)) return false;
          return true;
        });
      } catch (e) {
        return [];
      }
    }

    function saveMistakesList(list) {
      try {
        localStorage.setItem(getMistakeStorageKey(), JSON.stringify(list));
      } catch (e) {}
    }

    function inferQuestionGrade(q) {
      const rawMade = String((q && (q._originMade || q.made)) || quizFile || '');
      const m = rawMade.match(/(?:^|_)(\d{2})(?:_|$)/);
      if (m) return m[1];
      if (lessonInfo && lessonInfo.grade) {
        const lm = String(lessonInfo.grade).match(/\d+/);
        if (lm) return lm[0];
      }
      return '';
    }

    function recordMistake(q) {
      if (!q || !q.question) return;
      const list = getMistakesList();
      const qKey = String(q.id);
      const email = getCurrentAccountEmail();
      const originMade = q._originMade || (isMistakeQuiz ? q.made : quizFile) || quizFile;
      const grade = q._originGrade || inferQuestionGrade(q);
      const parsedMeta = parseQuizCode(originMade);
      const lessonLabel = q._originLesson
        || (lessonInfo ? lessonInfo.lesson : '')
        || (parsedMeta ? `${parsedMeta.chapter} · ${parsedMeta.lesson}` : originMade);
      const existingIdx = list.findIndex(item => String(item.id) === qKey);

      if (existingIdx !== -1) {
        list[existingIdx].wrongCount = (list[existingIdx].wrongCount || 1) + 1;
        list[existingIdx].lastWrongAt = Date.now();
        if (email) list[existingIdx].ownerEmail = email;
        if (!list[existingIdx].grade && grade) list[existingIdx].grade = grade;
        if (!list[existingIdx].lessonTitle && lessonLabel) list[existingIdx].lessonTitle = lessonLabel;
      } else {
        list.unshift({
          id: q.id,
          ownerEmail: email,
          made: originMade,
          grade: grade,
          lessonTitle: lessonLabel,
          chapterTitle: (lessonInfo && lessonInfo.chapter) || q._originChapter || '',
          type: q.type,
          question: q.question,
          answers: q.answers,
          correct: q.correct,
          explanation: q.explanation || '',
          wrongCount: 1,
          lastWrongAt: Date.now()
        });
      }
      saveMistakesList(list.slice(0, 200));
    }

    function resolveMistake(qId) {
      const list = getMistakesList();
      const qKey = String(qId);
      const next = list.filter(item => String(item.id) !== qKey);
      if (next.length !== list.length) {
        saveMistakesList(next);
        return true;
      }
      return false;
    }

    function collectQuizAnswersState() {
      const answers = {};
      quizData.forEach(q => {
        const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
        if (q.type === 'đs' && validAnswers.length > 0) {
          const tfObj = {};
          validAnswers.forEach(a => {
            const parent = document.getElementById(`tf-${q.id}-${a.key}`);

            if (sel && sel.dataset && sel.dataset.val) {
              tfObj[a.key] = sel.dataset.val;
            }
          });
          if (Object.keys(tfObj).length > 0) answers[String(q.id)] = tfObj;
        } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
          const sel = document.querySelector(`#answers-${q.id} .answer-option.selected`);
          if (sel && sel.dataset && sel.dataset.key) {
            answers[String(q.id)] = sel.dataset.key;
          }
        } else {
          const inp = document.getElementById(`short-answer-${q.id}`);
          if (inp && inp.value.trim() !== '') {
            answers[String(q.id)] = inp.value;
          }
        }
      });
      return answers;

      if (submitted || isReviewMode || !Array.isArray(quizData) || quizData.length === 0) return;

        if (isHomeworkMode) {
          if (hwFailed) return;
          const hwDraft = {

            quizFile: quizFile,

            hwIndex: hwResults.length,

            hwCorrectCount: hwCorrectCount,
            hwResults: hwResults,
            updatedAt: Date.now()
          };

          return;
        }
        const draft = {
          quizFile: quizFile,
          questionIds: quizData.map(q => q.id),
          answers: collectQuizAnswersState(),
          flaggedIds: Array.from(flaggedQuestionIds),
          checkedIds: Array.from(checkedQuestionIds),

      if (!card) return;
      const isCollapsed = card.classList.toggle('collapsed');
      if (btn) btn.textContent = isCollapsed ? 'Hiện bảng câu hỏi' : 'Ẩn bảng câu hỏi';
      if (stickyBtn) stickyBtn.textContent = isCollapsed ? 'Hiện bảng' : 'Ẩn bảng';
