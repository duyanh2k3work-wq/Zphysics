<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zphysics — Trắc nghiệm Vật lí</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- KaTeX CSS & JS -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
    onload="if(typeof triggerKaTeX==='function'){triggerKaTeX(document.body);}else if(typeof renderMathInElement==='function'){renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});}"></script>
  <link rel="stylesheet" href="assets/css/pinui.css">
  <script src="assets/js/pinui.js"></script>
  <script>PinUI.initTheme('light');</script>

  <style>
    :root {
      --bg-deep: #f2ede4;
      --bg: #f7f4ee;
      --card: #fdfbf7;
      --card-solid: #fdfbf7;
      --raised: #efe9df;
      --border: rgba(31, 27, 22, 0.08);
      --border-strong: rgba(31, 27, 22, 0.14);
      --shadow: rgba(31, 27, 22, 0.06);
      --text: #1f1b16;
      --text-secondary: #5e554a;
      --muted: #7b7266;
      --teal: #0d9488;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --accent-subtle: rgba(13, 148, 136, 0.10);
      --correct: #16a34a;
      --correct-subtle: rgba(22, 163, 74, 0.10);
      --wrong: #dc2626;
      --wrong-subtle: rgba(220, 38, 38, 0.08);
      --warning: #d97706;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      --bg-deep: #07080d;
      --bg: #0b0d14;
      --card: #11141c;
      --card-solid: #11141c;
      --raised: #1a1e28;
      --border: rgba(238, 240, 245, 0.08);
      --border-strong: rgba(238, 240, 245, 0.14);
      --shadow: rgba(0, 0, 0, 0.45);
      --text: #eef0f5;
      --text-secondary: #a3a9b8;
      --muted: #7a8296;
      --teal: #2dd4bf;
      --accent: #2dd4bf;
      --accent-hover: #14b8a6;
      --accent-subtle: rgba(45, 212, 191, 0.12);
      --correct: #4cc38a;
      --correct-subtle: rgba(76, 195, 138, 0.12);
      --wrong: #e5484d;
      --wrong-subtle: rgba(229, 72, 77, 0.12);
      --warning: #f59e0b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px 80px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      padding: 24px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .back-btn,
    .music-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
    }

    .back-btn:hover,
    .music-btn:hover {
      background: var(--raised);
      color: var(--text);
      border-color: var(--accent);
    }

    .back-btn svg,
    .music-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .music-btn.playing {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent);
    }

    .music-btn.muted {
      opacity: 0.65;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
    }

    .header-info h1 span {
      color: var(--accent);
    }

    .header-info p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── STUDENT CARD ── */
    .student-card {
      margin: 20px 0 16px;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .student-card.error {
      border-color: var(--wrong);
    }

    .student-card label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .label-icon {
      color: var(--muted);
      display: inline-flex;
      align-items: center;
    }

    .student-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      outline: none;
      transition: border-color 150ms var(--ease);
    }

    .student-input::placeholder {
      color: var(--muted);
      font-weight: 400;
    }

    .student-input:focus {
      border-color: var(--accent);
    }

    .student-card.error .student-input {
      border-color: var(--wrong);
    }

    .student-error {
      font-size: 12px;
      color: var(--wrong);
      margin-top: 6px;
      display: none;
    }

    .student-card.error .student-error {
      display: block;
    }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      position: sticky;
      top: 12px;
      z-index: 100;
      margin: 16px 0 24px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      box-shadow: 0 4px 16px var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .progress-text {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      border-radius: 4px;
      background: var(--raised);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width 300ms var(--ease);
      width: 0%;
    }

    .quiz-timer {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-subtle);
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .quiz-timer.urgent {
      color: var(--wrong);
      background: var(--wrong-subtle);
    }

    /* ── SCORE BANNER ── */
    .score-banner {
      margin: 16px 0 24px;
      padding: 24px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      text-align: center;
      display: none;
    }

    .score-banner.visible {
      display: block;
    }

    .score-value {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 40px;
      font-weight: 500;
      line-height: 1.05;
    }

    .score-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    .score-msg {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-top: 10px;
    }

    /* ── PART HEADERS ── */
    .part-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-strong);
    }

    /* ── QUESTION CARD ── */
    .question-card {
      margin-bottom: 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: border-color 180ms var(--ease);
    }

    .question-card.correct-card {
      border-color: var(--correct);
    }

    .question-card.wrong-card {
      border-color: var(--wrong);
    }

    .q-header {
      padding: 20px 24px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .q-num {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--raised);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .q-badge {
      font-size: 13px;
      color: var(--muted);
    }

    .q-result-icon {
      margin-left: auto;
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .q-result-icon.is-correct {
      background: var(--correct-subtle);
      color: var(--correct);
    }

    .q-result-icon.is-wrong {
      background: var(--wrong-subtle);
      color: var(--wrong);
    }

    .q-text {
      padding: 0 24px 16px;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--text);
    }

    .q-text img,
    .answer-text img,
    .explanation img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin: 8px 0;
    }

    /* ── ANSWER OPTIONS ── */
    .answers-list {
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      user-select: none;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .answer-option:hover {
      background: var(--raised);
      border-color: var(--border-strong);
    }

    .answer-option.selected {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }

    .answer-option.locked {
      pointer-events: none;
    }

    .answer-option.is-correct {
      border-color: var(--correct) !important;
      background: var(--correct-subtle) !important;
    }

    .answer-option.is-wrong {
      border-color: var(--wrong) !important;
      background: var(--wrong-subtle) !important;
    }

    .radio-dot {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms var(--ease);
    }

    .radio-dot::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: scale(0);
      transition: transform 150ms var(--ease);
    }

    .answer-option.selected .radio-dot {
      border-color: var(--accent);
    }

    .answer-option.selected .radio-dot::after {
      transform: scale(1);
    }

    .answer-option.is-correct .radio-dot {
      border-color: var(--correct);
    }

    .answer-option.is-correct .radio-dot::after {
      background: var(--correct);
      transform: scale(1);
    }

    .answer-option.is-wrong .radio-dot {
      border-color: var(--wrong);
    }

    .answer-option.is-wrong .radio-dot::after {
      background: var(--wrong);
      transform: scale(1);
    }

    .answer-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
      flex: 1;
    }

    /* ── TRUE / FALSE STATEMENTS ── */
    .tf-statement {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .tf-text {
      flex: 1;
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
    }

    .tf-toggles {
      flex-shrink: 0;
    }

    .tf-btn {
      padding: 5px 12px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .tf-btn:hover {
      color: var(--text);
    }

    .tf-btn.selected[data-val="Đ"] {
      color: #ffffff;
    }

    .tf-btn.selected[data-val="S"] {
      color: #ffffff;
    }

    /* ── EXPLANATION ── */
    .explanation {
      margin: 0 20px 20px;
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--raised);
      border-left: 2px solid var(--accent);
      font-size: 13px;
      color: var(--text);
      line-height: 1.65;
      display: none;
    }

    .explanation.visible {
      display: block;
    }

    .explanation strong {
      font-weight: 600;
      color: var(--accent);
    }

    /* ── SUBMIT & RETRY ── */
    .submit-wrap {
      text-align: center;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      padding: 0 32px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      background: var(--accent);
      transition: background-color 150ms var(--ease), transform 150ms var(--ease);
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    html[data-theme="dark"] .submit-btn,
    html[data-theme="dark"] .grade-btn,
    html[data-theme="dark"] .review-end-btn {
      color: #07080d;
    }

    .retry-btn {
      display: none;
      height: 40px;
      padding: 0 24px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .retry-btn.visible {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .retry-btn:hover {
      background: var(--raised);
      border-color: var(--accent);
    }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 12px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── REVIEW MODE ── */
    .review-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border-strong);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 9999;
    }

    .review-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .rv-stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .rv-stat strong {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .review-end-btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms var(--ease);
    }

    .review-end-btn:hover {
      background: var(--accent-hover);
    }

    .review-end-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .review-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 4px 20px 20px;
    }

    .skip-btn,
    .grade-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .skip-btn {
      background: var(--raised);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
    }

    .skip-btn:hover {
      color: var(--text);
    }

    .grade-btn {
      background: var(--accent);
      border: none;
      color: #ffffff;
    }

    .grade-btn:hover {
      background: var(--accent-hover);
    }

    .review-done-msg {
      text-align: center;
      padding: 56px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .review-done-msg h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .review-done-msg p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .review-card-enter {
      animation: fadeEnter 240ms var(--ease) both;
    }

    .review-card-exit {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }

    @keyframes fadeEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      animation: fadeEnter 200ms var(--ease) both;
    }

    .toast.success {
      background: var(--correct);
    }

    .toast.error {
      background: var(--wrong);
    }

    .toast.hide {
      opacity: 0;
      transition: opacity 200ms var(--ease);
    }

    @media (max-width: 600px) {
      .q-header,
      .q-text {
        padding-left: 16px;
        padding-right: 16px;
      }

      .answers-list,
      .explanation {
        padding-left: 16px;
        padding-right: 16px;
        margin-left: 16px;
        margin-right: 16px;
      }

      .answers-list {
        margin-left: 0;
        margin-right: 0;
      }

      .tf-statement {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <a class="back-btn" href="./" title="Quay lại">
        <svg viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </a>
      <div class="header-info">
        <h1>Z<span>physics</span> — Trắc nghiệm</h1>
        <p id="headerSubtitle">Kiểm tra kiến thức Vật lí</p>
      </div>
      <button type="button" class="pts-toggle" onclick="PinUI.toggleTheme(this)" aria-label="Đổi giao diện sáng tối" aria-pressed="false">

  <script>
    const SVG_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const SVG_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    const SVG_CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    const SVG_VOL_ON = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
    const SVG_VOL_OFF = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';

    if (window.location.protocol.startsWith('http') && !window.Capacitor) {
      const path = window.location.pathname;
      if (path.endsWith('.html')) {
        let cleanPath = path.substring(0, path.length - 5);
        if (cleanPath.endsWith('/index')) {
          cleanPath = cleanPath.substring(0, cleanPath.length - 5) || '/';
        }
        history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
      }
    }

    var SUPABASE_URL = window.SUPABASE_URL || 'https://uztfmglzpfrwvamuggwx.supabase.co';
    var SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_XdBJ6z0Yj_nQyvn7FSemew_B8ewlDOM';
    var SESSION_KEY = window.SESSION_KEY || 'zphysics_session';

    function getSession() {
      try {
        const s = localStorage.getItem(SESSION_KEY);
        if (!s) return null;
        const session = JSON.parse(s);
        if (session.premium && session.premium_until) {
          const expDate = new Date(session.premium_until);
          if (expDate < new Date()) {
            session.premium = false;
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          }
        }
        return session;
      } catch {
        return null;
      }
    }

    const currentSession = getSession();
    if (!currentSession || !currentSession.gmail) {
      window.location.href = './';
    } else {
      if (currentSession.premium) {
        document.body.classList.add('premium-theme');
        const explicitTheme = localStorage.getItem('zphysics_theme');
        const resolved = (explicitTheme === 'light' || explicitTheme === 'dark')
          ? explicitTheme
          : (localStorage.getItem('zphysics_premium_mode') === 'light' ? 'light' : 'dark');
        PinUI.applyTheme(resolved);
      } else {
        const explicitTheme = localStorage.getItem('zphysics_theme');
        PinUI.applyTheme(explicitTheme === 'dark' ? 'dark' : 'light');
      }

      if (currentSession.gmail.startsWith('demo_')) {
        window.addEventListener('DOMContentLoaded', () => {
          const nameInput = document.getElementById('studentName');
          if (nameInput) {
            nameInput.value = currentSession.ten || 'Demo Student';
            nameInput.disabled = true;
            nameInput.style.opacity = '0.7';
          }
        });
      } else {
        const authHeader = currentSession.access_token ? `Bearer ${currentSession.access_token}` : `Bearer ${SUPABASE_ANON_KEY}`;
        const checkUrl = `${SUPABASE_URL}/rest/v1/students?email=eq.${encodeURIComponent(currentSession.gmail)}&select=*`;
        fetch(checkUrl, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': authHeader
          }
        })
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(students => {
            if (!students || students.length === 0) {
              localStorage.removeItem(SESSION_KEY);
              window.location.href = './';
            } else {
              const student = students[0];
              const isPremium = student.role === 'premium' && (!student.premium_until || new Date(student.premium_until) > new Date());
              localStorage.setItem(SESSION_KEY, JSON.stringify({
                gmail: currentSession.gmail,
                ten: student.full_name || currentSession.gmail,
                premium: isPremium,
                premium_until: student.premium_until,
                access_token: currentSession.access_token
              }));

              if (isPremium) {
                document.body.classList.add('premium-theme');
                const explicitTheme = localStorage.getItem('zphysics_theme');
                const resolved = (explicitTheme === 'light' || explicitTheme === 'dark')
                  ? explicitTheme
                  : (localStorage.getItem('zphysics_premium_mode') === 'light' ? 'light' : 'dark');
                PinUI.applyTheme(resolved);
              } else {
                document.body.classList.remove('premium-theme');
                const explicitTheme = localStorage.getItem('zphysics_theme');
                PinUI.applyTheme(explicitTheme === 'dark' ? 'dark' : 'light');
              }

              const nameInput = document.getElementById('studentName');
              if (nameInput) {
                nameInput.value = student.full_name || currentSession.gmail;
              }
            }
          })
          .catch(err => {
            console.warn('Lỗi xác thực trực tuyến trang trắc nghiệm, dùng phiên offline:', err);
          });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (currentSession && currentSession.ten && !currentSession.gmail.startsWith('demo_')) {
        const nameInput = document.getElementById('studentName');
        if (nameInput) {
          nameInput.value = currentSession.ten;
          nameInput.disabled = true;
          nameInput.style.opacity = '0.7';
        }
      }

      const backBtn = document.querySelector('.back-btn');
      if (backBtn) {
        backBtn.addEventListener('click', (e) => {
          if (!submitted) {
            const confirmExit = confirm('Bạn có chắc chắn muốn thoát? Kết quả làm bài sẽ không được lưu.');
            if (!confirmExit) e.preventDefault();
          }
        });
      }

      window.addEventListener('beforeunload', (e) => {
        if (!submitted) {
          e.preventDefault();
          e.returnValue = 'Bạn có chắc chắn muốn thoát? Kết quả làm bài sẽ không được lưu.';
        }
      });
    });

    const SHEETS_API_URL = localStorage.getItem('ZPHYSICS_API_URL') || 'https://script.google.com/macros/s/AKfycbzxnkAXTX9lMgdq854Nm8CAWiaULzHD7MAo4Er7XBVnmfxhubWP4KWSF5_yNfVaCKXMdQ/exec';

    let quizData = [];
    let submitted = false;
    let lessonInfo = null;

    let timerInterval = null;
    let timeRemaining = 30 * 60;

    let rvIndex = 0;
    let rvCorrect = 0;
    let rvWrong = 0;
    let rvSkipped = 0;
    let rvResults = [];

    function parseQuizCode(code) {
      if (!code) return null;
      const parts = code.split('_');
      if (parts.length >= 4) {
        const typeMap = { 'cauhoi': 'Trắc nghiệm', 'đs': 'Đúng/Sai', 'tln': 'Trả lời ngắn' };
        return {
          grade: `Vật lí ${parts[1]}`,
          chapter: `Chương ${parts[2].toUpperCase().replace('C', '')}`,
          lesson: `Bài ${parseInt(parts[3].toUpperCase().replace('B', ''), 10)}`,
          type: typeMap[parts[0]] || parts[0]
        };
      }
      return null;
    }

    function sendResultToTelegram(studentName, score, total, wrongAnswersList) {
      let quizDetails = '';
      if (lessonInfo) {
        quizDetails = `\n- Lớp: ${lessonInfo.grade}\n- Chương: ${lessonInfo.chapter}\n- Bài học: ${lessonInfo.lesson}`;
      } else {
        const parsed = parseQuizCode(quizFile);
        if (parsed) {
          quizDetails = `\n- Lớp: ${parsed.grade}\n- ${parsed.chapter}\n- ${parsed.lesson} (${parsed.type})`;
        } else {
          quizDetails = `\n- Mã đề: ${quizFile}`;
        }
      }

      let message = `📚 Báo cáo kết quả:${quizDetails}\n- Học sinh: ${studentName}\n- Điểm số: ${score}/${total}`;

      if (wrongAnswersList && wrongAnswersList.length > 0) {
        message += `\n\n❌ Các câu làm sai:\n${wrongAnswersList.join('\n')}`;
      } else if (wrongAnswersList && wrongAnswersList.length === 0) {
        message += `\n\n🎉 Tuyệt vời! Không sai câu nào.`;
      }

      fetch(SHEETS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'sendReport', message: message })
      })
        .then(res => {
          showToast(res.ok ? 'Đã nộp bài thành công' : 'Đã nộp bài', 'success');
        })
        .catch(() => {
          showToast('Đã nộp bài', 'success');
        });
    }

    function showToast(msg, type) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.textContent = msg;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    const params = new URLSearchParams(window.location.search);
    let quizFile = params.get('quiz');

    if (!quizFile && window.location.hash) {
      const hashVal = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hashVal);
      if (hashParams.has('quiz')) {
        quizFile = hashParams.get('quiz');
      } else if (hashVal && !hashVal.includes('=')) {
        quizFile = hashVal;
      }
    }
    if (!quizFile || quizFile === 'cauhoi') quizFile = 'baitap_10_c1_b01';
    try { quizFile = decodeURIComponent(quizFile); } catch (e) {}
    if (quizFile === 'cauhoi') quizFile = 'baitap_10_c1_b01';

    const isReviewMode = quizFile.startsWith('ontap_');

    if (window.location.protocol.startsWith('http') && !window.Capacitor) {
      const cleanPath = window.location.pathname.replace(/\.html$/, '');
      if (window.location.search.includes('quiz=')) {
        history.replaceState(null, '', cleanPath + '#' + quizFile);
      }
    }

    function loadLessonInfo() {
      fetch('baihoc.json')
        .then(res => res.json())
        .then(data => {
          let searchCode = quizFile;
          if (quizFile.startsWith('ontap_')) {
            searchCode = 'baitap_' + quizFile.substring('ontap_'.length);
          }
          const baseCode = searchCode.replace(/^(baitap|ontap|cauhoi|đs|tln)_/, '');
          const codeParts = baseCode.split('_');
          const targetGrade = codeParts[0] || '';
          const targetChapter = codeParts[1] ? codeParts[1].replace('c', '') : '';
          const targetLesson = codeParts[2] ? codeParts[2].replace('b', '') : '';
          const romanMap = { 'I': '1', 'II': '2', 'III': '3', 'IV': '4', 'V': '5', 'VI': '6', 'VII': '7', 'VIII': '8', 'IX': '9', 'X': '10' };

          for (const gradeItem of data) {
            const gMatch = targetGrade && gradeItem.grade && gradeItem.grade.includes(targetGrade);
            for (const chapterItem of gradeItem.chapters) {
              let cRaw = chapterItem.num.replace(/chương/i, '').trim().toUpperCase();
              const cNum = romanMap[cRaw] || cRaw;

              for (const lessonItem of chapterItem.lessons) {
                const links = lessonItem.links || {};
                const lNum = lessonItem.num ? lessonItem.num.replace(/^0+/, '') : '';
                const tLessonClean = targetLesson.replace(/^0+/, '');

                const isMatchByLinks = Object.values(links).some(link => typeof link === 'string' && (link.includes(searchCode) || (baseCode && link.includes(baseCode))));
                const isMatchByStructure = gMatch && (cNum === targetChapter) && (lNum === tLessonClean);

                if (isMatchByLinks || isMatchByStructure) {
                  lessonInfo = {
                    grade: gradeItem.grade,
                    chapter: chapterItem.num + (chapterItem.title ? `: ${chapterItem.title}` : ''),
                    lesson: `Bài ${lessonItem.num}: ${lessonItem.title}`
                  };

                  const subtitleEl = document.getElementById('headerSubtitle');
                  if (subtitleEl) {
                    const modeText = isReviewMode ? 'Ôn tập chuyên sâu' : (quizFile.startsWith('baitap_') ? 'Bài tập về nhà' : 'Kiểm tra kiến thức Vật lí');
                    subtitleEl.textContent = `${lessonInfo.lesson} · ${modeText}`;
                  }
                  const h1El = document.querySelector('.header-info h1');
                  if (h1El) {
                    if (isReviewMode) {
                      h1El.innerHTML = 'Z<span>physics</span> — Ôn tập';
                    } else if (quizFile.startsWith('baitap_')) {
                      h1El.innerHTML = 'Z<span>physics</span> — Bài tập';
                    }
                  }
                  return;
                }
              }
            }
          }
        })
        .catch(err => console.error('Lỗi khi tải thông tin bài học:', err));
    }
    loadLessonInfo();

    function processQuizData(data) {
      if (!data || !Array.isArray(data) || data.length === 0) return false;

      let part1 = [];
      let part2 = [];
      let part3 = [];

      data.forEach(item => {
        let type = 'cauhoi';
        if (item.type) {
          type = item.type;
        } else if (item.made) {
          if (item.made.startsWith('đs')) type = 'đs';
          else if (item.made.startsWith('tln')) type = 'tln';
        }

        const q = {
          id: item.id,
          type: type,
          question: item.question,
          answers: item.answers || [
            { key: 'A', text: item.a },
            { key: 'B', text: item.b },
            { key: 'C', text: item.c },
            { key: 'D', text: item.d }
          ],
          correct: item.correct,
          explanation: item.explanation
        };

        if (type === 'cauhoi') part1.push(q);
        else if (type === 'đs') part2.push(q);
        else part3.push(q);
      });

      const shuffle = (arr) => {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      };

      part1 = shuffle(part1);
      part2 = shuffle(part2);
      part3 = shuffle(part3);

      if (quizFile.startsWith('baitap_')) {
        part1 = part1.slice(0, 9);
        part2 = part2.slice(0, 2);
        part3 = part3.slice(0, 3);
      } else if (quizFile.startsWith('ontap_')) {
        // Keep all questions
      } else if (quizFile.startsWith('cauhoi')) {
        part1 = part1.slice(0, 18); part2 = []; part3 = [];
      } else if (quizFile.startsWith('đs')) {
        part2 = part2.slice(0, 4); part1 = []; part3 = [];
      } else if (quizFile.startsWith('tln')) {
        part3 = part3.slice(0, 6); part1 = []; part2 = [];
      }

      let mappedData = [...part1, ...part2, ...part3];

      if (quizFile.startsWith('ontap_')) {
        mappedData = shuffle(mappedData);
      }

      quizData = mappedData;
      renderQuiz(mappedData);
      startTimer();
      return true;
    }

    function loadQuizFromSupabase() {
      const cacheKey = 'zphysics_quiz_cache_' + quizFile;
      let hasRendered = false;

      try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          const cachedData = JSON.parse(cached);
          if (Array.isArray(cachedData) && cachedData.length > 0) {
            hasRendered = processQuizData(cachedData);
          }
        }
      } catch (e) {}

      let url = `${SUPABASE_URL}/rest/v1/questions?made=eq.${encodeURIComponent(quizFile)}&select=*`;

      if (quizFile.startsWith('baitap_') || quizFile.startsWith('ontap_')) {
        const prefix = quizFile.startsWith('baitap_') ? 'baitap_' : 'ontap_';
        const rest = quizFile.substring(prefix.length);
        const inVals = `cauhoi_${rest},đs_${rest},tln_${rest}`;
        url = `${SUPABASE_URL}/rest/v1/questions?made=in.(${encodeURIComponent(inVals)})&select=*`;
      }

      fetch(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          if (!data || !Array.isArray(data) || data.length === 0) {
            if (!hasRendered) throw new Error('Đề thi trống hoặc mã đề không chính xác');
            return;
          }

          try {
            localStorage.setItem(cacheKey, JSON.stringify(data));
          } catch (e) {}

          if (!hasRendered) {
            processQuizData(data);
          }
        })
        .catch(err => {
          console.error(err);
          if (!hasRendered) {
            document.getElementById('quizContainer').innerHTML =
              '<div class="loading"><p style="color:var(--wrong);font-weight:500;font-size:14px">Không tải được đề từ Database Supabase.<br><small style="opacity:.7">'
              + (err.message || 'Hãy kiểm tra lại kết nối mạng và mã đề thi.')
              + '</small></p></div>';
          }
        });
    }

    loadQuizFromSupabase();

    function preprocessMath(text) {
      if (!text) return '';

      let res = text
        .replace(/\\bar\{Ed1\}/g, '\\overline{E_{d1}}')
        .replace(/\\bar\{Ed2\}/g, '\\overline{E_{d2}}')
        .replace(/\\bar\{Ed\}/g, '\\overline{E_d}')
        .replace(/\\bar\{E_d\}/g, '\\overline{E_d}')
        .replace(/\\bar\{E_đ\}/g, '\\overline{E_đ}')
        .replace(/\\bar\{v[²2]\}/g, '\\overline{v^2}')
        .replace(/\\bar\{s\}/g, '\\overline{s}')
        .replace(/\\bar\{t\}/g, '\\overline{t}')
        .replace(/\\bar\{v\}/g, '\\overline{v}')
        .replace(/\\bar\{\\Delta\s*t\}/g, '\\overline{\\Delta t}')
        .replace(/\\bar\{Δt\}/g, '\\overline{\\Delta t}');

      const mathRegex = /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\$[^\$\n]+?\$|\\\([\s\S]*?\\\))/g;
      const parts = res.split(mathRegex);
      const tokens = [];

      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          tokens.push(parts[i]);
          continue;
        }

        let p = parts[i];
        if (!p) continue;

        if (p.includes('\\')) {
          const hasVietnamese = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(p);

          if (!hasVietnamese && (/[=><≈±\/\^]/.test(p) || p.trim().startsWith('\\'))) {
            let clean = p.trim();
            let endPunct = '';
            if (/[.,;:]$/.test(clean)) {
              endPunct = clean.slice(-1);
              clean = clean.slice(0, -1).trim();
            }
            tokens.push('$' + clean + '$' + endPunct);
          } else {
            let replaced = p.replace(/(\\(?:overline|bar|hat|vec|dot|ddot|frac|sqrt)\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}|\\(?:Delta|delta|alpha|beta|gamma|lambda|mu|omega|Omega|pi|theta|sigma|rho|tau|phi|varphi|pm|approx|le|ge|times|cdot|ne|neq|Rightarrow|to)(?:\s+[a-zA-Z0-9_]+)?)/g, (m, g1) => '$' + g1.trim() + '$');
            tokens.push(replaced);
          }
        } else {
          tokens.push(p);
        }
      }
      return tokens.join('');
    }

    function triggerKaTeX(el) {
      const target = el || document.getElementById('quizContainer') || document.body;
      if (typeof renderMathInElement === 'function') {
        try {
          renderMathInElement(target, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '\\[', right: '\\]', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX render error:', e);
        }
      } else {
        let attempts = 0;
        const interval = setInterval(() => {
          attempts++;
          if (typeof renderMathInElement === 'function') {
            clearInterval(interval);
            triggerKaTeX(target);
          } else if (attempts > 20) {
            clearInterval(interval);
          }
        }, 150);
      }
    }

    function formatText(text) {
      if (!text) return '';
      text = preprocessMath(text);

      let html = text.replace(/\[img\](.*?)\[\/img\]/gi, '\n__IMG__$1__ENDIMG__\n');
      const imgUrlRegex = /(https?:\/\/[^\s<>"]+?(?:\.(?:jpg|jpeg|png|gif|webp|svg|bmp)(?:[?#][^\s<>"]*)?|(?:drive\.google\.com\/(?:file\/d\/[^/\s]+\/view|uc\?[^\s<>"]*export=download[^\s<>"]*|uc\?[^\s<>"]*id=[^\s<>"]+)|i\.imgur\.com\/[^\s<>"]+|ibb\.co\/[^\s<>"]+|postimg\.cc\/[^\s<>"]+|i\.postimg\.cc\/[^\s<>"]+)))/gi;
      html = html.replace(imgUrlRegex, '\n__IMG__$1__ENDIMG__\n');

      html = html.replace(/__IMG__(https?:\/\/drive\.google\.com\/file\/d\/([^/\s]+)\/view[^\s]*)__ENDIMG__/gi,
        function (match, url, fileId) {
          return `__IMG__https://drive.google.com/uc?export=view&id=${fileId}__ENDIMG__`;
        }
      );

      html = html.replace(/__IMG__(.*?)__ENDIMG__/gi,
        '<br><img src="$1" onerror="this.style.display=\'none\'" loading="lazy"><br>'
      );

      html = html.replace(/\n/g, '<br>');
      html = html.replace(/(<br\s*\/?>\s*){3,}/gi, '<br><br>');
      return html;
    }

    function renderQuiz(data) {
      const container = document.getElementById('quizContainer');
      container.innerHTML = '';
      document.getElementById('progressText').textContent = `0 / ${data.length}`;

      if (isReviewMode) {
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) submitBtn.style.display = 'none';
        const reviewBar = document.getElementById('reviewBar');
        if (reviewBar) reviewBar.style.display = 'flex';

        rvIndex = 0;
        rvCorrect = 0;
        rvWrong = 0;
        rvSkipped = 0;
        rvResults = [];
        updateReviewBar();
        showReviewCard();
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) submitBtn.style.display = '';
      const reviewBar = document.getElementById('reviewBar');
      if (reviewBar) reviewBar.style.display = 'none';

      let p1Count = 0, p2Count = 0, p3Count = 0;
      data.forEach(q => {
        if (q.type === 'cauhoi') p1Count++;
        else if (q.type === 'đs') p2Count++;
        else p3Count++;
      });

      data.forEach((q, idx) => {
        if (quizFile.startsWith('baitap_')) {
          if (idx === 0 && p1Count > 0) {
            container.insertAdjacentHTML('beforeend', `<div class="part-header">Phần I. Câu trắc nghiệm nhiều phương án lựa chọn</div>`);
          } else if (idx === p1Count && p2Count > 0) {
            container.insertAdjacentHTML('beforeend', `<div class="part-header">Phần II. Câu trắc nghiệm đúng sai</div>`);
          } else if (idx === p1Count + p2Count && p3Count > 0) {
            container.insertAdjacentHTML('beforeend', `<div class="part-header">Phần III. Câu trắc nghiệm trả lời ngắn</div>`);
          }
        }

        const card = document.createElement('div');
        card.className = 'question-card';
        card.dataset.id = q.id;

        const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
        let answersHTML = '';

        if (q.type === 'đs' && validAnswers.length > 0) {
          answersHTML = validAnswers.map(a => `
            <div class="tf-statement" id="tf-${q.id}-${a.key}">
              <div class="tf-text"><strong>${a.key}.</strong> ${formatText(a.text)}</div>
              <div class="tf-toggles seg-control tf-seg" data-selected="none">
                <span class="seg-thumb"></span>
                <div class="tf-btn seg-btn" data-val="Đ" onclick="selectTF(this, ${q.id}, '${a.key}', 'Đ')">Đúng</div>
                <div class="tf-btn seg-btn" data-val="S" onclick="selectTF(this, ${q.id}, '${a.key}', 'S')">Sai</div>
              </div>
            </div>
          `).join('');
        } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
          answersHTML = validAnswers.map(a => `
            <label class="answer-option" data-key="${a.key}" onclick="selectAnswer(this, ${q.id})">
              <span class="radio-dot"></span>
              <span class="answer-text">${formatText(a.text)}</span>
            </label>
          `).join('');
        } else {
          answersHTML = `
            <div>
              <input type="text" class="student-input" id="short-answer-${q.id}" placeholder="Nhập câu trả lời" oninput="inputShortAnswer()">
            </div>
          `;
        }

        card.innerHTML = `
          <div class="q-header">
            <div class="q-num">${String(idx + 1).padStart(2, '0')}</div>
            <span class="q-badge">Câu ${idx + 1}</span>
            <span class="q-result-icon" id="icon-${q.id}"></span>
          </div>
          <div class="q-text">${formatText(q.question)}</div>
          <div class="answers-list" id="answers-${q.id}">
            ${answersHTML}
          </div>
          <div class="explanation" id="explain-${q.id}">
            <strong>Lời giải:</strong> ${formatText(q.explanation)}
          </div>
        `;

        container.appendChild(card);
      });

      triggerKaTeX(container);
    }

    function showReviewCard() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = '';

      if (rvIndex >= quizData.length) {
        container.innerHTML = `
          <div class="review-done-msg">
            <h2>Đã hoàn thành toàn bộ câu hỏi</h2>
            <p>Em đã duyệt qua ${quizData.length} câu hỏi. Bấm <strong>Kết thúc</strong> ở thanh bên dưới để xem kết quả.</p>
          </div>
        `;
        return;
      }

      const q = quizData[rvIndex];
      const card = document.createElement('div');
      card.className = 'question-card review-card-enter';
      card.dataset.id = q.id;

      const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
      let answersHTML = '';
      const typeLabel = q.type === 'đs' ? 'Đúng / Sai' : (q.type === 'cauhoi' ? 'Trắc nghiệm' : 'Trả lời ngắn');

      if (q.type === 'đs' && validAnswers.length > 0) {
        answersHTML = validAnswers.map(a => `
          <div class="tf-statement" id="tf-${q.id}-${a.key}">
            <div class="tf-text"><strong>${a.key}.</strong> ${formatText(a.text)}</div>
            <div class="tf-toggles seg-control tf-seg" data-selected="none">
              <span class="seg-thumb"></span>
              <div class="tf-btn seg-btn" data-val="Đ" onclick="selectTF(this, ${q.id}, '${a.key}', 'Đ')">Đúng</div>
              <div class="tf-btn seg-btn" data-val="S" onclick="selectTF(this, ${q.id}, '${a.key}', 'S')">Sai</div>
            </div>
          </div>
        `).join('');
      } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
        answersHTML = validAnswers.map(a => `
          <label class="answer-option" data-key="${a.key}" onclick="selectAnswer(this, ${q.id})">
            <span class="radio-dot"></span>
            <span class="answer-text">${formatText(a.text)}</span>
          </label>
        `).join('');
      } else {
        answersHTML = `
          <div style="display: flex; gap: 10px;">
            <input type="text" class="student-input" id="short-answer-${q.id}" placeholder="Nhập câu trả lời" style="flex: 1;" onkeydown="if(event.key === 'Enter') gradeShortAnswer(${q.id})">
            <button type="button" class="grade-btn" id="grade-btn-${q.id}" onclick="gradeShortAnswer(${q.id})">Gửi</button>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="q-header">
          <div class="q-num">${String(rvIndex + 1).padStart(2, '0')}</div>
          <span class="q-badge">Câu ${rvIndex + 1} · ${typeLabel}</span>
          <span class="q-result-icon" id="icon-${q.id}"></span>
        </div>
        <div class="q-text">${formatText(q.question)}</div>
        <div class="answers-list" id="answers-${q.id}">
          ${answersHTML}
        </div>
        <div class="explanation" id="explain-${q.id}">
          <strong>Lời giải:</strong> ${formatText(q.explanation)}
        </div>
        <div class="review-actions" id="reviewActions-${q.id}">
          <button class="skip-btn" onclick="skipReviewQuestion()">Bỏ qua câu này</button>
        </div>
      `;

      container.appendChild(card);
      triggerKaTeX(card);

      const done = rvCorrect + rvWrong + rvSkipped;
      document.getElementById('progressText').textContent = `Đã làm: ${done} câu`;
      document.querySelector('.progress-bar').style.display = 'none';
    }

    function updateReviewBar() {
      const el = (id) => document.getElementById(id);
      if (el('rvCorrect')) el('rvCorrect').textContent = rvCorrect;
      if (el('rvWrong')) el('rvWrong').textContent = rvWrong;
      if (el('rvSkipped')) el('rvSkipped').textContent = rvSkipped;
      const done = rvCorrect + rvWrong + rvSkipped;
      if (el('rvDone')) el('rvDone').textContent = done;
    }

    function advanceReviewCard() {
      const container = document.getElementById('quizContainer');
      const currentCard = container.querySelector('.question-card');
      if (currentCard) {
        currentCard.classList.remove('review-card-enter');
        currentCard.classList.add('review-card-exit');
        setTimeout(() => {
          rvIndex++;
          updateReviewBar();
          showReviewCard();
        }, 220);
      } else {
        rvIndex++;
        updateReviewBar();
        showReviewCard();
      }
    }

    function skipReviewQuestion() {
      if (submitted) return;
      rvSkipped++;
      rvResults.push({ qId: quizData[rvIndex].id, isCorrect: false, skipped: true });
      advanceReviewCard();
    }

    function selectAnswer(el, qId) {
      if (submitted) return;
      const answersEl = document.getElementById('answers-' + qId);
      if (isReviewMode && answersEl.querySelector('.answer-option.locked')) return;

      answersEl.querySelectorAll('.answer-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');

      if (isReviewMode) {
        gradeQuestion(qId);
      } else {
        updateProgress();
        checkAllAnswered();
      }
    }

    function selectTF(el, qId, key, val) {
      if (submitted) return;
      const answersEl = document.getElementById('answers-' + qId);

      if (isReviewMode) {
        const parent = document.getElementById(`tf-${qId}-${key}`);
        if (parent.querySelector('.tf-btn[style*="pointer-events: none"]')) return;
      }

      const parent = document.getElementById(`tf-${qId}-${key}`);
      parent.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('selected'));
      el.classList.add('selected');
      el.dataset.val = val;

      const seg = el.closest('.tf-toggles');
      if (seg) {
        const idx = val === 'Đ' ? '0' : '1';
        seg.setAttribute('data-selected', idx);
        seg.style.setProperty('--seg-index', idx);
      }

      if (isReviewMode) {
        const q = quizData.find(item => item.id === qId);
        const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
        const selectedTf = answersEl.querySelectorAll('.tf-btn.selected');
        if (selectedTf.length === validAnswers.length) {
          gradeQuestion(qId);
        } else {
          updateProgress();
          checkAllAnswered();
        }
      } else {
        updateProgress();
        checkAllAnswered();
      }
    }

    function inputShortAnswer() {
      if (submitted) return;
      updateProgress();
      checkAllAnswered();
    }

    function getAnsweredCount() {
      let answered = 0;
      quizData.forEach(q => {
        const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
        if (q.type === 'đs' && validAnswers.length > 0) {
          const selectedTf = document.querySelectorAll(`#answers-${q.id} .tf-btn.selected`);
          if (selectedTf.length === validAnswers.length) answered++;
        } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
          if (document.querySelector(`#answers-${q.id} .answer-option.selected`)) answered++;
        } else {
          const inp = document.getElementById(`short-answer-${q.id}`);
          if (inp && inp.value.trim() !== '') {
            if (isReviewMode) {
              const btn = document.getElementById(`grade-btn-${q.id}`);
              if (!btn || btn.style.display === 'none') answered++;
            } else {
              answered++;
            }
          }
        }
      });
      return answered;
    }

    function updateProgress() {
      const total = quizData.length;
      const answered = getAnsweredCount();
      document.getElementById('progressText').textContent = `${answered} / ${total}`;
      document.querySelector('.progress-bar').style.display = 'block';
      document.getElementById('progressFill').style.width = ((answered / total) * 100) + '%';

      if (isReviewMode) {
        const done = rvCorrect + rvWrong + rvSkipped;
        document.getElementById('progressText').textContent = `Đã làm: ${done} câu`;
        document.querySelector('.progress-bar').style.display = 'none';
      }
    }

    function checkAllAnswered() {
      if (isReviewMode) {
        const rvEndBtn = document.getElementById('rvEndBtn');
        if (rvEndBtn) rvEndBtn.disabled = false;
      } else {
        const total = quizData.length;
        document.getElementById('submitBtn').disabled = getAnsweredCount() < total;
      }
    }

    function isShortAnswerMatch(studentAns, correctAns) {
      if (studentAns === undefined || studentAns === null) return false;
      if (correctAns === undefined || correctAns === null) return false;

      const s = String(studentAns).trim().toLowerCase();
      const c = String(correctAns).trim().toLowerCase();

      if (!s || !c) return false;
      if (s === c) return true;

      const options = c.includes('|') ? c.split('|').map(opt => opt.trim()).filter(Boolean) : [c];

      for (const opt of options) {
        if (s === opt) return true;
        const sNorm = s.replace(/,/g, '.').replace(/\s+/g, '');
        const optNorm = opt.replace(/,/g, '.').replace(/\s+/g, '');
        if (sNorm === optNorm) return true;

        const sNum = Number(sNorm);
        const optNum = Number(optNorm);
        if (!isNaN(sNum) && !isNaN(optNum) && sNorm !== '' && optNorm !== '') {
          if (Math.abs(sNum - optNum) < 1e-6) return true;
        }
      }

      return false;
    }

    function setResultBadge(qId, isCorrect) {
      const icon = document.getElementById('icon-' + qId);
      if (!icon) return;
      icon.style.display = 'inline-flex';
      icon.classList.remove('is-correct', 'is-wrong');
      icon.classList.add(isCorrect ? 'is-correct' : 'is-wrong');
      icon.innerHTML = isCorrect ? `${SVG_CHECK} Đúng` : `${SVG_X} Sai`;
    }

    function gradeQuestion(qId) {
      const q = quizData.find(item => item.id === qId);
      if (!q) return;

      const card = document.querySelector(`.question-card[data-id="${q.id}"]`);
      const answersEl = document.getElementById('answers-' + q.id);
      const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
      let isCorrect = false;

      if (q.type === 'đs' && validAnswers.length > 0) {
        let correctCount = 0;
        const correctKey = q.correct ? q.correct.toString().toUpperCase().trim() : '';
        const correctArr = correctKey.replace(/D/g, 'Đ').split('');

        validAnswers.forEach((a, idx) => {
          const parent = document.getElementById(`tf-${q.id}-${a.key}`);
          const selected = parent.querySelector('.tf-btn.selected');
          const studentVal = selected ? selected.dataset.val : 'Không chọn';
          const exactCorrectVal = correctArr[idx] || 'Đ';

          parent.querySelectorAll('.tf-btn').forEach(btn => {
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.5';
            if (btn.dataset.val === exactCorrectVal) {
              btn.style.borderColor = 'var(--correct)';
              btn.style.opacity = '1';
              btn.style.color = 'var(--correct)';
            }
          });

          if (studentVal === exactCorrectVal) {
            correctCount++;
            if (selected) {
              selected.style.backgroundColor = 'var(--correct)';
              selected.style.color = '#ffffff';
            }
          } else {
            if (selected) {
              selected.style.backgroundColor = 'var(--wrong)';
              selected.style.color = '#ffffff';
              selected.style.borderColor = 'var(--wrong)';
            }
          }
        });

        isCorrect = (correctCount === validAnswers.length);
      } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
        const selected = answersEl.querySelector('.answer-option.selected');
        const selectedKey = selected ? selected.dataset.key : null;
        isCorrect = selectedKey === q.correct;

        answersEl.querySelectorAll('.answer-option').forEach(opt => {
          opt.classList.add('locked');
          if (opt.dataset.key === q.correct) opt.classList.add('is-correct');
          if (opt.classList.contains('selected') && opt.dataset.key !== q.correct) opt.classList.add('is-wrong');
        });
      } else {
        const inp = document.getElementById(`short-answer-${q.id}`);
        const studentAns = inp ? inp.value.trim().toLowerCase() : '';
        const correctAns = q.correct ? q.correct.toString().trim().toLowerCase() : '';
        isCorrect = isShortAnswerMatch(studentAns, correctAns);

        if (inp) {
          inp.disabled = true;
          inp.style.borderColor = isCorrect ? 'var(--correct)' : 'var(--wrong)';
          inp.style.backgroundColor = isCorrect ? 'var(--correct-subtle)' : 'var(--wrong-subtle)';
        }
      }

      setResultBadge(q.id, isCorrect);
      if (card) card.classList.add(isCorrect ? 'correct-card' : 'wrong-card');

      const explainEl = document.getElementById('explain-' + q.id);
      if (explainEl) {
        explainEl.classList.add('visible');
        triggerKaTeX(explainEl);
      }

      updateProgress();
      checkAllAnswered();

      if (isReviewMode) {
        const actionsEl = document.getElementById('reviewActions-' + q.id);
        if (actionsEl) actionsEl.style.display = 'none';

        if (isCorrect) rvCorrect++;
        else rvWrong++;
        rvResults.push({ qId: q.id, isCorrect: isCorrect, skipped: false });
        updateReviewBar();

        setTimeout(() => {
          advanceReviewCard();
        }, 1500);
      }
    }

    function gradeShortAnswer(qId) {
      if (submitted) return;
      const inp = document.getElementById(`short-answer-${qId}`);
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) {
        showToast('Vui lòng nhập câu trả lời trước khi gửi', 'error');
        return;
      }
      const btn = document.getElementById(`grade-btn-${qId}`);
      if (btn) btn.style.display = 'none';
      gradeQuestion(qId);
    }

    function startTimer() {
      if (quizFile && quizFile.startsWith('baitap_')) {
        const timerEl = document.getElementById('quizTimer');
        if (timerEl) timerEl.style.display = 'none';
        return;
      }

      if (timerInterval) clearInterval(timerInterval);
      timeRemaining = 30 * 60;
      const timerEl = document.getElementById('quizTimer');
      timerEl.style.display = 'flex';
      timerEl.classList.remove('urgent');

      const updateDisplay = () => {
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timerEl.innerHTML = `${SVG_CLOCK}<span>00:00</span>`;
          showToast('Đã hết thời gian làm bài', 'error');
          if (isReviewMode) endReview(true);
          else submitQuiz(true);
          return;
        }

        const m = Math.floor(timeRemaining / 60);
        const s = timeRemaining % 60;
        timerEl.innerHTML = `${SVG_CLOCK}<span>${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}</span>`;

        if (timeRemaining <= 300) {
          timerEl.classList.add('urgent');
        }
        timeRemaining--;
      };

      updateDisplay();
      timerInterval = setInterval(updateDisplay, 1000);
    }

    function endReview(force = false) {
      const answeredCount = rvCorrect + rvWrong;

      if (answeredCount === 0) {
        showToast('Em chưa hoàn thành câu hỏi nào', 'error');
        return;
      }

      if (!force) {
        if (!confirm('Em có chắc chắn muốn kết thúc ôn tập? Hệ thống sẽ chấm điểm các câu đã làm.')) {
          return;
        }
      }

      submitted = true;
      if (timerInterval) clearInterval(timerInterval);

      const reviewBar = document.getElementById('reviewBar');
      if (reviewBar) reviewBar.style.display = 'none';

      const nameInput = document.getElementById('studentName');
      const studentName = nameInput ? nameInput.value.trim() : 'Ẩn danh';
      if (nameInput) {
        nameInput.disabled = true;
        nameInput.style.opacity = '0.6';
      }

      let earnedPoints = 0;
      let possiblePoints = answeredCount;

      rvResults.forEach(r => {
        if (r.skipped) return;
        const q = quizData.find(item => item.id === r.qId);
        if (!q) return;

        if (q.type === 'cauhoi' || q.type === 'tln') {
          if (r.isCorrect) earnedPoints += 1.0;
        } else if (q.type === 'đs') {
          if (r.isCorrect) earnedPoints += 1.0;
        }
      });

      const finalScore = parseFloat(((earnedPoints / possiblePoints) * 10).toFixed(2));
      const maxScore = 10;
      const pct = Math.round((earnedPoints / possiblePoints) * 100);

      const container = document.getElementById('quizContainer');
      container.innerHTML = '';

      const banner = document.getElementById('scoreBanner');
      document.getElementById('scoreValue').textContent = `${finalScore} / ${maxScore}`;
      document.getElementById('scoreValue').style.color =
        pct >= 70 ? 'var(--correct)' : pct >= 40 ? 'var(--warning)' : 'var(--wrong)';

      let msg = `Hoàn thành ${answeredCount} câu (Đúng ${rvCorrect}, Sai ${rvWrong}, Bỏ qua ${rvSkipped}). `;
      if (pct === 100) msg += 'Kết quả xuất sắc.';
      else if (pct >= 70) msg += 'Kết quả tốt, tiếp tục duy trì.';
      else if (pct >= 40) msg += 'Mức khá, cần ôn thêm các phần chưa chắc.';
      else msg += 'Cần xem lại lý thuyết và luyện tập thêm.';
      document.getElementById('scoreMsg').textContent = msg;

      banner.classList.add('visible');
      banner.scrollIntoView({ behavior: 'smooth', block: 'center' });

      let wrongAnswersList = [];
      rvResults.forEach((r) => {
        if (r.skipped || r.isCorrect) return;
        const q = quizData.find(item => item.id === r.qId);
        if (!q) return;
        const idx = quizData.indexOf(q);
        wrongAnswersList.push(`Câu ${idx + 1}: Sai (Đáp án đúng: ${q.correct})`);
      });

      sendResultToTelegram(studentName + ' (Ôn tập)', finalScore, maxScore, wrongAnswersList);

      if (currentSession && currentSession.gmail) {
        saveProgressToSupabase(currentSession.gmail, quizFile, 'quiz', finalScore);
      }

      document.getElementById('retryBtn').classList.add('visible');
    }

    function saveProgressToSupabase(email, lessonId, type, score) {
      try {
        let dates = JSON.parse(localStorage.getItem('zphysics_activity_dates') || '[]');
        const today = new Date().toLocaleDateString('en-CA');
        if (!dates.includes(today)) {
          dates.push(today);
          dates.sort((a, b) => new Date(b) - new Date(a));
          localStorage.setItem('zphysics_activity_dates', JSON.stringify(dates));
        }
      } catch (e) {}

      if (!currentSession || !currentSession.premium || currentSession.gmail.startsWith('demo_')) return;

      const uniqueType = type + '_' + Date.now();
      const payload = { email: email, lesson_id: lessonId, type: uniqueType, score: score };
      const authHeader = (currentSession && currentSession.access_token) ? `Bearer ${currentSession.access_token}` : `Bearer ${SUPABASE_ANON_KEY}`;
      fetch(`${SUPABASE_URL}/rest/v1/student_progress?on_conflict=email,lesson_id,type`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': authHeader,
          'Prefer': 'resolution=merge-duplicates, return=minimal'
        },
        body: JSON.stringify(payload)
      }).catch(err => console.error('Lỗi lưu tiến trình:', err));
    }

    function submitQuiz() {
      if (submitted) return;

      const nameInput = document.getElementById('studentName');
      const studentCard = document.getElementById('studentCard');
      const studentName = nameInput.value.trim();

      if (!studentName) {
        studentCard.classList.add('error');
        nameInput.focus();
        setTimeout(() => studentCard.classList.remove('error'), 2000);
        return;
      }
      studentCard.classList.remove('error');

      submitted = true;
      nameInput.disabled = true;
      nameInput.style.opacity = '0.6';

      let score = 0;
      let wrongAnswersList = [];

      quizData.forEach((q, index) => {
        const card = document.querySelector(`.question-card[data-id="${q.id}"]`);
        const answersEl = document.getElementById('answers-' + q.id);
        const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
        let isCorrect = false;
        let studentAnsText = '';

        if (q.type === 'đs' && validAnswers.length > 0) {
          let correctCount = 0;
          let wrongStatements = [];
          const correctKey = q.correct ? q.correct.toString().toUpperCase().trim() : '';
          const correctArr = correctKey.replace(/D/g, 'Đ').split('');

          validAnswers.forEach((a, idx) => {
            const parent = document.getElementById(`tf-${q.id}-${a.key}`);
            const selected = parent.querySelector('.tf-btn.selected');
            const studentVal = selected ? selected.dataset.val : 'Không chọn';
            const exactCorrectVal = correctArr[idx] || 'Đ';

            parent.querySelectorAll('.tf-btn').forEach(btn => {
              btn.style.pointerEvents = 'none';
              btn.style.opacity = '0.5';
              if (btn.dataset.val === exactCorrectVal) {
                btn.style.borderColor = 'var(--correct)';
                btn.style.opacity = '1';
                btn.style.color = 'var(--correct)';
              }
            });

            if (studentVal === exactCorrectVal) {
              correctCount++;
              if (selected) {
                selected.style.backgroundColor = 'var(--correct)';
                selected.style.color = '#ffffff';
              }
            } else {
              wrongStatements.push(`Ý ${a.key} (Chọn: ${studentVal}, Đúng: ${exactCorrectVal})`);
              if (selected) {
                selected.style.backgroundColor = 'var(--wrong)';
                selected.style.color = '#ffffff';
                selected.style.borderColor = 'var(--wrong)';
              }
            }
          });

          let qScore = 0;
          if (correctCount === 1) qScore = 0.1;
          else if (correctCount === 2) qScore = 0.25;
          else if (correctCount === 3) qScore = 0.5;
          else if (correctCount === 4) qScore = 1.0;

          if (!quizFile.startsWith('baitap_')) {
            qScore = correctCount;
          }

          score += qScore;
          isCorrect = (correctCount === validAnswers.length);

          if (!isCorrect) {
            wrongAnswersList.push(`Câu ${index + 1}: Sai ${wrongStatements.length} ý. [${wrongStatements.join('; ')}]`);
          }
        } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
          const selected = answersEl.querySelector('.answer-option.selected');
          const selectedKey = selected ? selected.dataset.key : null;
          isCorrect = selectedKey === q.correct;
          studentAnsText = selectedKey || 'Không chọn';

          answersEl.querySelectorAll('.answer-option').forEach(opt => {
            opt.classList.add('locked');
            if (opt.dataset.key === q.correct) opt.classList.add('is-correct');
            if (opt.classList.contains('selected') && opt.dataset.key !== q.correct) opt.classList.add('is-wrong');
          });

          if (isCorrect) {
            score += quizFile.startsWith('baitap_') ? 0.25 : 1;
          } else {
            wrongAnswersList.push(`Câu ${index + 1}: Chọn "${studentAnsText}" (Đáp án đúng: ${q.correct})`);
          }
        } else {
          const inp = document.getElementById(`short-answer-${q.id}`);
          const studentAns = inp ? inp.value.trim().toLowerCase() : '';
          const correctAns = q.correct ? q.correct.toString().trim().toLowerCase() : '';
          isCorrect = isShortAnswerMatch(studentAns, correctAns);
          studentAnsText = inp ? inp.value.trim() : '';
          if (!studentAnsText) studentAnsText = 'Bỏ trống';

          if (inp) {
            inp.disabled = true;
            inp.style.borderColor = isCorrect ? 'var(--correct)' : 'var(--wrong)';
            inp.style.backgroundColor = isCorrect ? 'var(--correct-subtle)' : 'var(--wrong-subtle)';
          }

          if (isCorrect) {
            score += quizFile.startsWith('baitap_') ? 0.25 : 1;
          } else {
            wrongAnswersList.push(`Câu ${index + 1}: Điền "${studentAnsText}" (Đáp án đúng: ${q.correct})`);
          }
        }

        setResultBadge(q.id, isCorrect);
        card.classList.add(isCorrect ? 'correct-card' : 'wrong-card');

        const explainEl = document.getElementById('explain-' + q.id);
        explainEl.classList.add('visible');
      });

      triggerKaTeX(document.getElementById('quizContainer'));

      let finalScore = score;
      let maxScore = quizData.length;
      if (quizFile.startsWith('baitap_')) {
        finalScore = score * 2;
        maxScore = 10;
      }
      finalScore = parseFloat(finalScore.toFixed(2));

      const banner = document.getElementById('scoreBanner');
      const pct = Math.round((finalScore / maxScore) * 100);

      document.getElementById('scoreValue').textContent = `${finalScore} / ${maxScore}`;
      document.getElementById('scoreValue').style.color =
        pct >= 70 ? 'var(--correct)' : pct >= 40 ? 'var(--warning)' : 'var(--wrong)';

      let msg = '';
      if (pct === 100) msg = 'Kết quả xuất sắc, hoàn thành trọn vẹn bài tập.';
      else if (pct >= 70) msg = 'Kết quả tốt, xem lại các câu sai để nắm chắc hơn.';
      else if (pct >= 40) msg = 'Mức khá, nên xem kỹ phần lời giải bên dưới.';
      else msg = 'Cần ôn tập lại lý thuyết trước khi làm lại.';
      document.getElementById('scoreMsg').textContent = msg;

      banner.classList.add('visible');
      banner.scrollIntoView({ behavior: 'smooth', block: 'center' });

      sendResultToTelegram(studentName, finalScore, maxScore, wrongAnswersList);

      if (currentSession && currentSession.gmail) {
        let dbScore = finalScore;
        if (!quizFile.startsWith('baitap_') && maxScore > 0) {
          dbScore = (score / maxScore) * 10;
        }
        saveProgressToSupabase(currentSession.gmail, quizFile, 'quiz', parseFloat(dbScore.toFixed(2)));
      }

      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('retryBtn').classList.add('visible');
    }

    function retryQuiz() {
      submitted = false;
      document.getElementById('scoreBanner').classList.remove('visible');

      if (isReviewMode) {
        const reviewBar = document.getElementById('reviewBar');
        if (reviewBar) reviewBar.style.display = 'flex';
        const rvEndBtn = document.getElementById('rvEndBtn');
        if (rvEndBtn) rvEndBtn.disabled = false;
      } else {
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
          submitBtn.style.display = '';
          submitBtn.disabled = true;
        }
      }

      document.getElementById('retryBtn').classList.remove('visible');
      document.getElementById('progressFill').style.width = '0%';
      const nameInput = document.getElementById('studentName');
      if (!currentSession || !currentSession.ten) {
        nameInput.disabled = false;
        nameInput.style.opacity = '1';
      }
      renderQuiz(quizData);
      startTimer();
    }
  </script>

  <audio id="bgMusic" loop preload="none"></audio>

  <script>
    function updateMusicButton(isPlaying) {
      const btn = document.getElementById('musicToggleBtn');
      const icon = document.getElementById('musicIcon');
      if (!btn || !icon) return;

      if (isPlaying) {
        icon.innerHTML = SVG_VOL_ON;
        btn.classList.add('playing');
        btn.classList.remove('muted');
        btn.title = 'Tắt tiếng (nhạc nền đang phát)';
      } else {
        icon.innerHTML = SVG_VOL_OFF;
        btn.classList.remove('playing');
        btn.classList.add('muted');
        btn.title = 'Bật tiếng (nhạc nền đang tắt)';
      }
    }

    function toggleMusic() {
      const audio = document.getElementById('bgMusic');
      if (!audio) return;

      if (!audio.src || !audio.src.includes('alla-turca.mp3')) {
        audio.src = 'assets/alla-turca.mp3';
      }

      if (audio.paused) {
        audio.volume = 0.35;
        audio.play().then(() => {
          localStorage.setItem('zphysics_music_muted', 'false');
          updateMusicButton(true);
        }).catch(err => {
          console.warn('Không thể phát nhạc nền:', err);
        });
      } else {
        audio.pause();
        localStorage.setItem('zphysics_music_muted', 'true');
        updateMusicButton(false);
      }
    }

    function initMusicPlayer() {
      const audio = document.getElementById('bgMusic');
      if (!audio) return;

      audio.volume = 0.35;
      const isMuted = localStorage.getItem('zphysics_music_muted') === 'true';
      updateMusicButton(false);
      if (isMuted) return;

      const events = ['click', 'touchstart', 'keydown'];
      const playOnFirstInteraction = (e) => {
        if (e && e.target && e.target.closest && e.target.closest('#musicToggleBtn')) return;

        if (localStorage.getItem('zphysics_music_muted') === 'true') {
          events.forEach(evt => document.removeEventListener(evt, playOnFirstInteraction));
          return;
        }

        if (!audio.src || !audio.src.includes('alla-turca.mp3')) {
          audio.src = 'assets/alla-turca.mp3';
        }

        if (audio.paused) {
          audio.play().then(() => {
            updateMusicButton(true);
            events.forEach(evt => document.removeEventListener(evt, playOnFirstInteraction));
          }).catch(() => {});
        } else {
          updateMusicButton(true);
          events.forEach(evt => document.removeEventListener(evt, playOnFirstInteraction));
        }
      };

      events.forEach(event => document.addEventListener(event, playOnFirstInteraction, { passive: true }));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => setTimeout(initMusicPlayer, 500));
    } else {
      setTimeout(initMusicPlayer, 500);
    }
  </script>
