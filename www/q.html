    function isQuestionAnswered(q) {
      const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
      if (q.type === 'đs' && validAnswers.length > 0) {
        const selectedTf = document.querySelectorAll(`#answers-${q.id} .tf-btn.selected`);
        return selectedTf.length === validAnswers.length;
      } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
        return !!document.querySelector(`#answers-${q.id} .answer-option.selected`);
      } else {
        const inp = document.getElementById(`short-answer-${q.id}`);
        return !!(inp && inp.value.trim() !== '');
      }
    }

    function renderQuestionPalette() {
      const card = document.getElementById('questionPaletteCard');
      const grid = document.getElementById('questionPaletteGrid');
      const statsEl = document.getElementById('questionPaletteStats');
      const stickyBtn = document.getElementById('stickyTogglePaletteBtn');
      if (!card || !grid) return;

      if (isReviewMode || isHomeworkMode || !quizData || quizData.length === 0) {
        card.style.display = 'none';
        if (stickyBtn) stickyBtn.style.display = 'none';
        return;
      }
      card.style.display = '';
      if (stickyBtn) stickyBtn.style.display = '';

      let answeredCount = 0;
      let flaggedCount = 0;

      grid.innerHTML = quizData.map((q, idx) => {
        const qKey = String(q.id);
        const cardEl = document.querySelector(`.question-card[data-id="${q.id}"]`);
        const isCorrect = cardEl && cardEl.classList.contains('correct-card');
        const isWrong = cardEl && cardEl.classList.contains('wrong-card');
        const isAnswered = isQuestionAnswered(q);
        const isFlagged = flaggedQuestionIds.has(qKey);

        if (isAnswered) answeredCount++;
        if (isFlagged) flaggedCount++;

        const classes = ['qp-chip'];
        if (isCorrect) classes.push('is-correct');
        else if (isWrong) classes.push('is-wrong');
        else if (isAnswered) classes.push('is-answered');
        if (isFlagged) classes.push('is-flagged');

        return `<button type="button" class="${classes.join(' ')}" data-qid="${escapeTelegramHtml(qKey)}" onclick="scrollToQuestion(this.dataset.qid)" title="Câu ${idx + 1}${isFlagged ? ' (Đang phân vân)' : ''}">${String(idx + 1).padStart(2, '0')}</button>`;
      }).join('');

      const unansweredCount = Math.max(0, quizData.length - answeredCount);
      if (statsEl) {
        statsEl.innerHTML = `
          <span>Đã làm: <strong>${answeredCount}/${quizData.length}</strong></span>
          <span>Chưa làm: <strong>${unansweredCount}</strong></span>
          <span>Phân vân: <strong style="color:var(--warning)">${flaggedCount}</strong></span>
        `;
      }
    }

    function updateStickyTopState() {
      const stickyEl = document.getElementById('quizStickyTop');
      if (!stickyEl) return;
      const isStuck = window.scrollY > 0 && stickyEl.getBoundingClientRect().top <= 1;
      stickyEl.classList.toggle('is-stuck', isStuck);
    }

    window.addEventListener('scroll', updateStickyTopState, { passive: true });
    window.addEventListener('resize', updateStickyTopState, { passive: true });
    window.addEventListener('DOMContentLoaded', updateStickyTopState);

    function scrollToQuestion(qId) {
      const card = document.querySelector(`.question-card[data-id="${qId}"]`);
      if (!card) return;
      const stickyEl = document.getElementById('quizStickyTop');
      const stickyOffset = stickyEl ? (stickyEl.getBoundingClientRect().height + 12) : 90;
      const cardTop = card.getBoundingClientRect().top + window.pageYOffset;
      window.scrollTo({
        top: Math.max(0, cardTop - stickyOffset),
        behavior: 'smooth'
      });
      card.style.boxShadow = '0 0 0 2px var(--accent)';
      setTimeout(() => { card.style.boxShadow = ''; }, 1000);
    }

    function toggleQuestionFlag(qId) {
      const qKey = String(qId);
      const card = document.querySelector(`.question-card[data-id="${qKey}"]`);
      const btn = document.getElementById('flag-btn-' + qKey);
      if (flaggedQuestionIds.has(qKey)) {
        flaggedQuestionIds.delete(qKey);
        if (card) card.classList.remove('flagged-card');
        if (btn) {
          btn.classList.remove('flagged');
          btn.innerHTML = `${SVG_FLAG}<span>Xem lại</span>`;
        }
      } else {
        flaggedQuestionIds.add(qKey);
        if (card) card.classList.add('flagged-card');
        if (btn) {
          btn.classList.add('flagged');
          btn.innerHTML = `${SVG_FLAG}<span>Phân vân</span>`;
        }
      }
      renderQuestionPalette();
      saveQuizDraft();
    }

    function checkSingleQuestion(qId, opts = {}) {
      const idx = quizData.findIndex(item => String(item.id) === String(qId));
      if (idx === -1) return;
      const q = quizData[idx];

      if (q.type !== 'cauhoi' && q.type !== 'đs' && !opts.allowEmpty) {
        const inp = document.getElementById(`short-answer-${q.id}`);
        if (inp && inp.value.trim() === '' && !opts.skipMistakeUpdate) {
          showToast('Vui lòng nhập đáp án trước khi kiểm tra', 'error');
          inp.focus();
          return;
        }
      } else if (!opts.allowEmpty && !opts.skipMistakeUpdate && q.type === 'cauhoi') {
        const sel = document.querySelector(`#answers-${q.id} .answer-option.selected`);
        if (!sel) {
          showToast('Vui lòng chọn một phương án trước khi kiểm tra', 'error');
          return;
        }
      }

      const res = evaluateQuestion(q, idx);
      checkedQuestionIds.add(String(q.id));

      const practiceActionsEl = document.getElementById(`practiceActions-${q.id}`);
      if (practiceActionsEl) practiceActionsEl.style.display = 'none';

      renderQuestionFeedbackPanel(q, {
        isCorrect: res.isCorrect,
        compact: true,
        metaText: res.isCorrect ? (isMistakeQuiz ? 'Đã xóa khỏi Sổ tay' : '') : 'Đã lưu Sổ tay câu sai'
      });

      if (!opts.skipMistakeUpdate) {
        if (!res.isCorrect) {
          recordMistake(q);
        } else if (isMistakeQuiz) {
          if (resolveMistake(q.id)) {
            showToast('Tuyệt vời! Đã xóa câu này khỏi Sổ tay câu sai.', 'success');
          }
        }
      }

      updateProgress();
      checkAllAnswered();
      renderQuestionPalette();
      if (!opts.skipDraftSave) saveQuizDraft();
    }

    function restoreQuizDraft(draft) {
      if (!draft || !draft.answers) return false;
      let restoredAny = false;

      if (draft.studyMode && !urlModeParam && !isMistakeQuiz) {
        setStudyMode(draft.studyMode, true);
      }

      if (Array.isArray(draft.flaggedIds)) {
        draft.flaggedIds.forEach(fid => {
          const qKey = String(fid);
          flaggedQuestionIds.add(qKey);
          const card = document.querySelector(`.question-card[data-id="${qKey}"]`);
          const btn = document.getElementById('flag-btn-' + qKey);
          if (card) card.classList.add('flagged-card');
          if (btn) {
            btn.classList.add('flagged');
            btn.innerHTML = `${SVG_FLAG}<span>Phân vân</span>`;
          }
          restoredAny = true;
        });
      }

      quizData.forEach(q => {
        const val = draft.answers[String(q.id)];
        if (val === undefined || val === null) return;
        const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
        if (q.type === 'đs' && validAnswers.length > 0 && typeof val === 'object') {
          Object.entries(val).forEach(([k, v]) => {
            const parent = document.getElementById(`tf-${q.id}-${k}`);
            if (!parent) return;
            const targetBtn = parent.querySelector(`.tf-btn[data-val="${v}"]`);
            if (targetBtn) {
              parent.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected'));
              targetBtn.classList.add('selected');
              const seg = targetBtn.closest('.tf-toggles');
              if (seg) {
                const segIdx = v === 'Đ' ? '0' : '1';
                seg.setAttribute('data-selected', segIdx);
                seg.style.setProperty('--seg-index', segIdx);
              }
              restoredAny = true;
            }
          });
        } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
          const opt = document.querySelector(`#answers-${q.id} .answer-option[data-key="${val}"]`);
          if (opt) {
            document.querySelectorAll(`#answers-${q.id} .answer-option`).forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            restoredAny = true;
          }
        } else {
          const inp = document.getElementById(`short-answer-${q.id}`);
          if (inp && typeof val === 'string') {
            inp.value = val;
            restoredAny = true;
          }
        }
      });

      if (Array.isArray(draft.checkedIds)) {
        draft.checkedIds.forEach(cid => {
          checkSingleQuestion(cid, { skipDraftSave: true, skipMistakeUpdate: true });
        });
      }

      return restoredAny;
    }

    function loadLessonInfo() {
      if (isMistakeQuiz) return;
      fetch('baihoc.json')
        .then(res => res.json())
        .then(data => {
          let searchCode = quizFile;
          if (quizFile.startsWith('ontap_')) {
            searchCode = 'baitap_' + quizFile.substring('ontap_'.length);
          }
          const baseCode = searchCode.replace(/^(baitap|ontap|cauhoi|đs|tln)_/, '');
          const codeParts = baseCode.split('_');
          const targetGrade = codeParts[0] || '';
          const targetChapter = codeParts[1] ? codeParts[1].replace('c', '') : '';
          const targetLesson = codeParts[2] ? codeParts[2].replace('b', '') : '';
          const romanMap = { 'I': '1', 'II': '2', 'III': '3', 'IV': '4', 'V': '5', 'VI': '6', 'VII': '7', 'VIII': '8', 'IX': '9', 'X': '10' };

          for (const gradeItem of data) {
            const gMatch = targetGrade && gradeItem.grade && gradeItem.grade.includes(targetGrade);
            for (const chapterItem of gradeItem.chapters) {
              let cRaw = chapterItem.num.replace(/chương/i, '').trim().toUpperCase();
              const cNum = romanMap[cRaw] || cRaw;

              for (const lessonItem of chapterItem.lessons) {
                const links = lessonItem.links || {};
                const lNum = lessonItem.num ? lessonItem.num.replace(/^0+/, '') : '';
                const tLessonClean = targetLesson.replace(/^0+/, '');

                const isMatchByLinks = Object.values(links).some(link => typeof link === 'string' && (link.includes(searchCode) || (baseCode && link.includes(baseCode))));
                const isMatchByStructure = gMatch && (cNum === targetChapter) && (lNum === tLessonClean);

                if (isMatchByLinks || isMatchByStructure) {
                  lessonInfo = {
                    grade: gradeItem.grade,
                    chapter: chapterItem.num + (chapterItem.title ? `: ${chapterItem.title}` : ''),
                    lesson: `Bài ${lessonItem.num}: ${lessonItem.title}`
                  };

                  const subtitleEl = document.getElementById('headerSubtitle');
                  if (subtitleEl) {
                    const modeText = isReviewMode ? 'Ôn tập chuyên sâu' : (quizFile.startsWith('baitap_') ? 'Bài tập về nhà' : 'Kiểm tra kiến thức Vật lí');
                    subtitleEl.textContent = `${lessonInfo.lesson} · ${modeText}`;
                  }
                  const h1El = document.querySelector('.header-info h1');
                  if (h1El) {
                    if (isReviewMode) {
                      h1El.innerHTML = 'Z<span>physics</span> — Ôn tập';
                    } else if (quizFile.startsWith('baitap_')) {
                      h1El.innerHTML = 'Z<span>physics</span> — Bài tập';
                    }
                  }
                  return;
                }
              }
            }
          }
        })
        .catch(err => console.error('Lỗi khi tải thông tin bài học:', err));
    }
    loadLessonInfo();

    function normalizeRawQuestions(data) {
      let part1 = [];
      let part2 = [];
      let part3 = [];
      const itemById = new Map();

      (data || []).forEach((item, rawIdx) => {
        let type = 'cauhoi';
        if (item.type) {
          type = item.type;
        } else if (item.made) {
          if (item.made.startsWith('đs')) type = 'đs';
          else if (item.made.startsWith('tln')) type = 'tln';
        }

        const qId = (item.id !== undefined && item.id !== null) ? item.id : (900000 + rawIdx);
        const q = {
          id: qId,
          type: type,
          question: item.question,
          answers: item.answers || [
            { key: 'A', text: item.a },
            { key: 'B', text: item.b },
            { key: 'C', text: item.c },
            { key: 'D', text: item.d }
          ],
          correct: item.correct,
          explanation: item.explanation,
          _originMade: item.made || '',
          _originGrade: item.grade || '',
          _originLesson: item.lessonTitle || '',
          _originChapter: item.chapterTitle || ''
        };

        itemById.set(String(qId), q);
        if (type === 'cauhoi') part1.push(q);
        else if (type === 'đs') part2.push(q);
        else part3.push(q);
      });

      return { part1, part2, part3, itemById };
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildHomeworkQuestionSet(rawData) {
      const { part1, part2, part3 } = normalizeRawQuestions(rawData);
      return [
        ...shuffleArray(part1).slice(0, 9),
        ...shuffleArray(part2).slice(0, 2),
        ...shuffleArray(part3).slice(0, 3)
      ];
    }

    function processQuizData(data) {
      if (!data || !Array.isArray(data) || data.length === 0) return false;

      rawQuizPool = data.slice();
      const draft = isReviewMode ? null : loadQuizDraft();
      const { part1: rawPart1, part2: rawPart2, part3: rawPart3, itemById } = normalizeRawQuestions(data);
      let part1 = rawPart1.slice();
      let part2 = rawPart2.slice();
      let part3 = rawPart3.slice();

      let mappedData = null;
      let validHomeworkDraft = null;

      if (isHomeworkMode) {
        if (
          draft &&
          draft.isHomework &&
          Array.isArray(draft.questionIds) &&
          draft.questionIds.length > 0 &&
          typeof draft.hwWrongCount === 'number' &&
          draft.hwWrongCount < HW_MAX_LIVES
        ) {
          const restoredList = draft.questionIds.map(id => itemById.get(String(id))).filter(Boolean);
          if (restoredList.length === draft.questionIds.length) {
            mappedData = restoredList;
            validHomeworkDraft = draft;
          }
        }
        if (!mappedData) {
          mappedData = buildHomeworkQuestionSet(data);
        }
      } else {
        if (draft && !draft.isHomework && Array.isArray(draft.questionIds) && draft.questionIds.length > 0) {
          const restoredList = draft.questionIds.map(id => itemById.get(String(id))).filter(Boolean);
          if (restoredList.length > 0) {
            mappedData = restoredList;
          }
        }

        if (!mappedData) {
          part1 = shuffleArray(part1);
          part2 = shuffleArray(part2);
          part3 = shuffleArray(part3);

          if (isMistakeQuiz) {
            mappedData = [...part1, ...part2, ...part3];
          } else if (quizFile.startsWith('ontap_')) {
            mappedData = shuffleArray([...part1, ...part2, ...part3]);
          } else if (quizFile.startsWith('cauhoi')) {
            mappedData = part1.slice(0, 18);
          } else if (quizFile.startsWith('đs')) {
            mappedData = part2.slice(0, 4);
          } else if (quizFile.startsWith('tln')) {
            mappedData = part3.slice(0, 6);
          } else {
            mappedData = [...part1, ...part2, ...part3];
          }
        }
      }

      quizData = mappedData;

      if (isHomeworkMode) {
        hwFailed = false;
        hwAnsweredCurrent = false;
        hwShowingReviewList = false;
        if (validHomeworkDraft) {
          hwResults = Array.isArray(validHomeworkDraft.hwResults) ? validHomeworkDraft.hwResults.slice(0, quizData.length) : [];
          hwWrongCount = hwResults.filter(r => !r.isCorrect).length;
          hwCorrectCount = hwResults.filter(r => r.isCorrect).length;
          hwIndex = hwResults.length;
        } else {
          hwIndex = 0;
          hwWrongCount = 0;
          hwCorrectCount = 0;
          hwResults = [];
        }
        renderQuiz(mappedData);
        if (validHomeworkDraft && hwResults.length > 0) {
          showToast(`Đã khôi phục tiến trình làm bài (Câu ${Math.min(hwIndex + 1, quizData.length)}/${quizData.length}, còn ${HW_MAX_LIVES - hwWrongCount} mạng)`, 'success');
        }
        startTimer(null);
        return true;
      }

      renderQuiz(mappedData);

      let initialTimerSec = null;
      if (draft && !isReviewMode && !draft.isHomework) {
        const didRestore = restoreQuizDraft(draft);
        renderQuestionPalette();
        updateProgress();
        checkAllAnswered();
        if (didRestore) {
          updateAutosaveStatus('Đã khôi phục bài nháp', true);
          showToast('Đã khôi phục tiến trình làm bài trước đó', 'success');
        }
        if (typeof draft.timeRemaining === 'number' && draft.timeRemaining > 30) {
          initialTimerSec = draft.timeRemaining;
        }
      }

      startTimer(initialTimerSec);

      if (!autosaveIntervalId && !isReviewMode) {
        autosaveIntervalId = setInterval(() => {
          if (!submitted && !isReviewMode && Array.isArray(quizData) && quizData.length > 0) {
            saveQuizDraft();
          }
        }, 5000);
      }

      return true;
    }

    function loadQuizFromSupabase() {
      if (isMistakeQuiz) {
        const gradeMatch = quizFile.match(/^mistakes_(\d{2})$/);
        const gradeFilter = gradeMatch ? gradeMatch[1] : '';
        const allMistakes = getMistakesList();
        const filtered = gradeFilter
          ? allMistakes.filter(m => String(m.grade) === gradeFilter)
          : allMistakes;

        const h1El = document.querySelector('.header-info h1');
        if (h1El) h1El.innerHTML = 'Z<span>physics</span> — Sổ tay câu sai';
        const subtitleEl = document.getElementById('headerSubtitle');
        if (subtitleEl) {
          subtitleEl.textContent = `${filtered.length} câu cần ôn lại${gradeFilter ? ' · Lớp ' + gradeFilter : ''}`;
        }
        lessonInfo = {
          grade: gradeFilter ? `Vật lí ${gradeFilter}` : 'Tổng hợp',
          chapter: 'Sổ tay câu sai',
          lesson: 'Luyện lại các câu trả lời sai'
        };

        if (filtered.length === 0) {
          document.getElementById('quizContainer').innerHTML = `
            <div class="review-done-msg">
              <h2>Sổ tay câu sai hiện đang trống</h2>
              <p style="margin-bottom:16px;">Em chưa có câu trả lời sai nào${gradeFilter ? ' ở Lớp ' + gradeFilter : ''} hoặc đã khắc phục hết.</p>
              <a href="./" class="zp-primary-btn" style="text-decoration:none;">Quay lại trang chủ</a>
            </div>
          `;
          const tb = document.getElementById('studyToolbar');
          const pal = document.getElementById('questionPaletteCard');
          const sb = document.getElementById('submitBtn');
          const stickyBtn = document.getElementById('stickyTogglePaletteBtn');
          if (tb) tb.style.display = 'none';
          if (pal) pal.style.display = 'none';
          if (sb) sb.style.display = 'none';
          if (stickyBtn) stickyBtn.style.display = 'none';
          return;
        }

        processQuizData(filtered);
        return;
      }

      const cacheKey = 'zphysics_quiz_cache_' + quizFile;
      let hasRendered = false;

      try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          const cachedData = JSON.parse(cached);
          if (Array.isArray(cachedData) && cachedData.length > 0) {
            hasRendered = processQuizData(cachedData);
          }
        }
      } catch (e) {}

      let url = `${SUPABASE_URL}/rest/v1/questions?made=eq.${encodeURIComponent(quizFile)}&select=*`;

      if (quizFile.startsWith('baitap_') || quizFile.startsWith('ontap_')) {
        const prefix = quizFile.startsWith('baitap_') ? 'baitap_' : 'ontap_';
        const rest = quizFile.substring(prefix.length);
        const inVals = `cauhoi_${rest},đs_${rest},tln_${rest}`;
        url = `${SUPABASE_URL}/rest/v1/questions?made=in.(${encodeURIComponent(inVals)})&select=*`;
      }

      const authToken = (currentSession && currentSession.access_token) ? currentSession.access_token : SUPABASE_ANON_KEY;
      fetch(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${authToken}`
        }
      })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          if (!data || !Array.isArray(data) || data.length === 0) {
            if (!hasRendered) throw new Error('Đề thi trống hoặc mã đề không chính xác');
            return;
          }

          try {
            localStorage.setItem(cacheKey, JSON.stringify(data));
          } catch (e) {}

          rawQuizPool = data.slice();

          if (!hasRendered) {
            processQuizData(data);
          }
        })
        .catch(err => {
          console.error(err);
          if (!hasRendered) {
            document.getElementById('quizContainer').innerHTML =
              '<div class="loading"><p style="color:var(--wrong);font-weight:500;font-size:14px">Không tải được đề từ Database Supabase.<br><small style="opacity:.7">'
              + escapeQuizHtml(err.message || 'Hãy kiểm tra lại kết nối mạng và mã đề thi.')
              + '</small></p></div>';
          }
        });
    }

    function normalizeEscapedLatex(str) {
      if (!str || !str.includes('\\\\')) return str;
      const hasDoubleEscapedLatex = /(^|[^\\])\\\\(?:frac|dfrac|tfrac|cdot|times|div|pm|mp|pi|Delta|delta|alpha|beta|gamma|lambda|mu|omega|Omega|phi|varphi|theta|rho|sigma|tau|epsilon|varepsilon|eta|Rightarrow|rightarrow|Leftarrow|leftarrow|leftrightarrow|to|text|mathrm|mathbf|mathit|sqrt|vec|bar|overline|hat|dot|ddot|left|right|approx|equiv|sim|le|leq|ge|geq|ne|neq|infty|circ|sin|cos|tan|cot|log|ln|sum|int|quad|qquad|boxed|begin|end)\b|(^|[^\\])\\\\\([\s\S]*\\\\\)|(^|[^\\])\\\\\[[\s\S]*\\\\\]/.test(str);
      if (!hasDoubleEscapedLatex) return str;
      let out = str.replace(/\\\\\\\\/g, '\u0000ZPLINEBRK\u0000');
      out = out.replace(/(\\+)([a-zA-Z]{2,}|[,;!%{}()\[\]])/g, (m, slashes, cmd) => {
        if (slashes.length === 2) return '\\' + cmd;
        return m;
      });
      out = out.replace(/\u0000ZPLINEBRK\u0000/g, '\\\\');
      return out;
    }

    function preprocessMath(text) {
      if (!text) return '';

      let res = normalizeEscapedLatex(String(text))
        .replace(/\\bar\{Ed1\}/g, '\\overline{E_{d1}}')
        .replace(/\\bar\{Ed2\}/g, '\\overline{E_{d2}}')
        .replace(/\\bar\{Ed\}/g, '\\overline{E_d}')
        .replace(/\\bar\{E_d\}/g, '\\overline{E_d}')
        .replace(/\\bar\{E_đ\}/g, '\\overline{E_đ}')
        .replace(/\\bar\{v[²2]\}/g, '\\overline{v^2}')
        .replace(/\\bar\{s\}/g, '\\overline{s}')
        .replace(/\\bar\{t\}/g, '\\overline{t}')
        .replace(/\\bar\{v\}/g, '\\overline{v}')
        .replace(/\\bar\{\\Delta\s*t\}/g, '\\overline{\\Delta t}')
        .replace(/\\bar\{Δt\}/g, '\\overline{\\Delta t}');

      const mathRegex = /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\$[^\$\n]+?\$|\\\([\s\S]*?\\\))/g;
      const parts = res.split(mathRegex);
      const tokens = [];

      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          tokens.push(parts[i]);
          continue;
        }

        let p = parts[i];
        if (!p) continue;

        if (p.includes('\\')) {
          const hasVietnamese = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(p);

          if (!hasVietnamese && (/[=><≈±\/\^]/.test(p) || p.trim().startsWith('\\'))) {
            let clean = p.trim();
            let endPunct = '';
            if (/[.,;:]$/.test(clean)) {
              endPunct = clean.slice(-1);
              clean = clean.slice(0, -1).trim();
            }
            tokens.push('$' + clean + '$' + endPunct);
          } else {
            let replaced = p.replace(/(\\(?:overline|bar|hat|vec|dot|ddot|frac|sqrt)\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}|\\(?:Delta|delta|alpha|beta|gamma|lambda|mu|omega|Omega|pi|theta|sigma|rho|tau|phi|varphi|pm|approx|le|ge|times|cdot|ne|neq|Rightarrow|to)(?:\s+[a-zA-Z0-9_]+)?)/g, (m, g1) => '$' + g1.trim() + '$');
            tokens.push(replaced);
          }
        } else {
          tokens.push(p);
        }
      }
      return tokens.join('');
    }

    function triggerKaTeX(el) {
      const target = el || document.getElementById('quizContainer') || document.body;
      if (typeof renderMathInElement === 'function') {
        try {
          renderMathInElement(target, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '\\[', right: '\\]', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX render error:', e);
        }
      } else {
        let attempts = 0;
        const interval = setInterval(() => {
          attempts++;
          if (typeof renderMathInElement === 'function') {
            clearInterval(interval);
            triggerKaTeX(target);
          } else if (attempts > 20) {
            clearInterval(interval);
          }
        }, 150);
      }
    }

    function escapeQuizHtml(str) {
      return String(str === undefined || str === null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeSafeImageUrl(rawUrl) {
      if (typeof rawUrl !== 'string') return '';
      let cleaned = rawUrl.trim();
      const driveMatch = cleaned.match(/^https?:\/\/drive\.google\.com\/file\/d\/([^/\s"'<>]+)\/view/i);
      if (driveMatch && driveMatch[1]) {
        cleaned = `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
      }
      if (/[\s"'<>]/.test(cleaned)) return '';
      if (typeof window.sanitizeHttpUrl === 'function') {
        return window.sanitizeHttpUrl(cleaned, false);
      }
      return /^https?:\/\/[^\s"'<>]+$/i.test(cleaned) ? cleaned : '';
    }

    function formatText(text) {
      if (!text) return '';
      const processed = preprocessMath(String(text));
      const safeImages = [];

      const stashImage = (rawUrl) => {
        const safeUrl = normalizeSafeImageUrl(rawUrl);
        if (!safeUrl) return '';
        const idx = safeImages.length;
        safeImages.push(safeUrl);
        return `\n\u0000ZPIMG_${idx}\u0000\n`;
      };

      let work = processed.replace(/\[img\](.*?)\[\/img\]/gi, (_, url) => stashImage(url));
      const imgUrlRegex = /(https?:\/\/[^\s<>"]+?(?:\.(?:jpg|jpeg|png|gif|webp|svg|bmp)(?:[?#][^\s<>"]*)?|(?:drive\.google\.com\/(?:file\/d\/[^/\s]+\/view|uc\?[^\s<>"]*export=download[^\s<>"]*|uc\?[^\s<>"]*id=[^\s<>"]+)|i\.imgur\.com\/[^\s<>"]+|ibb\.co\/[^\s<>"]+|postimg\.cc\/[^\s<>"]+|i\.postimg\.cc\/[^\s<>"]+)))/gi;
      work = work.replace(imgUrlRegex, (url) => stashImage(url));

      const mathProtectRegex = /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$[^\$\n]+?\$)/g;
      const segs = work.split(mathProtectRegex);
      let html = segs.map((seg, i) => {
        if (!seg) return '';
        const escapedSeg = escapeQuizHtml(seg);
        return (i % 2 === 1) ? escapedSeg : escapedSeg.replace(/\n/g, '<br>');
      }).join('');
      html = html.replace(/(<br\s*\/?>\s*){3,}/gi, '<br><br>');
      html = html.replace(/\u0000ZPIMG_(\d+)\u0000/g, (_, idx) => {
        const u = safeImages[parseInt(idx, 10)];
        if (!u) return '';
        return `<br><img src="${escapeQuizHtml(u)}" onerror="this.style.display='none'" loading="lazy"><br>`;
      });
      return html;
    }

    function buildCorrectAnswerHtml(q) {
      const validAnswers = (q && Array.isArray(q.answers))
        ? q.answers.filter(a => a.text && a.text.trim() !== '')
        : [];

      if (q && q.type === 'cauhoi' && validAnswers.length > 0) {
        const correctKeyNorm = String(q.correct || '').trim().toUpperCase();
        const opt = validAnswers.find(a => a.key === q.correct)
          || validAnswers.find(a => String(a.key).trim().toUpperCase() === correctKeyNorm);
        if (opt) {
          return `<div class="qf-ans-option"><span class="qf-ans-key">${escapeQuizHtml(opt.key)}</span><span class="qf-ans-val">${formatText(opt.text)}</span></div>`;
        }
        return `<span class="qf-short-ans">${formatText(String(q.correct || ''))}</span>`;
      }

      if (q && q.type === 'đs' && validAnswers.length > 0) {
        const correctArr = String(q.correct || '').toUpperCase().trim().replace(/D/g, 'Đ').split('');
        return `<div class="qf-tf-chips">${validAnswers.map((a, idx) => {
          const v = correctArr[idx] || 'Đ';
          const isTrue = v === 'Đ';
          return `<span class="qf-tf-chip"><strong>${escapeQuizHtml(a.key)})</strong> <span class="${isTrue ? 'is-true' : 'is-false'}">${isTrue ? 'Đúng' : 'Sai'}</span></span>`;
        }).join('')}</div>`;
      }

      const rawCorrect = String((q && q.correct) || '').trim();
      const parts = rawCorrect.includes('|')
        ? rawCorrect.split('|').map(s => s.trim()).filter(Boolean)
        : [rawCorrect];
      const formatted = parts.filter(Boolean).map(p => formatText(p)).join(' hoặc ') || '—';
      return `<span class="qf-short-ans">${formatted}</span>`;
    }

          <div class="qf-head">
            <div class="qf-title-group">
              <span class="qf-icon-badge" aria-hidden="true">${iconSvg}</span>
              <span class="qf-title">Không chính xác</span>
            </div>
            ${metaHtml}
          </div>
          <div class="qf-section">
            <div class="qf-label">Đáp án đúng:</div>
            <div class="qf-answer-body">${buildCorrectAnswerHtml(q)}</div>
          </div>
          ${explainHtml}
          ${ctaHtml}
        `;
      }

      triggerKaTeX(panel);
      return panel;
    }

    function resetScoreBannerUI() {
      const banner = document.getElementById('scoreBanner');
      if (banner) banner.classList.remove('visible', 'is-failed', 'is-passed');
      const badge = document.getElementById('hwStatusBadge');
      if (badge) {
        badge.style.display = 'none';
        badge.className = 'hw-status-badge';
        badge.textContent = '';
      }
      const label = document.getElementById('scoreLabel');
      if (label) label.textContent = 'Tổng điểm';
      const stats = document.getElementById('hwBannerStats');
      if (stats) {
        stats.style.display = 'none';
        stats.innerHTML = '';
      }
      const actions = document.getElementById('hwBannerActions');
      if (actions) {
        actions.style.display = 'none';
        actions.innerHTML = '';
      }
    }

    function getHomeworkPartMeta(q, idx) {
      const sameType = quizData.filter(item => item.type === q.type);
      const posInPart = sameType.findIndex(item => String(item.id) === String(q.id)) + 1;
      const totalInPart = sameType.length;
      if (q.type === 'cauhoi') {
        return {
          partNum: 'Phần I',
          shortLabel: 'Trắc nghiệm',
          fullTitle: 'Phần I · Trắc nghiệm nhiều phương án lựa chọn',
          posInPart,
          totalInPart
        };
      }
      if (q.type === 'đs') {
        return {
          partNum: 'Phần II',
          shortLabel: 'Đúng / Sai',
          fullTitle: 'Phần II · Câu trắc nghiệm đúng sai',
          posInPart,
          totalInPart
        };
      }
      return {
        partNum: 'Phần III',
        shortLabel: 'Trả lời ngắn',
        fullTitle: 'Phần III · Câu trắc nghiệm trả lời ngắn',
        posInPart,
        totalInPart
      };
    }

    function renderHomeworkHud(justLostLifeIndex = -1) {
      const hud = document.getElementById('homeworkHud');
      if (!hud) return;
      if (!isHomeworkMode || !quizData || quizData.length === 0) {
        hud.classList.remove('visible');
        return;
      }
      hud.classList.add('visible');

      const mcTotal = quizData.filter(q => q.type === 'cauhoi').length;
      const tfTotal = quizData.filter(q => q.type === 'đs').length;
      const saTotal = quizData.filter(q => q.type !== 'cauhoi' && q.type !== 'đs').length;

      const mcDone = hwResults.filter(r => r.type === 'cauhoi').length;
      const tfDone = hwResults.filter(r => r.type === 'đs').length;
      const saDone = hwResults.filter(r => r.type !== 'cauhoi' && r.type !== 'đs').length;

      const currentQ = (!submitted && hwIndex < quizData.length) ? quizData[hwIndex] : null;
      const currentType = currentQ ? currentQ.type : '';

      const partPillsEl = document.getElementById('hwPartPills');
      if (partPillsEl) {
        const pills = [
          { label: 'TN', done: mcDone, total: mcTotal, active: currentType === 'cauhoi' },
          { label: 'Đ/S', done: tfDone, total: tfTotal, active: currentType === 'đs' },
          { label: 'TLN', done: saDone, total: saTotal, active: currentType !== '' && currentType !== 'cauhoi' && currentType !== 'đs' }
        ].filter(p => p.total > 0);

        partPillsEl.innerHTML = pills.map(p => {
          const isDone = p.done >= p.total;
          const cls = ['hw-part-pill', isDone ? 'is-done' : (p.active ? 'is-active' : '')].filter(Boolean).join(' ');
          return `<span class="${cls}">${p.label}: ${p.done}/${p.total}</span>`;
        }).join('');
      }

      const livesLeft = Math.max(0, HW_MAX_LIVES - hwWrongCount);
      const heartsEl = document.getElementById('hwLivesHearts');
      if (heartsEl) {
        let heartsHtml = '';
        for (let i = 0; i < HW_MAX_LIVES; i++) {
          const isLost = i >= livesLeft;
          const isJustLost = (i === justLostLifeIndex);
          heartsHtml += `<span class="hw-heart${isLost ? ' is-lost' : ''}${isJustLost ? ' just-lost' : ''}" aria-hidden="true">${SVG_HEART}</span>`;
        }
        heartsEl.innerHTML = heartsHtml;
      }

      const livesWrap = document.getElementById('hwLivesWrap');
      if (livesWrap) {
        livesWrap.classList.toggle('is-danger', livesLeft <= 1);
        livesWrap.setAttribute(
          'aria-label',
          livesLeft <= 0 ? 'Đã hết mạng, bài làm trượt' : `Còn ${livesLeft} trên ${HW_MAX_LIVES} mạng`
        );
      }

      const trackEl = document.getElementById('hwStepTrack');
      if (trackEl) {
        trackEl.style.gridTemplateColumns = `repeat(${Math.max(1, quizData.length)}, minmax(0, 1fr))`;
        trackEl.innerHTML = quizData.map((q, idx) => {
          const r = hwResults[idx];
          let cls = 'hw-step-dot';
          let title = `Câu ${idx + 1}`;
          if (r) {
            cls += r.isCorrect ? ' is-correct' : ' is-wrong';
            title += r.isCorrect ? ' · Đúng' : ' · Sai';
          } else if (idx === hwIndex && !submitted && !hwFailed) {
            cls += ' is-current';
            title += ' · Đang làm';
          }
          return `<span class="${cls}" title="${title}"></span>`;
        }).join('');
      }

      const progressTextEl = document.getElementById('progressText');
      const progressBarEl = document.querySelector('.progress-bar');
      const progressFillEl = document.getElementById('progressFill');
      if (progressBarEl) progressBarEl.style.display = 'block';
      if (progressTextEl) {
        if (submitted && !hwFailed) {
          progressTextEl.textContent = `Hoàn thành ${quizData.length} / ${quizData.length}`;
        } else if (hwFailed) {
          progressTextEl.textContent = `Dừng ở câu ${Math.min(hwIndex + 1, quizData.length)} / ${quizData.length}`;
        } else {
          progressTextEl.textContent = `Câu ${Math.min(hwIndex + 1, quizData.length)} / ${quizData.length}`;
        }
      }
      if (progressFillEl) {
        const pct = (hwResults.length / Math.max(1, quizData.length)) * 100;
        progressFillEl.style.width = `${pct}%`;
      }
    }

    function updateHomeworkCheckButton() {
      if (!isHomeworkMode || submitted || hwAnsweredCurrent) return;
      const btn = document.getElementById('hwCheckBtn');
      const q = quizData[hwIndex];
      if (!btn || !q) return;
      btn.disabled = !isQuestionAnswered(q);
    }

    function onHomeworkInputChange() {
      if (submitted || hwAnsweredCurrent) return;
      updateHomeworkCheckButton();
    }

    function captureSingleQuestionAnswer(q) {
      const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
      if (q.type === 'đs' && validAnswers.length > 0) {
        const tfObj = {};
        validAnswers.forEach(a => {
          const parent = document.getElementById(`tf-${q.id}-${a.key}`);
          const sel = parent ? parent.querySelector('.tf-btn.selected') : null;
          if (sel && sel.dataset && sel.dataset.val) tfObj[a.key] = sel.dataset.val;
        });
        return tfObj;
      }
      if (q.type === 'cauhoi' && validAnswers.length > 0) {
        const sel = document.querySelector(`#answers-${q.id} .answer-option.selected`);
        return sel ? sel.dataset.key : null;
      }
      const inp = document.getElementById(`short-answer-${q.id}`);
      return inp ? inp.value : '';
    }

    function showHomeworkCard() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = '';

      if (hwIndex >= quizData.length) {
        renderHomeworkHud(-1);
        container.innerHTML = `
          <div class="review-done-msg">
            <h2>Đã hoàn thành ${quizData.length}/${quizData.length} câu hỏi</h2>
            <p style="margin-bottom:18px;">Em đã vượt qua bài tập với <strong>${hwCorrectCount}/${quizData.length} câu đúng</strong> và chỉ sai <strong>${hwWrongCount}/${HW_MAX_LIVES} lần</strong>.</p>
            <button type="button" class="hw-primary-btn" onclick="finishHomeworkPass()">Xem kết quả &amp; Nộp bài</button>
          </div>
        `;
        return;
      }

      hwAnsweredCurrent = false;
      const q = quizData[hwIndex];
      const meta = getHomeworkPartMeta(q, hwIndex);
      const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');

      const partBanner = document.createElement('div');
      partBanner.className = 'hw-part-banner';
      partBanner.innerHTML = `
        <span>${meta.fullTitle}</span>
        <strong>${meta.shortLabel} ${meta.posInPart}/${meta.totalInPart}</strong>
      `;
      container.appendChild(partBanner);

      const card = document.createElement('div');
      card.className = 'question-card review-card-enter';
      card.dataset.id = q.id;

      let answersHTML = '';
      let helperNote = '';

      const qIdSafe = escapeQuizHtml(q.id);
      if (q.type === 'đs' && validAnswers.length > 0) {
        answersHTML = validAnswers.map(a => {
          const aKeySafe = escapeQuizHtml(a.key);
          return `
          <div class="tf-statement" id="tf-${qIdSafe}-${aKeySafe}">
            <div class="tf-text"><strong>${aKeySafe}.</strong> ${formatText(a.text)}</div>
            <div class="tf-toggles seg-control tf-seg" data-selected="none">
              <span class="seg-thumb"></span>
              <div class="tf-btn seg-btn" data-val="Đ" data-qid="${qIdSafe}" data-akey="${aKeySafe}" onclick="selectTF(this, this.dataset.qid, this.dataset.akey, 'Đ')">Đúng</div>
              <div class="tf-btn seg-btn" data-val="S" data-qid="${qIdSafe}" data-akey="${aKeySafe}" onclick="selectTF(this, this.dataset.qid, this.dataset.akey, 'S')">Sai</div>
            </div>
          </div>
        `;
        }).join('');
        helperNote = `Chọn đủ Đúng/Sai cho cả ${validAnswers.length} ý. Phải đúng cả ${validAnswers.length}/${validAnswers.length} ý mới giữ mạng.`;
      } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
        answersHTML = validAnswers.map(a => {
          const aKeySafe = escapeQuizHtml(a.key);
          return `
          <label class="answer-option" data-key="${aKeySafe}" data-qid="${qIdSafe}" onclick="selectAnswer(this, this.dataset.qid)">
            <span class="opt-keycap kbd-cap">${aKeySafe}</span>
            <span class="answer-text">${formatText(a.text)}</span>
          </label>
        `;
        }).join('');
        helperNote = 'Chọn 1 đáp án rồi bấm Kiểm tra đáp án (hoặc phím A–D và Enter).';
      } else {
        answersHTML = `
          <div>
            <input type="text" class="student-input" id="short-answer-${qIdSafe}" placeholder="Nhập câu trả lời" oninput="onHomeworkInputChange()" onkeydown="if(event.key==='Enter'){ event.preventDefault(); checkHomeworkCurrentQuestion(); }">
          </div>
        `;
        helperNote = 'Nhập đáp án rồi bấm Kiểm tra đáp án (hoặc nhấn Enter).';
      }

      card.innerHTML = `
        <div class="q-header">
          <div class="q-num">${String(hwIndex + 1).padStart(2, '0')}</div>
          <span class="q-badge">Câu ${hwIndex + 1}/${quizData.length} · ${meta.shortLabel}</span>
          <span class="q-result-icon" id="icon-${qIdSafe}"></span>
        </div>
        <div class="q-text">${formatText(q.question)}</div>
        <div class="answers-list" id="answers-${qIdSafe}">
          ${answersHTML}
        </div>
        <div class="hw-card-actions" id="hwActions-${qIdSafe}">
          <span class="hw-action-note" id="hwActionNote">${helperNote}</span>
          <div class="hw-btn-row" id="hwBtnRow">
            <button type="button" class="hw-primary-btn" id="hwCheckBtn" disabled onclick="checkHomeworkCurrentQuestion()">Kiểm tra đáp án</button>
          </div>
        </div>
        <div class="qf-panel" id="qfPanel-${qIdSafe}"></div>
      `;

      container.appendChild(card);
      triggerKaTeX(card);
      renderHomeworkHud(-1);

      if (q.type !== 'cauhoi' && q.type !== 'đs' && window.innerWidth > 600) {
        const inp = document.getElementById(`short-answer-${q.id}`);
        if (inp) setTimeout(() => inp.focus(), 60);
      }
    }

    function checkHomeworkCurrentQuestion() {
      if (!isHomeworkMode || submitted || hwFailed || hwAnsweredCurrent) return;
      if (hwIndex >= quizData.length) return;

      const q = quizData[hwIndex];
      const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
      if (!isQuestionAnswered(q)) {
        if (q.type === 'đs' && validAnswers.length > 0) {
          showToast(`Vui lòng chọn đủ Đúng/Sai cho cả ${validAnswers.length} ý`, 'error');
        } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
          showToast('Vui lòng chọn một phương án trước khi kiểm tra', 'error');
        } else {
          showToast('Vui lòng nhập đáp án trước khi kiểm tra', 'error');
          const inp = document.getElementById(`short-answer-${q.id}`);
          if (inp) inp.focus();
        }
        return;
      }

      const studentAnswerSnapshot = captureSingleQuestionAnswer(q);
      const res = evaluateQuestion(q, hwIndex);
      hwAnsweredCurrent = true;

      hwResults.push({
        qId: q.id,
        type: q.type,
        isCorrect: res.isCorrect,
        score: res.score,
        wrongDetail: res.wrongDetail,
        studentAnswer: studentAnswerSnapshot
      });

      const actionsEl = document.getElementById('hwActions-' + q.id);
      if (actionsEl) actionsEl.style.display = 'none';
      const isLastQuestion = (hwIndex >= quizData.length - 1);

      if (res.isCorrect) {
        hwCorrectCount++;
        renderHomeworkHud(-1);
        saveQuizDraft();

        renderQuestionFeedbackPanel(q, {
          isCorrect: true,
          ctaText: isLastQuestion ? 'HOÀN THÀNH & NỘP BÀI' : 'TIẾP TỤC',
          ctaId: 'hwNextBtn',
          ctaOnClick: 'nextHomeworkQuestion()'
        });
        return;
      }

      hwWrongCount++;
      recordMistake(q);
      const livesLeft = Math.max(0, HW_MAX_LIVES - hwWrongCount);
      renderHomeworkHud(livesLeft);

      if (hwWrongCount >= HW_MAX_LIVES) {
        handleHomeworkFail(q);
        return;
      }

      saveQuizDraft();
      const panel = renderQuestionFeedbackPanel(q, {
        isCorrect: false,
        ctaText: isLastQuestion ? 'ĐÃ HIỂU · HOÀN THÀNH' : 'ĐÃ HIỂU',
        ctaId: 'hwNextBtn',
        ctaOnClick: 'nextHomeworkQuestion()'
      });
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (livesLeft === 1) {
        showToast('Cảnh báo: Chỉ còn 1 mạng duy nhất!', 'error');
      }
    }

    function nextHomeworkQuestion() {
      if (!isHomeworkMode || submitted || hwFailed || !hwAnsweredCurrent) return;
      if (hwIndex >= quizData.length - 1) {
        finishHomeworkPass();
        return;
      }

      const container = document.getElementById('quizContainer');
      const currentCard = container ? container.querySelector('.question-card') : null;
      const advance = () => {
        hwIndex++;
        showHomeworkCard();
        const stickyEl = document.getElementById('quizStickyTop');
        const targetTop = stickyEl ? Math.max(0, stickyEl.offsetTop - 8) : 0;
        if (window.scrollY > targetTop + 60) {
          window.scrollTo({ top: targetTop, behavior: 'smooth' });
        }
      };

      if (currentCard) {
        currentCard.classList.remove('review-card-enter');
        currentCard.classList.add('review-card-exit');
        setTimeout(advance, 190);
      } else {
        advance();
      }
    }

    function handleHomeworkFail(lastQuestion) {
      hwFailed = true;
      submitted = true;
      try { localStorage.removeItem(getDraftKey()); } catch (e) {}

      if (lastQuestion) {
        const actionsEl = document.getElementById('hwActions-' + lastQuestion.id);
        if (actionsEl) actionsEl.style.display = 'none';
        renderQuestionFeedbackPanel(lastQuestion, {
          isCorrect: false,
          ctaText: `LÀM LẠI BÀI (${quizData.length} CÂU MỚI)`,
          ctaOnClick: 'retryQuiz()'
        });
      }

      const mcDone = hwResults.filter(r => r.type === 'cauhoi').length;
      const tfDone = hwResults.filter(r => r.type === 'đs').length;
      const saDone = hwResults.filter(r => r.type !== 'cauhoi' && r.type !== 'đs').length;
      const mcTotal = quizData.filter(q => q.type === 'cauhoi').length;
      const tfTotal = quizData.filter(q => q.type === 'đs').length;
      const saTotal = quizData.filter(q => q.type !== 'cauhoi' && q.type !== 'đs').length;

      const banner = document.getElementById('scoreBanner');
      const badge = document.getElementById('hwStatusBadge');
      const scoreValueEl = document.getElementById('scoreValue');
      const scoreLabelEl = document.getElementById('scoreLabel');
      const scoreMsgEl = document.getElementById('scoreMsg');
      const statsEl = document.getElementById('hwBannerStats');
      const actionsEl = document.getElementById('hwBannerActions');

      if (banner) {
        banner.classList.remove('is-passed');
        banner.classList.add('is-failed', 'visible');
      }
      if (badge) {
        badge.className = 'hw-status-badge is-failed';
        badge.style.display = 'inline-flex';
        badge.innerHTML = `${SVG_X} Chưa đạt · Trượt bài tập`;
      }
      if (scoreValueEl) {
        scoreValueEl.textContent = `Sai ${hwWrongCount} / ${HW_MAX_LIVES}`;
        scoreValueEl.style.color = 'var(--wrong)';
      }
      if (scoreLabelEl) {
        scoreLabelEl.textContent = `Dừng ở câu ${Math.min(hwIndex + 1, quizData.length)} / ${quizData.length} · Kết quả chưa được ghi nhận`;
      }
      if (scoreMsgEl) {
        scoreMsgEl.textContent = `Em đã dùng hết ${HW_MAX_LIVES} lượt sai trước khi hoàn thành trọn vẹn bài tập. Các câu sai đã được lưu vào Sổ tay câu sai — hãy xem lời giải câu vừa làm bên dưới rồi bấm Làm lại với bộ ${quizData.length} câu mới nhé.`;
      }
      if (statsEl) {
        statsEl.style.display = 'flex';
        statsEl.innerHTML = `
          <span class="hw-stat-chip">Đúng: <strong style="color:var(--correct)">${hwCorrectCount}</strong></span>
          <span class="hw-stat-chip">Sai: <strong style="color:var(--wrong)">${hwWrongCount}/${HW_MAX_LIVES}</strong></span>
          <span class="hw-stat-chip">TN: <strong>${mcDone}/${mcTotal}</strong></span>
          <span class="hw-stat-chip">Đ/S: <strong>${tfDone}/${tfTotal}</strong></span>
          <span class="hw-stat-chip">TLN: <strong>${saDone}/${saTotal}</strong></span>
        `;
      }
      if (actionsEl) {
        actionsEl.style.display = 'flex';
        actionsEl.innerHTML = `
          <button type="button" class="hw-primary-btn is-danger" onclick="retryQuiz()">Làm lại bài (${quizData.length} câu mới)</button>
        `;
      }

      const retryBtn = document.getElementById('retryBtn');
      if (retryBtn) retryBtn.classList.remove('visible');

      renderHomeworkHud(-1);
      showToast('Đã sai 3 câu! Bài làm bị trượt, em hãy làm lại nhé.', 'error');
      if (banner) banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function finishHomeworkPass() {
      if (!isHomeworkMode || submitted || hwFailed) return;

      const nameInput = document.getElementById('studentName');
      const studentCard = document.getElementById('studentCard');
      const studentName = nameInput ? nameInput.value.trim() : '';

      if (!studentName) {
        if (studentCard) studentCard.classList.add('error');
        if (nameInput) nameInput.focus();
        showToast('Vui lòng nhập họ và tên trước khi nộp bài', 'error');
        setTimeout(() => { if (studentCard) studentCard.classList.remove('error'); }, 2200);
        return;
      }
      if (studentCard) studentCard.classList.remove('error');

      submitted = true;
      hwFailed = false;
      try { localStorage.removeItem(getDraftKey()); } catch (e) {}

      if (nameInput) {
        nameInput.disabled = true;
        nameInput.style.opacity = '0.6';
      }

      const totalRawScore = hwResults.reduce((sum, r) => sum + (Number(r.score) || 0), 0);
      const maxRawScore = quizData.reduce((sum, q) => sum + (q.type === 'đs' ? 1.0 : 0.25), 0);
      const finalScore = maxRawScore > 0 ? parseFloat(((totalRawScore / maxRawScore) * 10).toFixed(2)) : 0;
      const maxScore = 10;
      const livesLeft = Math.max(0, HW_MAX_LIVES - hwWrongCount);

      const wrongAnswersList = hwResults
        .filter(r => !r.isCorrect && r.wrongDetail)
        .map(r => r.wrongDetail);

      const banner = document.getElementById('scoreBanner');
      const badge = document.getElementById('hwStatusBadge');
      const scoreValueEl = document.getElementById('scoreValue');
      const scoreLabelEl = document.getElementById('scoreLabel');
      const scoreMsgEl = document.getElementById('scoreMsg');
      const statsEl = document.getElementById('hwBannerStats');
      const actionsEl = document.getElementById('hwBannerActions');

      if (banner) {
        banner.classList.remove('is-failed');
        banner.classList.add('is-passed', 'visible');
      }
      if (badge) {
        badge.className = 'hw-status-badge is-passed';
        badge.style.display = 'inline-flex';
        badge.innerHTML = `${SVG_CHECK} Đạt yêu cầu · Hoàn thành ${quizData.length}/${quizData.length} câu`;
      }
      if (scoreValueEl) {
        scoreValueEl.textContent = `${finalScore} / ${maxScore}`;
        scoreValueEl.style.color = 'var(--correct)';
      }
      if (scoreLabelEl) {
        scoreLabelEl.textContent = 'Tổng điểm bài tập về nhà';
      }
      if (scoreMsgEl) {
        if (hwWrongCount === 0) {
          scoreMsgEl.textContent = `Xuất sắc tuyệt đối! Em hoàn thành trọn vẹn ${quizData.length}/${quizData.length} câu mà không sai câu nào.`;
        } else if (hwWrongCount === 1) {
          scoreMsgEl.textContent = 'Rất tốt! Em đã vượt qua bài tập về nhà chỉ với 1 lần sai.';
        } else {
          scoreMsgEl.textContent = 'Chúc mừng em đã hoàn thành bài tập về nhà! Hãy xem lại 2 câu sai để nắm chắc kiến thức hơn.';
        }
      }
      if (statsEl) {
        statsEl.style.display = 'flex';
        statsEl.innerHTML = `
          <span class="hw-stat-chip">Đúng: <strong style="color:var(--correct)">${hwCorrectCount}/${quizData.length}</strong></span>
          <span class="hw-stat-chip">Sai: <strong style="color:${hwWrongCount > 0 ? 'var(--wrong)' : 'var(--correct)'}">${hwWrongCount}/${HW_MAX_LIVES}</strong></span>

              <div class="tf-btn seg-btn" data-val="S" data-qid="${qIdSafe}" data-akey="${aKeySafe}" onclick="selectTF(this, this.dataset.qid, this.dataset.akey, 'S')">Sai</div>
