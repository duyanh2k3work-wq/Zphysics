<html lang="vi">

<head>

  <title>Zphysics — Trắc nghiệm Vật lí</title>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
    onload="if(typeof triggerKaTeX==='function'){triggerKaTeX(document.body);}else if(typeof renderMathInElement==='function'){renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});}"></script>

  <script src="assets/js/pinui.js?v=20261118_arial"></script>
  <script>PinUI.initTheme('light');</script>

  <style>
    :root {
      --bg-deep: #f2ede4;
      --bg: #f7f4ee;
      --card: #fdfbf7;
      --card-solid: #fdfbf7;
      --raised: #efe9df;
      --border: rgba(31, 27, 22, 0.08);
      --border-strong: rgba(31, 27, 22, 0.14);
      --shadow: rgba(31, 27, 22, 0.06);
      --text: #1f1b16;
      --text-secondary: #5e554a;
      --muted: #7b7266;
      --teal: #9c27b0;
      --accent: #9c27b0;
      --accent-hover: #7b1fa2;
      --accent-subtle: rgba(156, 39, 176, 0.10);
      --correct: #16a34a;
      --correct-subtle: rgba(22, 163, 74, 0.10);
      --wrong: #dc2626;
      --wrong-subtle: rgba(220, 38, 38, 0.08);
      --warning: #d97706;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      --bg-deep: #07080d;
      --bg: #0b0d14;
      --card: #11141c;
      --card-solid: #11141c;
      --raised: #1a1e28;
      --border: rgba(238, 240, 245, 0.08);
      --border-strong: rgba(238, 240, 245, 0.14);
      --shadow: rgba(0, 0, 0, 0.45);
      --text: #eef0f5;
      --text-secondary: #a3a9b8;
      --muted: #7a8296;
      --teal: #9c27b0;
      --accent: #9c27b0;
      --accent-hover: #ab47bc;
      --accent-subtle: rgba(156, 39, 176, 0.15);
      --correct: #4cc38a;
      --correct-subtle: rgba(76, 195, 138, 0.12);
      --wrong: #e5484d;
      --wrong-subtle: rgba(229, 72, 77, 0.12);
      --warning: #f59e0b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px 80px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      padding: 24px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .back-btn,
    .music-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
    }

    .back-btn:hover,
    .music-btn:hover {
      background: var(--raised);
      color: var(--text);
      border-color: var(--accent);
    }

    .back-btn svg,
    .music-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .music-btn.playing {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent);
    }

    .music-btn.muted {
      opacity: 0.65;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
    }

    .header-info h1 span {
      color: var(--accent);
    }

    .header-info p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── STUDENT CARD ── */
    .student-card {
      margin: 20px 0 16px;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .student-card.error {
      border-color: var(--wrong);
    }

    .student-card label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .label-icon {
      color: var(--muted);
      display: inline-flex;
      align-items: center;
    }

    .student-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      outline: none;
      transition: border-color 150ms var(--ease);
    }

    .student-input::placeholder {
      color: var(--muted);
      font-weight: 400;
    }

    .student-input:focus {
      border-color: var(--accent);
    }

    .student-card.error .student-input {
      border-color: var(--wrong);
    }

    .student-error {
      font-size: 12px;
      color: var(--wrong);
      margin-top: 6px;
      display: none;
    }

    .student-card.error .student-error {
      display: block;
    }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      position: sticky;
      top: 12px;
      z-index: 100;
      margin: 16px 0 24px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      box-shadow: 0 4px 16px var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .progress-text {
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      border-radius: 4px;
      background: var(--raised);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width 300ms var(--ease);
      width: 0%;
    }

    .quiz-timer {
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-subtle);
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .quiz-timer.urgent {
      color: var(--wrong);
      background: var(--wrong-subtle);
    }

    /* ── SCORE BANNER ── */
    .score-banner {
      margin: 16px 0 24px;
      padding: 24px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      text-align: center;
      display: none;
    }

    .score-banner.visible {
      display: block;
    }

    .score-value {
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 40px;
      font-weight: 500;
      line-height: 1.05;
    }

    .score-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    .score-msg {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-top: 10px;
    }

    /* ── PART HEADERS ── */
    .part-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-strong);
    }

    /* ── QUESTION CARD ── */
    .question-card {
      margin-bottom: 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: border-color 180ms var(--ease);
    }

    .question-card.correct-card {
      border-color: var(--correct);
    }

    .question-card.wrong-card {
      border-color: var(--wrong);
    }

    .q-header {
      padding: 20px 24px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .q-num {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--raised);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .q-badge {
      font-size: 13px;
      color: var(--muted);
    }

    .q-result-icon {
      margin-left: auto;
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .q-result-icon.is-correct {
      background: var(--correct-subtle);
      color: var(--correct);
    }

    .q-result-icon.is-wrong {
      background: var(--wrong-subtle);
      color: var(--wrong);
    }

    .q-text {
      padding: 0 24px 16px;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--text);
    }

    .q-text img,
    .answer-text img,
    .explanation img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin: 8px 0;
    }

    /* ── ANSWER OPTIONS ── */
    .answers-list {
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      user-select: none;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .answer-option:hover {
      background: var(--raised);
      border-color: var(--border-strong);
    }

    .answer-option.selected {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }

    .answer-option.locked {
      pointer-events: none;
    }

    .answer-option.is-correct {
      border-color: var(--correct) !important;
      background: var(--correct-subtle) !important;
    }

    .answer-option.is-wrong {
      border-color: var(--wrong) !important;
      background: var(--wrong-subtle) !important;
    }

    .radio-dot {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms var(--ease);
    }

    .radio-dot::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: scale(0);
      transition: transform 150ms var(--ease);
    }

    .answer-option.selected .radio-dot {
      border-color: var(--accent);
    }

    .answer-option.selected .radio-dot::after {
      transform: scale(1);
    }

    .opt-keycap {
      min-width: 24px;
      height: 24px;
      margin-top: -1px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
    }

    .answer-option.selected .opt-keycap {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    html[data-theme="dark"] .answer-option.selected .opt-keycap {
      color: #ffffff;
    }

    .answer-option.is-correct .opt-keycap {
      background: var(--correct) !important;
      border-color: var(--correct) !important;
      color: #ffffff !important;
    }

    .answer-option.is-wrong .opt-keycap {
      background: var(--wrong) !important;
      border-color: var(--wrong) !important;
      color: #ffffff !important;
    }

    .kbd-hint-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .kbd-hint-pill {
        display: none;
      }
    }

    .answer-option.is-correct .radio-dot {
      border-color: var(--correct);
    }

    .answer-option.is-correct .radio-dot::after {
      background: var(--correct);
      transform: scale(1);
    }

    .answer-option.is-wrong .radio-dot {
      border-color: var(--wrong);
    }

    .answer-option.is-wrong .radio-dot::after {
      background: var(--wrong);
      transform: scale(1);
    }

    .answer-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
      flex: 1;
    }

    /* ── TRUE / FALSE STATEMENTS ── */
    .tf-statement {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .tf-text {
      flex: 1;
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
    }

    .tf-toggles {
      flex-shrink: 0;
    }

    .tf-btn {
      padding: 5px 12px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .tf-btn:hover {
      color: var(--text);
    }

    .tf-btn.selected[data-val="Đ"] {
      color: #ffffff;
    }

    .tf-btn.selected[data-val="S"] {
      color: #ffffff;
    }

    /* ── EXPLANATION ── */
    .explanation {
      margin: 0 20px 20px;
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--raised);
      border-left: 2px solid var(--accent);
      font-size: 13px;
      color: var(--text);
      line-height: 1.65;
      display: none;
    }

    .explanation.visible {
      display: block;
    }

    .explanation strong {
      font-weight: 600;
      color: var(--accent);
    }

    /* ── SUBMIT & RETRY ── */
    .submit-wrap {
      text-align: center;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      padding: 0 32px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      background: var(--accent);
      transition: background-color 150ms var(--ease), transform 150ms var(--ease);
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    html[data-theme="dark"] .submit-btn,
    html[data-theme="dark"] .grade-btn,
    html[data-theme="dark"] .review-end-btn {
      color: #ffffff;
    }

    .retry-btn {
      display: none;
      height: 40px;
      padding: 0 24px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .retry-btn.visible {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .retry-btn:hover {
      background: var(--raised);
      border-color: var(--accent);
    }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 12px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── REVIEW MODE ── */
    .review-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border-strong);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 9999;
    }

    .review-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .rv-stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .rv-stat strong {
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .review-end-btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms var(--ease);
    }

    .review-end-btn:hover {
      background: var(--accent-hover);
    }

    .review-end-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .review-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 4px 20px 20px;
    }

    .skip-btn,
    .grade-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      border-radius: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .skip-btn {
      background: var(--raised);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
    }

    .skip-btn:hover {
      color: var(--text);
    }

    .grade-btn {
      background: var(--accent);
      border: none;
      color: #ffffff;
    }

    .grade-btn:hover {
      background: var(--accent-hover);
    }

    .review-done-msg {
      text-align: center;
      padding: 56px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .review-done-msg h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .review-done-msg p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .review-card-enter {
      animation: fadeEnter 240ms var(--ease) both;
    }

    .review-card-exit {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }

    @keyframes fadeEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      animation: fadeEnter 200ms var(--ease) both;
    }

    .toast.success {
      background: var(--correct);
    }

    .toast.error {
      background: var(--wrong);
    }

    .toast.hide {
      opacity: 0;
      transition: opacity 200ms var(--ease);
    }

    @media (max-width: 600px) {
      .q-header,

    const SVG_VOL_ON = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
    const SVG_VOL_OFF = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';

    if (window.location.protocol.startsWith('http') && !window.Capacitor) {
      const path = window.location.pathname;
      if (path.endsWith('.html')) {
        let cleanPath = path.substring(0, path.length - 5);
        if (cleanPath.endsWith('/index')) {
          cleanPath = cleanPath.substring(0, cleanPath.length - 5) || '/';
        }
        history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
      }
    }

    var SUPABASE_URL = window.SUPABASE_URL || 'https://uztfmglzpfrwvamuggwx.supabase.co';
    var SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_XdBJ6z0Yj_nQyvn7FSemew_B8ewlDOM';
    var SESSION_KEY = window.SESSION_KEY || 'zphysics_session';

    function getSession() {
      try {
        const s = localStorage.getItem(SESSION_KEY);
        if (!s) return null;
        const session = JSON.parse(s);
        if (session.premium && session.premium_until) {
          const expDate = new Date(session.premium_until);
          if (expDate < new Date()) {
            session.premium = false;
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          }
        }
        return session;
      } catch {
        return null;
      }
    }

    const currentSession = getSession();
    if (!currentSession || !currentSession.gmail) {
      window.location.href = './';
    } else {
      if (currentSession.premium) {
        document.body.classList.add('premium-theme');
        const explicitTheme = localStorage.getItem('zphysics_theme');
        const resolved = (explicitTheme === 'light' || explicitTheme === 'dark')
          ? explicitTheme
          : (localStorage.getItem('zphysics_premium_mode') === 'light' ? 'light' : 'dark');
        PinUI.applyTheme(resolved);
      } else {
        const explicitTheme = localStorage.getItem('zphysics_theme');
        PinUI.applyTheme(explicitTheme === 'dark' ? 'dark' : 'light');
      }

      if (currentSession.gmail.startsWith('demo_')) {
        window.addEventListener('DOMContentLoaded', () => {
          const nameInput = document.getElementById('studentName');
          if (nameInput) {
            nameInput.value = currentSession.ten || 'Demo Student';
            nameInput.disabled = true;
            nameInput.style.opacity = '0.7';
          }
        });
      } else {
        const authHeader = currentSession.access_token ? `Bearer ${currentSession.access_token}` : `Bearer ${SUPABASE_ANON_KEY}`;
        const checkUrl = `${SUPABASE_URL}/rest/v1/students?email=eq.${encodeURIComponent(currentSession.gmail)}&select=*`;
        fetch(checkUrl, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': authHeader
          }
        })
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(students => {
            if (!students || students.length === 0) {
              localStorage.removeItem(SESSION_KEY);
              window.location.href = './';
            } else {
              const student = students[0];
              const isPremium = student.role === 'premium' && (!student.premium_until || new Date(student.premium_until) > new Date());
              localStorage.setItem(SESSION_KEY, JSON.stringify({
                gmail: currentSession.gmail,
                ten: student.full_name || currentSession.gmail,
                lop: student.lop || currentSession.lop || '',
                premium: isPremium,
                premium_until: student.premium_until,
                access_token: currentSession.access_token
              }));

              if (isPremium) {
                document.body.classList.add('premium-theme');
                const explicitTheme = localStorage.getItem('zphysics_theme');
                const resolved = (explicitTheme === 'light' || explicitTheme === 'dark')
                  ? explicitTheme
                  : (localStorage.getItem('zphysics_premium_mode') === 'light' ? 'light' : 'dark');
                PinUI.applyTheme(resolved);
              } else {
                document.body.classList.remove('premium-theme');
                const explicitTheme = localStorage.getItem('zphysics_theme');
                PinUI.applyTheme(explicitTheme === 'dark' ? 'dark' : 'light');
              }

              const nameInput = document.getElementById('studentName');
              if (nameInput) {
                nameInput.value = student.full_name || currentSession.gmail;
              }
            }
          })
          .catch(err => {
            console.warn('Lỗi xác thực trực tuyến trang trắc nghiệm, dùng phiên offline:', err);
          });

    }

    window.addEventListener('DOMContentLoaded', () => {
      if (currentSession && currentSession.ten && !currentSession.gmail.startsWith('demo_')) {
        const nameInput = document.getElementById('studentName');
        if (nameInput) {
          nameInput.value = currentSession.ten;

      const backBtn = document.querySelector('.back-btn');

          if (!submitted) {

      window.addEventListener('beforeunload', (e) => {
        if (!submitted) {
          e.preventDefault();
          e.returnValue = 'Bạn có chắc chắn muốn thoát? Kết quả làm bài sẽ không được lưu.';

      });
    });

    const SHEETS_API_URL = localStorage.getItem('ZPHYSICS_API_URL') || 'https://script.google.com/macros/s/AKfycbzxnkAXTX9lMgdq854Nm8CAWiaULzHD7MAo4Er7XBVnmfxhubWP4KWSF5_yNfVaCKXMdQ/exec';

    let quizData = [];
    let submitted = false;
    let lessonInfo = null;

    let timerInterval = null;
    let timeRemaining = 30 * 60;

    let rvIndex = 0;
    let rvCorrect = 0;
    let rvWrong = 0;
    let rvSkipped = 0;
    let rvResults = [];

    let studyMode = 'exam';
    let flaggedQuestionIds = new Set();
    let checkedQuestionIds = new Set();
    let autosaveIntervalId = null;
    try { localStorage.removeItem('zp_mistakes_v1'); } catch (e) {}

    function getCurrentAccountEmail() {
      const s = getSession();
      return (s && s.gmail) ? String(s.gmail).trim().toLowerCase() : '';
    }

    function getCurrentAccountGrade() {
      const s = getSession();
      const m = (s && s.lop) ? String(s.lop).match(/\d+/) : null;
      return m ? m[0] : '';
    }

    function getMistakeStorageKey() {
      const email = getCurrentAccountEmail();
      return email ? `zp_mistakes_v2_${email}` : 'zp_mistakes_v2_guest';
    }

    function parseQuizCode(code) {
      if (!code) return null;
      const parts = code.split('_');
      if (parts.length >= 4) {
        const typeMap = { 'cauhoi': 'Trắc nghiệm', 'đs': 'Đúng/Sai', 'tln': 'Trả lời ngắn' };
        return {
          grade: `Vật lí ${parts[1]}`,
          chapter: `Chương ${parts[2].toUpperCase().replace('C', '')}`,
          lesson: `Bài ${parseInt(parts[3].toUpperCase().replace('B', ''), 10)}`,
          type: typeMap[parts[0]] || parts[0]
        };
      }
      return null;
    }

    function escapeTelegramHtml(text) {
      if (text === undefined || text === null) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function cleanQuestionTextForTelegram(text) {
      if (text === undefined || text === null) return '';
      const cleaned = String(text)
        .replace(/\r\n/g, '\n')
        .replace(/\[img\](.*?)\[\/img\]/gi, ' [Hình: $1] ')
        .replace(/[ \t]{2,}/g, ' ')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      return escapeTelegramHtml(cleaned);
    }

    function formatWrongQuestionReport(q, questionNumber, detail) {
      const qText = cleanQuestionTextForTelegram(q && q.question) || '(Không có nội dung câu hỏi)';
      const validAnswers = (q && Array.isArray(q.answers))
        ? q.answers.filter(a => a.text && a.text.trim() !== '')
        : [];

      if (detail.mode === 'đs') {
        const wrongStatements = detail.wrongStatements || [];
        if (wrongStatements.length === 0) {
          return `<b>Câu ${questionNumber} (Đúng/Sai):</b> ${qText}\n• Đúng: ${cleanQuestionTextForTelegram((q && q.correct) || '')}`;
        }
        const stmtLines = wrongStatements.map(s =>
          `• Ý ${escapeTelegramHtml(s.key)}: ${cleanQuestionTextForTelegram(s.text)}\n  ↳ Chọn: ${escapeTelegramHtml(s.studentVal)} | Đúng: ${escapeTelegramHtml(s.exactCorrectVal)}`
        ).join('\n');
        return `<b>Câu ${questionNumber} (Đúng/Sai - Sai ${wrongStatements.length} ý):</b> ${qText}\n${stmtLines}`;
      }

      if (detail.mode === 'cauhoi') {
        const selectedKey = detail.selectedKey;
        const chosenOpt = selectedKey ? validAnswers.find(a => a.key === selectedKey) : null;
        const correctKeyNorm = String((q && q.correct) || '').trim().toUpperCase();
        const correctOpt = validAnswers.find(a => a.key === q.correct)
          || validAnswers.find(a => String(a.key).trim().toUpperCase() === correctKeyNorm);

        const chosenText = chosenOpt
          ? `${escapeTelegramHtml(chosenOpt.key)}. ${cleanQuestionTextForTelegram(chosenOpt.text)}`
          : escapeTelegramHtml(detail.studentAnsText || 'Không chọn');
        const correctText = correctOpt
          ? `${escapeTelegramHtml(correctOpt.key)}. ${cleanQuestionTextForTelegram(correctOpt.text)}`
          : cleanQuestionTextForTelegram((q && q.correct) || '');

        return `<b>Câu ${questionNumber}:</b> ${qText}\n• Chọn: ${chosenText}\n• Đúng: ${correctText}`;
      }

      const studentInput = detail.studentAnsText || 'Bỏ trống';
      return `<b>Câu ${questionNumber} (Trả lời ngắn):</b> ${qText}\n• Điền: "${cleanQuestionTextForTelegram(studentInput)}" | Đúng: ${cleanQuestionTextForTelegram((q && q.correct) || '')}`;
    }

    function buildTelegramReportChunks(header, continuationHeader, wrongAnswersList, maxLen = 3500) {
      if (!wrongAnswersList || wrongAnswersList.length === 0) {
        return [header + '\n\n🎉 Tuyệt vời! Không sai câu nào.'];
      }

      const firstPrefix = `${header}\n\n❌ <b>Các câu làm sai:</b>\n`;
      const nextPrefix = `${continuationHeader}\n\n❌ <b>Các câu làm sai (tiếp):</b>\n`;
      const maxSingleItemLen = Math.max(500, maxLen - Math.max(firstPrefix.length, nextPrefix.length) - 40);

      const normalizedItems = [];
      wrongAnswersList.forEach(item => {
        if (item.length <= maxSingleItemLen) {
          normalizedItems.push(item);
          return;
        }
        const lines = item.split('\n');
        let part = '';
        lines.forEach(line => {
          if (line.length > maxSingleItemLen) {
            if (part) {
              normalizedItems.push(part);
              part = '';
            }
            let pos = 0;
            while (pos < line.length) {
              let end = Math.min(pos + maxSingleItemLen, line.length);
              if (end < line.length) {
                const ampIdx = line.lastIndexOf('&', end - 1);
                if (ampIdx > pos && line.indexOf(';', ampIdx) >= end) end = ampIdx;
                const ltIdx = line.lastIndexOf('<', end - 1);
                if (ltIdx > pos && line.indexOf('>', ltIdx) >= end) end = ltIdx;
              }
              if (end <= pos) end = Math.min(pos + maxSingleItemLen, line.length);
              normalizedItems.push(line.slice(pos, end));
              pos = end;
            }
          } else if (!part) {
            part = line;
          } else if (part.length + 1 + line.length <= maxSingleItemLen) {
            part += '\n' + line;
          } else {
            normalizedItems.push(part);
            part = line;
          }
        });
        if (part) normalizedItems.push(part);
      });

      const chunks = [];
      let current = firstPrefix;
      let hasItemsInCurrent = false;

      normalizedItems.forEach(item => {
        const sep = hasItemsInCurrent ? '\n\n' : '';
        if (hasItemsInCurrent && (current.length + sep.length + item.length > maxLen)) {
          chunks.push(current);
          current = nextPrefix + item;
          hasItemsInCurrent = true;
        } else {
          current += sep + item;
          hasItemsInCurrent = true;
        }
      });
      if (hasItemsInCurrent) chunks.push(current);

      if (chunks.length > 1) {
        return chunks.map((chunk, idx) => `${chunk}\n\n<i>(Phần ${idx + 1}/${chunks.length})</i>`);
      }
      return chunks;
    }

    function sendResultToTelegram(studentName, score, total, wrongAnswersList) {
      let quizDetails = '';
      if (lessonInfo) {
        quizDetails = `\n- Lớp: ${escapeTelegramHtml(lessonInfo.grade)}\n- Chương: ${escapeTelegramHtml(lessonInfo.chapter)}\n- Bài học: ${escapeTelegramHtml(lessonInfo.lesson)}`;
      } else {
        const parsed = parseQuizCode(quizFile);
        if (parsed) {
          quizDetails = `\n- Lớp: ${escapeTelegramHtml(parsed.grade)}\n- ${escapeTelegramHtml(parsed.chapter)}\n- ${escapeTelegramHtml(parsed.lesson)} (${escapeTelegramHtml(parsed.type)})`;
        } else {
          quizDetails = `\n- Mã đề: ${escapeTelegramHtml(quizFile)}`;
        }
      }

      const safeStudentName = escapeTelegramHtml(studentName);
      const header = `📚 <b>Báo cáo kết quả:</b>${quizDetails}\n- Học sinh: <b>${safeStudentName}</b>\n- Điểm số: <b>${score}/${total}</b>`;
      const continuationHeader = `📚 <b>Báo cáo kết quả:</b>\n- Học sinh: <b>${safeStudentName}</b> (${score}/${total})`;
      const messages = buildTelegramReportChunks(header, continuationHeader, wrongAnswersList);

      (async () => {
        let allOk = true;
        for (const msg of messages) {
          try {
            const res = await fetch(SHEETS_API_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'sendReport', message: msg })
            });
            if (!res.ok) allOk = false;
          } catch (err) {
            allOk = false;
          }
        }
        showToast(allOk ? 'Đã nộp bài thành công' : 'Đã nộp bài', 'success');
      })();
    }

    function showToast(msg, type) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.textContent = msg;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    const params = new URLSearchParams(window.location.search);
    let quizFile = params.get('quiz');
    let urlModeParam = params.get('mode');

    if (!quizFile && window.location.hash) {
      const rawHash = window.location.hash.substring(1);
      const [hashMain, hashQuery] = rawHash.split('?');
      if (hashQuery) {
        const hq = new URLSearchParams(hashQuery);
        if (!urlModeParam && hq.has('mode')) urlModeParam = hq.get('mode');
        if (!quizFile && hq.has('quiz')) quizFile = hq.get('quiz');
      }
      const hashParams = new URLSearchParams(hashMain);
      if (!quizFile && hashParams.has('quiz')) {
        quizFile = hashParams.get('quiz');
      } else if (!quizFile && hashMain && !hashMain.includes('=')) {
        quizFile = hashMain;
      }
      if (!urlModeParam && hashParams.has('mode')) {
        urlModeParam = hashParams.get('mode');
      }
    }
    if (!quizFile || quizFile === 'cauhoi') quizFile = 'baitap_10_c1_b01';
    try { quizFile = decodeURIComponent(quizFile); } catch (e) {}
    if (quizFile === 'cauhoi') quizFile = 'baitap_10_c1_b01';

    const isMistakeQuiz = quizFile.startsWith('mistakes');
    const isReviewMode = quizFile.startsWith('ontap_');

    if (isMistakeQuiz) {
      studyMode = 'practice';
    } else if (urlModeParam === 'practice' || urlModeParam === 'exam') {
      studyMode = urlModeParam;
    } else {
      try {
        studyMode = localStorage.getItem('zphysics_quiz_mode') === 'practice' ? 'practice' : 'exam';
      } catch (e) {
        studyMode = 'exam';
      }
    }

    if (window.location.protocol.startsWith('http') && !window.Capacitor) {
      const cleanPath = window.location.pathname.replace(/\.html$/, '');
      if (window.location.search.includes('quiz=')) {
        history.replaceState(null, '', cleanPath + '#' + quizFile + (urlModeParam ? `?mode=${urlModeParam}` : ''));
      }
    }

    function getMistakesList() {
      try {
        const raw = localStorage.getItem(getMistakeStorageKey());
        const parsed = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(parsed)) return [];
        const email = getCurrentAccountEmail();
        const userGrade = getCurrentAccountGrade();
        return parsed.filter((item) => {
          if (!item || typeof item !== 'object') return false;
          if (item.ownerEmail && email && String(item.ownerEmail).trim().toLowerCase() !== email) return false;
          if (userGrade && item.grade && String(item.grade) !== String(userGrade)) return false;
          return true;
        });
      } catch (e) {
        return [];
      }
    }

    function saveMistakesList(list) {
      try {
        localStorage.setItem(getMistakeStorageKey(), JSON.stringify(list));
      } catch (e) {}
    }

    function inferQuestionGrade(q) {
      const rawMade = String((q && (q._originMade || q.made)) || quizFile || '');
      const m = rawMade.match(/(?:^|_)(\d{2})(?:_|$)/);
      if (m) return m[1];
      if (lessonInfo && lessonInfo.grade) {
        const lm = String(lessonInfo.grade).match(/\d+/);
        if (lm) return lm[0];
      }
      return '';
    }

    function recordMistake(q) {
      if (!q || !q.question) return;
      const list = getMistakesList();
      const qKey = String(q.id);
      const email = getCurrentAccountEmail();
      const originMade = q._originMade || (isMistakeQuiz ? q.made : quizFile) || quizFile;
      const grade = q._originGrade || inferQuestionGrade(q);
      const parsedMeta = parseQuizCode(originMade);
      const lessonLabel = q._originLesson
        || (lessonInfo ? lessonInfo.lesson : '')
        || (parsedMeta ? `${parsedMeta.chapter} · ${parsedMeta.lesson}` : originMade);
      const existingIdx = list.findIndex(item => String(item.id) === qKey);

      if (existingIdx !== -1) {
        list[existingIdx].wrongCount = (list[existingIdx].wrongCount || 1) + 1;
        list[existingIdx].lastWrongAt = Date.now();
        if (email) list[existingIdx].ownerEmail = email;
        if (!list[existingIdx].grade && grade) list[existingIdx].grade = grade;
        if (!list[existingIdx].lessonTitle && lessonLabel) list[existingIdx].lessonTitle = lessonLabel;
      } else {
        list.unshift({
          id: q.id,
          ownerEmail: email,
          made: originMade,
          grade: grade,
          lessonTitle: lessonLabel,
          chapterTitle: (lessonInfo && lessonInfo.chapter) || q._originChapter || '',
          type: q.type,
          question: q.question,
          answers: q.answers,
          correct: q.correct,
          explanation: q.explanation || '',
          wrongCount: 1,
          lastWrongAt: Date.now()
        });
      }
      saveMistakesList(list.slice(0, 200));
    }

    function resolveMistake(qId) {
      const list = getMistakesList();
      const qKey = String(qId);
      const next = list.filter(item => String(item.id) !== qKey);
      if (next.length !== list.length) {
        saveMistakesList(next);
        return true;
      }
      return false;
    }

    function getDraftKey() {
      return 'zphysics_draft_quiz_' + (getCurrentAccountEmail() || 'guest') + '_' + quizFile;
    }

    function loadQuizDraft() {
      try {
        const raw = localStorage.getItem(getDraftKey());
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return (parsed && typeof parsed === 'object') ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function updateAutosaveStatus(label, isSaved) {
      const pill = document.getElementById('autosaveStatus');
      const txt = document.getElementById('autosaveText');
      if (txt) txt.textContent = label;
      if (pill) pill.classList.toggle('is-saved', !!isSaved);
    }

    function collectQuizAnswersState() {
      const answers = {};
      quizData.forEach(q => {
        const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
        if (q.type === 'đs' && validAnswers.length > 0) {
          const tfObj = {};
          validAnswers.forEach(a => {
            const parent = document.getElementById(`tf-${q.id}-${a.key}`);
            const sel = parent ? parent.querySelector('.tf-btn.selected') : null;
            if (sel && sel.dataset && sel.dataset.val) {
              tfObj[a.key] = sel.dataset.val;
            }
          });
          if (Object.keys(tfObj).length > 0) answers[String(q.id)] = tfObj;
        } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
          const sel = document.querySelector(`#answers-${q.id} .answer-option.selected`);
          if (sel && sel.dataset && sel.dataset.key) {
            answers[String(q.id)] = sel.dataset.key;
          }
        } else {
          const inp = document.getElementById(`short-answer-${q.id}`);
          if (inp && inp.value.trim() !== '') {
            answers[String(q.id)] = inp.value;
          }
        }
      });
      return answers;
    }

    function saveQuizDraft() {
      if (submitted || isReviewMode || !Array.isArray(quizData) || quizData.length === 0) return;
      try {
        const draft = {
          quizFile: quizFile,
          questionIds: quizData.map(q => q.id),
          answers: collectQuizAnswersState(),
          flaggedIds: Array.from(flaggedQuestionIds),
          checkedIds: Array.from(checkedQuestionIds),
          studyMode: studyMode,
          timeRemaining: timeRemaining,
          updatedAt: Date.now()
        };
        localStorage.setItem(getDraftKey(), JSON.stringify(draft));
        const d = new Date();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        updateAutosaveStatus(`Đã tự lưu ${hh}:${mm}`, true);
      } catch (e) {}
    }

    function clearQuizDraft(resetUI) {
      if (resetUI && studyMode === 'practice') return;
      if (resetUI && !confirm('Xóa toàn bộ đáp án nháp đang lưu cho bài này?')) {
        return;
      }
      try {
        localStorage.removeItem(getDraftKey());
      } catch (e) {}
      if (resetUI) {
        flaggedQuestionIds.clear();
        checkedQuestionIds.clear();
        submitted = false;
        const banner = document.getElementById('scoreBanner');
        if (banner) banner.classList.remove('visible');
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) submitBtn.style.display = '';
        const retryBtn = document.getElementById('retryBtn');
        if (retryBtn) retryBtn.classList.remove('visible');
        renderQuiz(quizData);
        startTimer();
        updateAutosaveStatus('Đã xóa nháp', false);
        showToast('Đã xóa bản nháp làm bài', 'success');
      }
    }

    function setStudyMode(mode, skipSave) {
      if (isReviewMode) return;
      studyMode = (mode === 'practice') ? 'practice' : 'exam';
      if (!isMistakeQuiz) {
        try { localStorage.setItem('zphysics_quiz_mode', studyMode); } catch (e) {}
      }
      document.body.classList.toggle('study-mode-practice', studyMode === 'practice');
      const seg = document.getElementById('quizModeSeg');
      if (seg) {
        seg.style.setProperty('--seg-index', studyMode === 'practice' ? '1' : '0');
        seg.querySelectorAll('.seg-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === studyMode);
        });
      }
      if (!skipSave) saveQuizDraft();
    }

    function toggleQuestionPalette() {
      const card = document.getElementById('questionPaletteCard');
      const btn = document.getElementById('togglePaletteBtn');
      if (!card || !btn) return;
      const isCollapsed = card.classList.toggle('collapsed');
      btn.textContent = isCollapsed ? 'Hiện bảng câu hỏi' : 'Ẩn bảng câu hỏi';
    }

    function isQuestionAnswered(q) {
      const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
      if (q.type === 'đs' && validAnswers.length > 0) {
        const selectedTf = document.querySelectorAll(`#answers-${q.id} .tf-btn.selected`);
        return selectedTf.length === validAnswers.length;
      } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
        return !!document.querySelector(`#answers-${q.id} .answer-option.selected`);
      } else {
        const inp = document.getElementById(`short-answer-${q.id}`);
        return !!(inp && inp.value.trim() !== '');
      }
    }

    function renderQuestionPalette() {
      const card = document.getElementById('questionPaletteCard');
      const grid = document.getElementById('questionPaletteGrid');
      const statsEl = document.getElementById('questionPaletteStats');
      if (!card || !grid) return;

      if (isReviewMode || !quizData || quizData.length === 0) {
        card.style.display = 'none';
        return;
      }
      card.style.display = '';

      let answeredCount = 0;
      let flaggedCount = 0;

      grid.innerHTML = quizData.map((q, idx) => {
        const qKey = String(q.id);
        const cardEl = document.querySelector(`.question-card[data-id="${q.id}"]`);
        const isCorrect = cardEl && cardEl.classList.contains('correct-card');
        const isWrong = cardEl && cardEl.classList.contains('wrong-card');
        const isAnswered = isQuestionAnswered(q);
        const isFlagged = flaggedQuestionIds.has(qKey);

        if (isAnswered) answeredCount++;
        if (isFlagged) flaggedCount++;

        const classes = ['qp-chip'];
        if (isCorrect) classes.push('is-correct');
        else if (isWrong) classes.push('is-wrong');
        else if (isAnswered) classes.push('is-answered');
        if (isFlagged) classes.push('is-flagged');

        return `<button type="button" class="${classes.join(' ')}" onclick="scrollToQuestion('${escapeTelegramHtml(qKey)}')" title="Câu ${idx + 1}${isFlagged ? ' (Đang phân vân)' : ''}">${String(idx + 1).padStart(2, '0')}</button>`;
      }).join('');

      const unansweredCount = Math.max(0, quizData.length - answeredCount);
      if (statsEl) {
        statsEl.innerHTML = `
          <span>Đã làm: <strong>${answeredCount}/${quizData.length}</strong></span>
          <span>Chưa làm: <strong>${unansweredCount}</strong></span>
          <span>Phân vân: <strong style="color:var(--warning)">${flaggedCount}</strong></span>
        `;
      }
    }

    function scrollToQuestion(qId) {
      const card = document.querySelector(`.question-card[data-id="${qId}"]`);
      if (!card) return;
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.boxShadow = '0 0 0 2px var(--accent)';
      setTimeout(() => { card.style.boxShadow = ''; }, 1000);
    }

    function toggleQuestionFlag(qId) {
      const qKey = String(qId);
      const card = document.querySelector(`.question-card[data-id="${qKey}"]`);
      const btn = document.getElementById('flag-btn-' + qKey);
      if (flaggedQuestionIds.has(qKey)) {
        flaggedQuestionIds.delete(qKey);
        if (card) card.classList.remove('flagged-card');
        if (btn) {
          btn.classList.remove('flagged');
          btn.innerHTML = `${SVG_FLAG}<span>Xem lại</span>`;
        }
      } else {
        flaggedQuestionIds.add(qKey);
        if (card) card.classList.add('flagged-card');
        if (btn) {
          btn.classList.add('flagged');
          btn.innerHTML = `${SVG_FLAG}<span>Phân vân</span>`;
        }
      }
      renderQuestionPalette();
      saveQuizDraft();
    }

    function checkSingleQuestion(qId, opts = {}) {
      const idx = quizData.findIndex(item => String(item.id) === String(qId));
      if (idx === -1) return;
      const q = quizData[idx];

      if (q.type !== 'cauhoi' && q.type !== 'đs' && !opts.allowEmpty) {
        const inp = document.getElementById(`short-answer-${q.id}`);
        if (inp && inp.value.trim() === '' && !opts.skipMistakeUpdate) {
          showToast('Vui lòng nhập đáp án trước khi kiểm tra', 'error');
          inp.focus();
          return;
        }
      } else if (!opts.allowEmpty && !opts.skipMistakeUpdate && q.type === 'cauhoi') {
        const sel = document.querySelector(`#answers-${q.id} .answer-option.selected`);
        if (!sel) {
          showToast('Vui lòng chọn một phương án trước khi kiểm tra', 'error');
          return;
        }
      }

      const res = evaluateQuestion(q, idx);
      checkedQuestionIds.add(String(q.id));

      const checkBtn = document.getElementById(`check-btn-${q.id}`);
      const tipEl = document.getElementById(`ptip-${q.id}`);
      if (checkBtn) checkBtn.style.display = 'none';
      if (tipEl) tipEl.textContent = res.isCorrect ? 'Chính xác! Đọc lời giải để củng cố.' : 'Đã lưu vào Sổ tay câu sai để ôn lại.';

      const explainEl = document.getElementById('explain-' + q.id);
      if (explainEl) triggerKaTeX(explainEl);

      if (!opts.skipMistakeUpdate) {
        if (!res.isCorrect) {
          recordMistake(q);
        } else if (isMistakeQuiz) {
          if (resolveMistake(q.id)) {
            showToast('Tuyệt vời! Đã xóa câu này khỏi Sổ tay câu sai.', 'success');
          }
        }
      }

      updateProgress();
      checkAllAnswered();
      renderQuestionPalette();
      if (!opts.skipDraftSave) saveQuizDraft();
    }

    function restoreQuizDraft(draft) {
      if (!draft || !draft.answers) return false;
      let restoredAny = false;

      if (draft.studyMode && !urlModeParam && !isMistakeQuiz) {
        setStudyMode(draft.studyMode, true);
      }

      if (Array.isArray(draft.flaggedIds)) {
        draft.flaggedIds.forEach(fid => {
          const qKey = String(fid);
          flaggedQuestionIds.add(qKey);
          const card = document.querySelector(`.question-card[data-id="${qKey}"]`);
          const btn = document.getElementById('flag-btn-' + qKey);
          if (card) card.classList.add('flagged-card');
          if (btn) {
            btn.classList.add('flagged');
            btn.innerHTML = `${SVG_FLAG}<span>Phân vân</span>`;
          }
          restoredAny = true;
        });
      }

      quizData.forEach(q => {
        const val = draft.answers[String(q.id)];
        if (val === undefined || val === null) return;
        const validAnswers = q.answers.filter(a => a.text && a.text.trim() !== '');
        if (q.type === 'đs' && validAnswers.length > 0 && typeof val === 'object') {
          Object.entries(val).forEach(([k, v]) => {
            const parent = document.getElementById(`tf-${q.id}-${k}`);
            if (!parent) return;
            const targetBtn = parent.querySelector(`.tf-btn[data-val="${v}"]`);
            if (targetBtn) {
              parent.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected'));
              targetBtn.classList.add('selected');
              const seg = targetBtn.closest('.tf-toggles');
              if (seg) {
                const segIdx = v === 'Đ' ? '0' : '1';
                seg.setAttribute('data-selected', segIdx);
                seg.style.setProperty('--seg-index', segIdx);
              }
              restoredAny = true;
            }
          });
        } else if (q.type === 'cauhoi' && validAnswers.length > 0) {
          const opt = document.querySelector(`#answers-${q.id} .answer-option[data-key="${val}"]`);
          if (opt) {
            document.querySelectorAll(`#answers-${q.id} .answer-option`).forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            restoredAny = true;
          }
        } else {
          const inp = document.getElementById(`short-answer-${q.id}`);
          if (inp && typeof val === 'string') {
            inp.value = val;
            restoredAny = true;
          }
        }
      });

      if (Array.isArray(draft.checkedIds)) {
        draft.checkedIds.forEach(cid => {
          checkSingleQuestion(cid, { skipDraftSave: true, skipMistakeUpdate: true });
        });
      }

      return restoredAny;
    }

    function loadLessonInfo() {
      if (isMistakeQuiz) return;
      fetch('baihoc.json')
        .then(res => res.json())
        .then(data => {
          let searchCode = quizFile;
          if (quizFile.startsWith('ontap_')) {
            searchCode = 'baitap_' + quizFile.substring('ontap_'.length);
          }
          const baseCode = searchCode.replace(/^(baitap|ontap|cauhoi|đs|tln)_/, '');
          const codeParts = baseCode.split('_');
          const targetGrade = codeParts[0] || '';
          const targetChapter = codeParts[1] ? codeParts[1].replace('c', '') : '';
          const targetLesson = codeParts[2] ? codeParts[2].replace('b', '') : '';
          const romanMap = { 'I': '1', 'II': '2', 'III': '3', 'IV': '4', 'V': '5', 'VI': '6', 'VII': '7', 'VIII': '8', 'IX': '9', 'X': '10' };

          for (const gradeItem of data) {
            const gMatch = targetGrade && gradeItem.grade && gradeItem.grade.includes(targetGrade);
            for (const chapterItem of gradeItem.chapters) {
              let cRaw = chapterItem.num.replace(/chương/i, '').trim().toUpperCase();
              const cNum = romanMap[cRaw] || cRaw;

              for (const lessonItem of chapterItem.lessons) {
                const links = lessonItem.links || {};
                const lNum = lessonItem.num ? lessonItem.num.replace(/^0+/, '') : '';
                const tLessonClean = targetLesson.replace(/^0+/, '');

                const isMatchByLinks = Object.values(links).some(link => typeof link === 'string' && (link.includes(searchCode) || (baseCode && link.includes(baseCode))));
                const isMatchByStructure = gMatch && (cNum === targetChapter) && (lNum === tLessonClean);

                if (isMatchByLinks || isMatchByStructure) {
                  lessonInfo = {
                    grade: gradeItem.grade,
                    chapter: chapterItem.num + (chapterItem.title ? `: ${chapterItem.title}` : ''),
                    lesson: `Bài ${lessonItem.num}: ${lessonItem.title}`
                  };

                  const subtitleEl = document.getElementById('headerSubtitle');
                  if (subtitleEl) {
                    const modeText = isReviewMode ? 'Ôn tập chuyên sâu' : (quizFile.startsWith('baitap_') ? 'Bài tập về nhà' : 'Kiểm tra kiến thức Vật lí');
                    subtitleEl.textContent = `${lessonInfo.lesson} · ${modeText}`;
                  }
                  const h1El = document.querySelector('.header-info h1');
                  if (h1El) {
                    if (isReviewMode) {
                      h1El.innerHTML = 'Z<span>physics</span> — Ôn tập';
                    } else if (quizFile.startsWith('baitap_')) {
                      h1El.innerHTML = 'Z<span>physics</span> — Bài tập';
                    }
                  }
                  return;
                }
              }
            }
          }
        })
        .catch(err => console.error('Lỗi khi tải thông tin bài học:', err));
    }
    loadLessonInfo();

    function processQuizData(data) {
      if (!data || !Array.isArray(data) || data.length === 0) return false;

      const draft = isReviewMode ? null : loadQuizDraft();
      let part1 = [];
      let part2 = [];
      let part3 = [];
      const itemById = new Map();

      data.forEach((item, rawIdx) => {
        let type = 'cauhoi';
        if (item.type) {
          type = item.type;
        } else if (item.made) {
          if (item.made.startsWith('đs')) type = 'đs';
          else if (item.made.startsWith('tln')) type = 'tln';
        }

        const qId = (item.id !== undefined && item.id !== null) ? item.id : (900000 + rawIdx);
        const q = {
          id: qId,
          type: type,
          question: item.question,
          answers: item.answers || [
            { key: 'A', text: item.a },
            { key: 'B', text: item.b },
            { key: 'C', text: item.c },
            { key: 'D', text: item.d }
          ],
          correct: item.correct,
          explanation: item.explanation,
          _originMade: item.made || '',
          _originGrade: item.grade || '',
          _originLesson: item.lessonTitle || '',
          _originChapter: item.chapterTitle || ''
        };

        itemById.set(String(qId), q);
        if (type === 'cauhoi') part1.push(q);
        else if (type === 'đs') part2.push(q);
        else part3.push(q);
      });

      const shuffle = (arr) => {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      };

      let mappedData = null;

      if (draft && Array.isArray(draft.questionIds) && draft.questionIds.length > 0) {
        const restoredList = draft.questionIds.map(id => itemById.get(String(id))).filter(Boolean);
        if (restoredList.length > 0) {
          mappedData = restoredList;
        }
      }

      if (!mappedData) {
        part1 = shuffle(part1);
        part2 = shuffle(part2);
        part3 = shuffle(part3);

        if (isMistakeQuiz) {
          mappedData = [...part1, ...part2, ...part3];
        } else if (quizFile.startsWith('baitap_')) {
          part1 = part1.slice(0, 9);
          part2 = part2.slice(0, 2);
          part3 = part3.slice(0, 3);
          mappedData = [...part1, ...part2, ...part3];
        } else if (quizFile.startsWith('ontap_')) {
          mappedData = shuffle([...part1, ...part2, ...part3]);
        } else if (quizFile.startsWith('cauhoi')) {
          mappedData = part1.slice(0, 18);
        } else if (quizFile.startsWith('đs')) {
          mappedData = part2.slice(0, 4);
        } else if (quizFile.startsWith('tln')) {
          mappedData = part3.slice(0, 6);
        } else {
          mappedData = [...part1, ...part2, ...part3];
        }
      }

      quizData = mappedData;
      renderQuiz(mappedData);

      let initialTimerSec = null;
      if (draft && !isReviewMode) {
        const didRestore = restoreQuizDraft(draft);
        renderQuestionPalette();
        updateProgress();
        checkAllAnswered();
        if (didRestore) {
          updateAutosaveStatus('Đã khôi phục bài nháp', true);
          showToast('Đã khôi phục tiến trình làm bài trước đó', 'success');
        }
        if (typeof draft.timeRemaining === 'number' && draft.timeRemaining > 30) {
          initialTimerSec = draft.timeRemaining;
        }
      }

      startTimer(initialTimerSec);

      if (!autosaveIntervalId && !isReviewMode) {
        autosaveIntervalId = setInterval(() => {
          if (!submitted && !isReviewMode && Array.isArray(quizData) && quizData.length > 0) {
            saveQuizDraft();
          }
        }, 5000);
      }

      return true;
    }

    function loadQuizFromSupabase() {
      if (isMistakeQuiz) {
        const gradeMatch = quizFile.match(/^mistakes_(\d{2})$/);
        const gradeFilter = gradeMatch ? gradeMatch[1] : '';
        const allMistakes = getMistakesList();
        const filtered = gradeFilter
          ? allMistakes.filter(m => String(m.grade) === gradeFilter)
          : allMistakes;

        const h1El = document.querySelector('.header-info h1');
        if (h1El) h1El.innerHTML = 'Z<span>physics</span> — Sổ tay câu sai';
        const subtitleEl = document.getElementById('headerSubtitle');
        if (subtitleEl) {
          subtitleEl.textContent = `${filtered.length} câu cần ôn lại${gradeFilter ? ' · Lớp ' + gradeFilter : ''}`;
        }
        lessonInfo = {
          grade: gradeFilter ? `Vật lí ${gradeFilter}` : 'Tổng hợp',
          chapter: 'Sổ tay câu sai',
          lesson: 'Luyện lại các câu trả lời sai'
        };

        if (filtered.length === 0) {
          document.getElementById('quizContainer').innerHTML = `
            <div class="review-done-msg">
              <h2>Sổ tay câu sai hiện đang trống</h2>
              <p style="margin-bottom:16px;">Em chưa có câu trả lời sai nào${gradeFilter ? ' ở Lớp ' + gradeFilter : ''} hoặc đã khắc phục hết.</p>
              <a href="./" class="zp-primary-btn" style="text-decoration:none;">Quay lại trang chủ</a>
            </div>
          `;
          const tb = document.getElementById('studyToolbar');
          const pal = document.getElementById('questionPaletteCard');
          const sb = document.getElementById('submitBtn');
          if (tb) tb.style.display = 'none';
          if (pal) pal.style.display = 'none';
          if (sb) sb.style.display = 'none';
          return;
        }

        processQuizData(filtered);
        return;
      }

      const cacheKey = 'zphysics_quiz_cache_' + quizFile;
      let hasRendered = false;

      try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          const cachedData = JSON.parse(cached);
          if (Array.isArray(cachedData) && cachedData.length > 0) {
            hasRendered = processQuizData(cachedData);
          }
        }
      } catch (e) {}

      let url = `${SUPABASE_URL}/rest/v1/questions?made=eq.${encodeURIComponent(quizFile)}&select=*`;

      if (quizFile.startsWith('baitap_') || quizFile.startsWith('ontap_')) {
        const prefix = quizFile.startsWith('baitap_') ? 'baitap_' : 'ontap_';
        const rest = quizFile.substring(prefix.length);
        const inVals = `cauhoi_${rest},đs_${rest},tln_${rest}`;
        url = `${SUPABASE_URL}/rest/v1/questions?made=in.(${encodeURIComponent(inVals)})&select=*`;
      }

      fetch(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          if (!data || !Array.isArray(data) || data.length === 0) {
            if (!hasRendered) throw new Error('Đề thi trống hoặc mã đề không chính xác');
            return;
          }

          try {
            localStorage.setItem(cacheKey, JSON.stringify(data));
          } catch (e) {}

          if (!hasRendered) {
            processQuizData(data);
          }
        })
        .catch(err => {
          console.error(err);
          if (!hasRendered) {
            document.getElementById('quizContainer').innerHTML =
              '<div class="loading"><p style="color:var(--wrong);font-weight:500;font-size:14px">Không tải được đề từ Database Supabase.<br><small style="opacity:.7">'
              + (err.message || 'Hãy kiểm tra lại kết nối mạng và mã đề thi.')
              + '</small></p></div>';
          }
        });
    }

    loadQuizFromSupabase();

    function preprocessMath(text) {
      if (!text) return '';

      let res = text
        .replace(/\\bar\{Ed1\}/g, '\\overline{E_{d1}}')
        .replace(/\\bar\{Ed2\}/g, '\\overline{E_{d2}}')
        .replace(/\\bar\{Ed\}/g, '\\overline{E_d}')
        .replace(/\\bar\{E_d\}/g, '\\overline{E_d}')
        .replace(/\\bar\{E_đ\}/g, '\\overline{E_đ}')
        .replace(/\\bar\{v[²2]\}/g, '\\overline{v^2}')
        .replace(/\\bar\{s\}/g, '\\overline{s}')
        .replace(/\\bar\{t\}/g, '\\overline{t}')
        .replace(/\\bar\{v\}/g, '\\overline{v}')
        .replace(/\\bar\{\\Delta\s*t\}/g, '\\overline{\\Delta t}')
        .replace(/\\bar\{Δt\}/g, '\\overline{\\Delta t}');

      const mathRegex = /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\$[^\$\n]+?\$|\\\([\s\S]*?\\\))/g;
      const parts = res.split(mathRegex);
      const tokens = [];

      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          tokens.push(parts[i]);
          continue;
        }

        let p = parts[i];
        if (!p) continue;

        if (p.includes('\\')) {
          const hasVietnamese = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(p);

          if (!hasVietnamese && (/[=><≈±\/\^]/.test(p) || p.trim().startsWith('\\'))) {
            let clean = p.trim();
            let endPunct = '';
            if (/[.,;:]$/.test(clean)) {
              endPunct = clean.slice(-1);
              clean = clean.slice(0, -1).trim();
            }
            tokens.push('$' + clean + '$' + endPunct);
          } else {
            let replaced = p.replace(/(\\(?:overline|bar|hat|vec|dot|ddot|frac|sqrt)\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}|\\(?:Delta|delta|alpha|beta|gamma|lambda|mu|omega|Omega|pi|theta|sigma|rho|tau|phi|varphi|pm|approx|le|ge|times|cdot|ne|neq|Rightarrow|to)(?:\s+[a-zA-Z0-9_]+)?)/g, (m, g1) => '$' + g1.trim() + '$');
            tokens.push(replaced);
          }
        } else {
          tokens.push(p);
        }
      }
      return tokens.join('');
    }

    function triggerKaTeX(el) {
      const target = el || document.getElementById('quizContainer') || document.body;
      if (typeof renderMathInElement === 'function') {
        try {
          renderMathInElement(target, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '\\[', right: '\\]', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX render error:', e);
        }
      } else {
        let attempts = 0;
        const interval = setInterval(() => {
          attempts++;
          if (typeof renderMathInElement === 'function') {
            clearInterval(interval);
            triggerKaTeX(target);
          } else if (attempts > 20) {
            clearInterval(interval);
          }
        }, 150);
      }
    }

    function formatText(text) {
      if (!text) return '';
      text = preprocessMath(text);

      let html = text.replace(/\[img\](.*?)\[\/img\]/gi, '\n__IMG__$1__ENDIMG__\n');
      const imgUrlRegex = /(https?:\/\/[^\s<>"]+?(?:\.(?:jpg|jpeg|png|gif|webp|svg|bmp)(?:[?#][^\s<>"]*)?|(?:drive\.google\.com\/(?:file\/d\/[^/\s]+\/view|uc\?[^\s<>"]*export=download[^\s<>"]*|uc\?[^\s<>"]*id=[^\s<>"]+)|i\.imgur\.com\/[^\s<>"]+|ibb\.co\/[^\s<>"]+|postimg\.cc\/[^\s<>"]+|i\.postimg\.cc\/[^\s<>"]+)))/gi;
      html = html.replace(imgUrlRegex, '\n__IMG__$1__ENDIMG__\n');

      html = html.replace(/__IMG__(https?:\/\/drive\.google\.com\/file\/d\/([^/\s]+)\/view[^\s]*)__ENDIMG__/gi,
        function (match, url, fileId) {
          return `__IMG__https://drive.google.com/uc?export=view&id=${fileId}__ENDIMG__`;
        }
      );

      html = html.replace(/__IMG__(.*?)__ENDIMG__/gi,
        '<br><img src="$1" onerror="this.style.display=\'none\'" loading="lazy"><br>'
      );

      html = html.replace(/\n/g, '<br>');
      html = html.replace(/(<br\s*\/?>\s*){3,}/gi, '<br><br>');
      return html;
    }

    function renderQuiz(data) {

        rvWrong = 0;
        rvSkipped = 0;

            <span class="q-badge">Câu ${idx + 1}${sourceBadge}</span>
            <div class="q-header-right">
              <button type="button" class="q-flag-btn${isFlagged ? ' flagged' : ''}" id="flag-btn-${q.id}" onclick="toggleQuestionFlag('${q.id}')" title="Đánh dấu câu phân vân để xem lại sau">
                ${SVG_FLAG}<span>${isFlagged ? 'Phân vân' : 'Xem lại'}</span>

            <strong>Lời giải:</strong> ${formatText(q.explanation)}

    function showReviewCard() {

      if (rvIndex >= quizData.length) {

          <div class="review-done-msg">

            <span class="answer-text">${formatText(a.text)}</span>
          </label>

      } else {
        answersHTML = `
          <div style="display: flex; gap: 10px;">
