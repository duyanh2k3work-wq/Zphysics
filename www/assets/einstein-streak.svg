<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="flameGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FF7A00" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#FF2E00" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF2E00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5A0" />
      <stop offset="50%" stop-color="#FFC800" />
      <stop offset="100%" stop-color="#D48800" />
    </linearGradient>
    <linearGradient id="shades" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3142" />
      <stop offset="100%" stop-color="#0F1016" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D9E2EC" />
    </linearGradient>
  </defs>

  <!-- Background Flame Aura -->
  <circle cx="120" cy="120" r="105" fill="url(#flameGlow)" />
  <path d="M 120,15 Q 145,55 130,85 Q 165,60 170,105 Q 185,80 195,120 Q 205,170 120,220 Q 35,170 45,120 Q 55,80 70,105 Q 75,60 110,85 Q 95,55 120,15 Z" fill="#FF9600" opacity="0.35" />
  <path d="M 120,30 Q 140,65 128,90 Q 155,75 160,110 Q 175,150 120,200 Q 65,150 80,110 Q 85,75 112,90 Q 100,65 120,30 Z" fill="#FFC800" opacity="0.5" />

  <!-- White Lab Coat / Body -->
  <path d="M 75,175 Q 65,225 65,230 L 175,230 Q 175,225 165,175 Z" fill="#E2E8F0" />
  <path d="M 85,175 Q 80,225 80,230 L 160,230 Q 160,225 155,175 Z" fill="#FFFFFF" />
  <!-- Purple Tie / Sweater V -->
  <polygon points="120,175 110,210 120,225 130,210" fill="#582B9C" />
  <!-- Lapels -->
  <path d="M 85,175 L 115,190 L 105,230 Z" fill="#CBD5E1" />
  <path d="M 155,175 L 125,190 L 135,230 Z" fill="#CBD5E1" />

  <!-- Wild Einstein Hair (Back puffy clouds) -->
  <g fill="url(#hairGrad)">
    <circle cx="65" cy="85" r="26" />
    <circle cx="50" cy="115" r="24" />
    <circle cx="48" cy="142" r="20" />
    <circle cx="175" cy="85" r="26" />
    <circle cx="190" cy="115" r="24" />
    <circle cx="192" cy="142" r="20" />
    <circle cx="85" cy="62" r="28" />
    <circle cx="120" cy="52" r="30" />
    <circle cx="155" cy="62" r="28" />
    <!-- Hair tufts sticking out -->
    <path d="M 38,100 Q 20,95 28,115 Q 38,115 42,108 Z" />
    <path d="M 202,100 Q 220,95 212,115 Q 202,115 198,108 Z" />
    <path d="M 110,38 Q 120,16 132,36 Z" />
    <path d="M 75,48 Q 65,28 85,40 Z" />
    <path d="M 165,48 Q 175,28 155,40 Z" />
  </g>

  <!-- Head / Face -->
  <ellipse cx="120" cy="125" rx="50" ry="46" fill="#FED7AA" />
  <!-- Cute Pink Cheeks -->
  <ellipse cx="88" cy="142" rx="10" ry="6" fill="#FCA5A5" opacity="0.6" />
  <ellipse cx="152" cy="142" rx="10" ry="6" fill="#FCA5A5" opacity="0.6" />

  <!-- Bushy Mustache -->
  <path d="M 120,140 C 108,136 92,136 82,148 C 92,158 112,156 120,147 C 128,156 148,158 158,148 C 148,136 132,136 120,140 Z" fill="#F1F5F9" />
  <!-- Smirk / Grin under mustache -->
  <path d="M 110,154 Q 120,162 130,154" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- COOL SUNGLASSES -->
  <g>
    <!-- Bridge -->
    <rect x="113" y="112" width="14" height="4" rx="2" fill="#0F1016" />
    <!-- Left Lens Frame -->
    <rect x="74" y="104" width="40" height="26" rx="8" fill="url(#shades)" stroke="#0F1016" stroke-width="3" />
    <!-- Right Lens Frame -->
    <rect x="126" y="104" width="40" height="26" rx="8" fill="url(#shades)" stroke="#0F1016" stroke-width="3" />
    <!-- Lens Glare Reflections -->
    <polygon points="78,108 92,108 82,126 76,126" fill="#FFFFFF" opacity="0.45" />
    <polygon points="95,108 101,108 93,126 89,126" fill="#FFFFFF" opacity="0.3" />
    <polygon points="130,108 144,108 134,126 128,126" fill="#FFFFFF" opacity="0.45" />
    <polygon points="147,108 153,108 145,126 141,126" fill="#FFFFFF" opacity="0.3" />
    <!-- Star glint on frame corner -->
    <path d="M 74,104 L 77,101 L 80,104 L 77,107 Z" fill="#FFFFFF" />
  </g>

  <!-- Golden Champion Trophy (Held proudly on right side) -->
  <g transform="translate(170, 140)">
    <!-- Cup body -->
    <path d="M 10,10 L 40,10 L 36,32 Q 35,42 25,44 Q 15,42 14,32 Z" fill="url(#trophyGold)" stroke="#B45309" stroke-width="2" />
    <!-- Handles -->
    <path d="M 10,16 Q 0,18 4,28 Q 8,36 15,34" fill="none" stroke="#D48800" stroke-width="3" stroke-linecap="round" />
    <path d="M 40,16 Q 50,18 46,28 Q 42,36 35,34" fill="none" stroke="#D48800" stroke-width="3" stroke-linecap="round" />
    <!-- Stem & Base -->
    <rect x="22" y="44" width="6" height="12" fill="#D48800" />
    <path d="M 15,56 L 35,56 L 38,62 L 12,62 Z" fill="#78350F" />
    <!-- Star on trophy -->
    <polygon points="25,20 27,25 32,25 28,28 30,33 25,30 20,33 22,28 18,25 23,25" fill="#FFFFFF" />
    <!-- Sparkles -->
    <circle cx="5" cy="5" r="2.5" fill="#FFF5A0" />
    <circle cx="48" cy="8" r="2" fill="#FFF5A0" />
  </g>

  <!-- Left Hand Thumbs Up -->
  <g transform="translate(48, 175)">
    <circle cx="16" cy="18" r="10" fill="#FED7AA" />
    <!-- Thumb sticking up -->
    <rect x="12" y="0" width="8" height="15" rx="4" fill="#FED7AA" stroke="#FDBA74" stroke-width="1.5" />
    <!-- Knuckles -->
    <circle cx="10" cy="18" r="4" fill="#FED7AA" />
  </g>

  <!-- Floating Sparkles -->
  <polygon points="40,45 42,50 47,52 42,54 40,59 38,54 33,52 38,50" fill="#FFF066" />
  <polygon points="200,45 202,50 207,52 202,54 200,59 198,54 193,52 198,50" fill="#FFF066" />
</svg>
