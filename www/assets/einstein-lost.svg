<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="sadSpotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="rainTears" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Sad Gloomy Dark Background -->
  <circle cx="120" cy="120" r="110" fill="url(#sadSpotlight)" />

  <!-- Melancholy Spotlight Cone from above -->
  <polygon points="120,0 70,240 170,240" fill="#FFFFFF" opacity="0.08" />

  <!-- Little rain streaks / gloom lines -->
  <line x1="60" y1="30" x2="60" y2="60" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <line x1="180" y1="40" x2="180" y2="75" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <line x1="40" y1="80" x2="40" y2="120" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />
  <line x1="200" y1="90" x2="200" y2="130" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Broken Exploded Chemistry Flask at bottom -->
  <g transform="translate(160, 165)">
    <!-- Shattered glass shards -->
    <path d="M 0,35 L 12,25 L 20,40 Z" fill="#93C5FD" opacity="0.7" />
    <path d="M 25,30 L 35,22 L 40,36 Z" fill="#93C5FD" opacity="0.7" />
    <path d="M 12,42 L 28,44 L 20,52 Z" fill="#60A5FA" opacity="0.6" />
    <!-- Flask base cracked -->
    <path d="M 8,35 Q 22,25 36,35 L 32,50 L 12,50 Z" fill="#3B82F6" opacity="0.4" stroke="#1D4ED8" stroke-width="1.5" />
    <!-- Green chemical spill puddle -->
    <ellipse cx="22" cy="52" rx="26" ry="6" fill="#10B981" opacity="0.8" />
    <!-- Smoke puff rising from broken beaker -->
    <circle cx="15" cy="18" r="7" fill="#64748B" opacity="0.5" />
    <circle cx="24" cy="8" r="10" fill="#475569" opacity="0.4" />
    <circle cx="18" cy="-5" r="12" fill="#334155" opacity="0.3" />
  </g>

  <!-- Drooping, Sad Einstein Hair (disheveled and sagging) -->
  <g fill="#CBD5E1">
    <circle cx="62" cy="95" r="25" />
    <circle cx="50" cy="125" r="23" />
    <circle cx="48" cy="155" r="20" />
    <circle cx="178" cy="95" r="25" />
    <circle cx="190" cy="125" r="23" />
    <circle cx="192" cy="155" r="20" />
    <circle cx="82" cy="75" r="26" />
    <circle cx="120" cy="65" r="28" />
    <circle cx="158" cy="75" r="26" />
    <!-- Drooping hair strands -->
    <path d="M 40,140 Q 30,165 44,170 Q 52,160 48,145 Z" />
    <path d="M 200,140 Q 210,165 196,170 Q 188,160 192,145 Z" />
  </g>
  <!-- Black Soot smudges on hair -->
  <circle cx="70" cy="80" r="14" fill="#334155" opacity="0.6" />
  <circle cx="165" cy="85" r="16" fill="#334155" opacity="0.6" />
  <circle cx="125" cy="58" r="12" fill="#1E293B" opacity="0.7" />

  <!-- Sad Slumped Lab Coat -->
  <path d="M 75,185 Q 65,225 65,235 L 175,235 Q 175,225 165,185 Z" fill="#94A3B8" />
  <path d="M 88,185 L 82,235 L 158,235 L 152,185 Z" fill="#E2E8F0" />
  <!-- Soot explosion burns on coat -->
  <ellipse cx="90" cy="210" rx="15" ry="8" fill="#1E293B" opacity="0.7" />
  <ellipse cx="145" cy="215" rx="12" ry="7" fill="#1E293B" opacity="0.7" />

  <!-- Sad Drooping Head -->
  <ellipse cx="120" cy="136" rx="48" ry="44" fill="#FED7AA" />

  <!-- Black soot patch on cheek and nose -->
  <ellipse cx="92" cy="136" rx="10" ry="6" fill="#475569" opacity="0.7" />
  <ellipse cx="120" cy="132" rx="8" ry="5" fill="#334155" opacity="0.8" />
  <ellipse cx="145" cy="142" rx="12" ry="7" fill="#475569" opacity="0.6" />

  <!-- SADCUTE BIG TEARY EYES (Pouty Chibi) -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="96" cy="126" rx="13" ry="15" fill="#1E293B" />
    <circle cx="93" cy="121" r="5" fill="#FFFFFF" />
    <circle cx="102" cy="133" r="2.5" fill="#93C5FD" />
    <!-- Sad angled eyebrow -->
    <path d="M 84,112 Q 98,118 108,114" stroke="#64748B" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Right Eye -->
    <ellipse cx="144" cy="126" rx="13" ry="15" fill="#1E293B" />
    <circle cx="141" cy="121" r="5" fill="#FFFFFF" />
    <circle cx="150" cy="133" r="2.5" fill="#93C5FD" />
    <!-- Sad angled eyebrow -->
    <path d="M 132,114 Q 142,118 156,112" stroke="#64748B" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Huge Cartoon Tear dripping from left eye -->
    <path d="M 88,136 Q 84,152 82,160 Q 76,170 86,170 Q 94,170 90,158 Q 88,148 88,136 Z" fill="#38BDF8" opacity="0.9" />
    <circle cx="85" cy="165" r="2.5" fill="#FFFFFF" />

    <!-- Tear welling on right eye -->
    <ellipse cx="148" cy="139" rx="5" ry="3" fill="#38BDF8" opacity="0.8" />
  </g>

  <!-- Drooping Sad Bushy Mustache -->
  <path d="M 120,147 C 108,144 86,148 76,165 C 88,172 108,166 120,157 C 132,166 152,172 164,165 C 154,148 132,144 120,147 Z" fill="#E2E8F0" />

  <!-- Pouty Trembling Downward Mouth -->
  <path d="M 112,172 Q 120,165 128,172" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- STREAK = 0 NOOOOO! BADGE AT BOTTOM -->
  <g transform="translate(45, 195)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="#1E293B" stroke="#475569" stroke-width="2.5" />
    <text x="20" y="24" fill="#94A3B8" font-family="'Nunito', sans-serif" font-weight="900" font-size="16">🔥 0</text>
    <text x="62" y="24" fill="#F87171" font-family="'Nunito', sans-serif" font-weight="900" font-size="14">NOOOOO!</text>
  </g>
</svg>
