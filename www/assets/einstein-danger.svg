<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="dangerBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF4B4B" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#B91C1C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#450A0A" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="electricZap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Alarm Background Ring -->
  <circle cx="120" cy="120" r="110" fill="url(#dangerBg)" />
  
  <!-- Flashing Alarm Siren Waves -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#FF8787" stroke-width="4" stroke-dasharray="16 10" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Smoking Burning Chalkboard behind -->
  <g transform="translate(145, 30)">
    <rect x="0" y="0" width="80" height="60" rx="6" fill="#1E293B" stroke="#B45309" stroke-width="3" />
    <text x="8" y="24" fill="#38BDF8" font-family="'Nunito', sans-serif" font-weight="900" font-size="12">E=mc²</text>
    <text x="8" y="44" fill="#F87171" font-family="'Nunito', sans-serif" font-weight="900" font-size="11">F=ma 🔥</text>
    <!-- Flames licking board -->
    <path d="M 60,10 Q 75,-10 68,15 Q 85,0 75,30 Z" fill="#FF7A00" />
    <path d="M 64,12 Q 74,-2 70,16 Q 80,6 74,25 Z" fill="#FFD600" />
    <!-- Smoke puff -->
    <circle cx="70" cy="-10" r="10" fill="url(#smokeGrad)" />
    <circle cx="82" cy="-22" r="14" fill="url(#smokeGrad)" />
  </g>

  <!-- Lab Coat with burn singes -->
  <path d="M 70,180 L 60,230 L 180,230 L 170,180 Z" fill="#E2E8F0" />
  <path d="M 85,180 L 80,230 L 160,230 L 155,180 Z" fill="#FFFFFF" />
  <!-- Disheveled crooked tie -->
  <polygon points="120,180 105,215 118,225 125,215" fill="#EF4444" />
  <!-- Ash smudges on coat -->
  <ellipse cx="80" cy="210" rx="8" ry="4" fill="#475569" opacity="0.6" />
  <ellipse cx="160" cy="205" rx="10" ry="5" fill="#475569" opacity="0.6" />

  <!-- WILD ELECTRIFIED STANDING-ON-END SPIKY HAIR -->
  <g fill="#F8FAFC" stroke="#94A3B8" stroke-width="2">
    <!-- Center top spikes blasted upward -->
    <path d="M 100,60 L 90,-5 L 115,50 Z" />
    <path d="M 110,50 L 122,-18 L 135,48 Z" />
    <path d="M 128,52 L 150,-10 L 145,55 Z" />
    <!-- Left spikes -->
    <path d="M 85,65 L 45,15 L 98,75 Z" />
    <path d="M 70,80 L 15,45 L 80,95 Z" />
    <path d="M 60,105 L 5,90 L 68,120 Z" />
    <path d="M 55,130 L 10,140 L 65,145 Z" />
    <!-- Right spikes -->
    <path d="M 150,65 L 195,15 L 140,75 Z" />
    <path d="M 165,80 L 225,45 L 155,95 Z" />
    <path d="M 175,105 L 235,90 L 170,120 Z" />
    <path d="M 180,130 L 228,140 L 172,145 Z" />
    <!-- Hair core volume -->
    <circle cx="85" cy="80" r="30" />
    <circle cx="155" cy="80" r="30" />
    <circle cx="120" cy="65" r="32" />
  </g>

  <!-- Big Electric Sparks zapping through hair -->
  <path d="M 115,10 L 125,25 L 118,30 L 132,48" stroke="url(#electricZap)" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 40,35 L 55,45 L 48,52 L 68,65" stroke="url(#electricZap)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 205,35 L 190,45 L 196,52 L 175,65" stroke="url(#electricZap)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <polygon points="120,-8 123,-2 130,0 124,3 125,10 119,5 113,8 115,1 110,-3 117,-4" fill="#FDE047" />

  <!-- Panicked Head / Face -->
  <ellipse cx="120" cy="130" rx="52" ry="48" fill="#FED7AA" />
  <!-- Purple stress lines on forehead -->
  <path d="M 105,98 L 105,108 M 112,96 L 112,108 M 120,95 L 120,108 M 128,96 L 128,108 M 135,98 L 135,108" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" />

  <!-- Sweat Drops Flying -->
  <path d="M 62,110 Q 55,102 52,108 Q 50,118 60,116 Z" fill="#67E8F9" />
  <path d="M 178,110 Q 185,102 188,108 Q 190,118 180,116 Z" fill="#67E8F9" />

  <!-- WIDE PANICKED ANIME EYES -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="94" cy="120" rx="16" ry="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <!-- Trembling tiny pupil -->
    <circle cx="94" cy="120" r="5" fill="#0F172A" />
    <circle cx="92" cy="118" r="2" fill="#FFFFFF" />
    <!-- Shock squiggles around eye -->
    <path d="M 76,108 Q 80,104 84,106" stroke="#991B1B" stroke-width="2" fill="none" />

    <!-- Right Eye -->
    <ellipse cx="146" cy="120" rx="16" ry="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <!-- Trembling tiny pupil -->
    <circle cx="146" cy="120" r="5" fill="#0F172A" />
    <circle cx="144" cy="118" r="2" fill="#FFFFFF" />
    <!-- Shock squiggles -->
    <path d="M 164,108 Q 160,104 156,106" stroke="#991B1B" stroke-width="2" fill="none" />
  </g>

  <!-- Bushy Mustache trembling -->
  <path d="M 120,146 C 106,140 88,142 78,154 C 90,164 110,160 120,152 C 130,160 150,164 162,154 C 152,142 134,140 120,146 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Open Screaming / Panting Mouth -->
  <path d="M 108,162 Q 120,156 132,162 Q 120,182 108,162 Z" fill="#881337" stroke="#4C0519" stroke-width="2" />
  <ellipse cx="120" cy="172" rx="6" ry="4" fill="#FB7185" />

  <!-- Hands grasping cheeks in panic -->
  <circle cx="68" cy="148" r="12" fill="#FED7AA" stroke="#FDBA74" stroke-width="2" />
  <circle cx="172" cy="148" r="12" fill="#FED7AA" stroke="#FDBA74" stroke-width="2" />

  <!-- DIGITAL COUNTDOWN TIMER BADGE AT BOTTOM -->
  <g transform="translate(48, 195)">
    <rect x="0" y="0" width="144" height="36" rx="18" fill="#111827" stroke="#EF4444" stroke-width="3" />
    <circle cx="20" cy="18" r="8" fill="#EF4444" />
    <path d="M 20,13 L 20,18 L 24,20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="36" y="24" fill="#EF4444" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" letter-spacing="1">48:36</text>
    <text x="96" y="23" fill="#FCA5A5" font-family="'Nunito', sans-serif" font-weight="900" font-size="11">CỨU NGAY!</text>
  </g>
</svg>
