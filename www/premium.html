<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zphysics — Kích hoạt Premium</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07080d;
      --bg: #0b0d14;
      --card: #11141c;
      --raised: #1a1e28;
      --border: rgba(238, 240, 245, 0.08);
      --border-strong: rgba(238, 240, 245, 0.14);
      --text: #eef0f5;
      --text-secondary: #a3a9b8;
      --muted: #7a8296;
      --accent: #2dd4bf;
      --accent-subtle: rgba(45, 212, 191, 0.12);
      --correct: #4cc38a;
      --wrong: #e5484d;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .activation-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border-strong);
      padding: 36px 28px;
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 28px;
      letter-spacing: -0.01em;
    }

    .logo span {
      color: var(--accent);
    }

    .loader-container {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      border: 2.5px solid var(--border-strong);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 900ms linear infinite;
    }

    .success-icon,
    .state-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--accent-subtle);
      border: 1px solid rgba(45, 212, 191, 0.35);
      color: var(--accent);
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 220ms var(--ease), transform 220ms var(--ease);
    }

    .state-icon.is-muted {
      background: var(--raised);
      border-color: var(--border-strong);
      color: var(--text-secondary);
    }

    .state-icon.is-error {
      background: rgba(229, 72, 77, 0.12);
      border-color: rgba(229, 72, 77, 0.35);
      color: var(--wrong);
    }

    .success-icon.show,
    .state-icon.show {
      opacity: 1;
      transform: scale(1);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .status-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      min-height: 44px;
    }

    .error-box {
      display: none;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--bg-deep);
      background: var(--text);
      text-decoration: none;
      transition: opacity 150ms var(--ease), transform 150ms var(--ease);
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--raised);
      border: 1px solid var(--border-strong);
      color: var(--text);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="activation-card">
    <div class="logo">Z<span>physics</span></div>

    <div class="loader-container">
      <div class="spinner" id="spinner"></div>
      <div class="success-icon" id="successIcon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="state-icon" id="stateIcon"></div>
    </div>

    <div class="status-title" id="statusTitle">Đang xử lý kích hoạt</div>
    <div class="status-desc" id="statusDesc">Đang kết nối hệ thống và kiểm tra tài khoản của em.</div>

    <div class="error-box" id="errorBox">
      <a href="index.html" class="btn" id="errorBtn">Quay lại trang chủ</a>
    </div>
  </div>

  <script>
    const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbzxnkAXTX9lMgdq854Nm8CAWiaULzHD7MAo4Er7XBVnmfxhubWP4KWSF5_yNfVaCKXMdQ/exec';
    const SESSION_KEY = 'zphysics_session';

    function getSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function saveSession(session) {
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      } catch (e) {
        console.error('Không thể lưu session:', e);
      }
    }

    async function startActivation() {
      const session = getSession();
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');
      const spinner = document.getElementById('spinner');
      const successIcon = document.getElementById('successIcon');
      const stateIcon = document.getElementById('stateIcon');
      const errorBox = document.getElementById('errorBox');
      const errorBtn = document.getElementById('errorBtn');

      if (!session || !session.gmail) {
        spinner.style.display = 'none';
        stateIcon.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
        stateIcon.className = 'state-icon is-muted show';
        statusTitle.textContent = 'Chưa đăng nhập';
        statusDesc.textContent = 'Em cần đăng nhập tài khoản Zphysics trước khi kích hoạt gói Premium.';
        errorBtn.textContent = 'Đi tới trang đăng nhập';
        errorBox.style.display = 'block';
        return;
      }

      const gmail = session.gmail;
      statusTitle.textContent = 'Đang kích hoạt Premium';
      statusDesc.textContent = `Đang nâng cấp tài khoản trọn đời cho ${gmail}...`;

      try {
        const url = `${SHEETS_API_URL}?action=upgradePremium&gmail=${encodeURIComponent(gmail)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Không thể kết nối với máy chủ kích hoạt');
        const data = await res.json();

        if (data && data.success) {
          session.premium = true;
          session.premium_until = null;
          saveSession(session);

          spinner.style.display = 'none';
          successIcon.classList.add('show');

          statusTitle.textContent = 'Kích hoạt thành công';
          statusDesc.textContent = 'Tài khoản đã được nâng cấp lên gói Premium trọn đời. Đang chuyển hướng về trang chủ.';

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 3500);
        } else {
          throw new Error(data.message || 'Lỗi hệ thống kích hoạt');
        }
      } catch (err) {
        console.error(err);
        spinner.style.display = 'none';
        stateIcon.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        stateIcon.className = 'state-icon is-error show';
        statusTitle.textContent = 'Lỗi kích hoạt';
        statusDesc.textContent = err.message || 'Có lỗi xảy ra trong quá trình kích hoạt, vui lòng thử lại hoặc liên hệ giáo viên.';
        errorBtn.textContent = 'Thử lại';
        errorBtn.href = 'javascript:window.location.reload()';
        errorBox.style.display = 'block';

        const backBtn = document.createElement('a');
        backBtn.className = 'btn btn-secondary';
        backBtn.href = 'index.html';
        backBtn.textContent = 'Quay về trang chủ';
        errorBox.appendChild(backBtn);
      }
    }

    window.addEventListener('DOMContentLoaded', startActivation);
  </script>
</body>

</html>
